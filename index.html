<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOP PICK – Basketball Manager</title>
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TOP PICK">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&family=Russo+One&display=swap">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0f1e;--p2:#0d1527;--ln:rgba(255,255,255,.08);--fg:#e8eefc;--sub:#9aa8c3;--mut:#65738c;--acc:#ff9a3c;--acc2:#ff9a3c;--sky:#7dd3fc;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:'Barlow',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% -180px,#1b2752 0%,var(--bg) 70%) fixed}
button,input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.kick{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.h1{font-size:23px;font-weight:900;margin:2px 0 4px}
.h2{font-size:16px;font-weight:800}
.sub{color:var(--sub);font-size:13px;line-height:1.55}
.s{font-size:12px}.mut{color:var(--mut)}.b{font-weight:800}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}.between{justify-content:space-between}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:14px;padding:14px 16px;border-radius:13px;background:var(--acc);color:#2a1300;width:100%}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1b2742;color:#dbe7ff;border:1px solid var(--ln)}
.btn.ok{background:#34d399;color:#03170d}
.btn.warn{background:#fbbf24;color:#2a1800}
.btn.bad{background:#fb7185;color:#2b0710}
.btn.sm{width:auto;padding:9px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.38;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--sub);white-space:nowrap}
.chip.ok{border-color:rgba(52,211,153,.4);color:var(--ok);background:rgba(52,211,153,.08)}
.chip.bad{border-color:rgba(251,113,133,.4);color:var(--bad);background:rgba(251,113,133,.08)}
.chip.acc{border-color:rgba(var(--acc-rgb),.45);color:var(--acc);background:rgba(var(--acc-rgb),.1)}
button.chip{cursor:pointer;padding:7px 11px}
.badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;overflow:hidden}
.badge.lg{width:52px;height:52px;border-radius:14px;font-size:13px}
.badge img{width:100%;height:100%;object-fit:contain}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--p2);border:1px solid var(--ln);border-radius:12px}
.item.tap{cursor:pointer}
.item.on{border-color:var(--ok);background:rgba(52,211,153,.08)}
.item.off{opacity:.45}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:22px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,15,30,0),rgba(10,15,30,.95) 40%);pointer-events:none}
.cta .in{max-width:560px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.cta .in .btn{flex:1}
.seg{display:flex;gap:6px}
.segb{flex:1;padding:12px 0;border-radius:11px;border:1px solid var(--ln);background:var(--p2);font-weight:900;font-size:16px;cursor:pointer}
.segb.on{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.12)}
.inp{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:12px;font-weight:700;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamb{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;text-align:left;font-size:12px;font-weight:800;line-height:1.2}
.die{font-size:30px;width:38px;text-align:center}
.tut{position:fixed;inset:0;z-index:400;pointer-events:none}.tut.hidden{display:none}
.tut-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(3,6,15,.66),0 0 0 2px var(--acc),0 0 24px rgba(255,154,60,.55);transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tut-hole.none{box-shadow:none;width:0!important;height:0!important}
.tut-bub{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;pointer-events:auto;background:#16213f;border:1px solid rgba(255,154,60,.6);border-radius:16px;padding:12px;display:flex;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.55);animation:su .22s ease-out}
.tut-bub.top{top:calc(12px + env(safe-area-inset-top))}.tut-bub.bot{bottom:calc(14px + env(safe-area-inset-bottom))}
.tut-av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#0a0f1e;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.tut-txt{font-size:14px;line-height:1.5;color:var(--fg)}
.tut-act{display:flex;align-items:center;gap:10px;margin-top:9px}
.tut-skip{background:none;border:0;color:var(--sub);font:inherit;font-size:12px;font-weight:700;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tut-n{margin-left:auto;font-size:11px}
.tut-next{width:auto!important;flex:0 0 auto!important;padding:8px 16px!important;margin:0!important}
.tabs.wrap4 .tab{font-size:12px;padding:9px 2px}
/* ── Kartenalbum: Skins ── */
.card.sk{--skA:.62;--skC:rgba(255,255,255,.22);--glC:#fff}
.card.sk.sk-full{--skA:1}
.card.sk-gold{--skC:rgba(255,236,179,.24);--glC:#fff4c4}
.card.sk-obs{--skC:rgba(233,213,255,.2);--glC:#e9d5ff}
.card.sk-silver:not(.art){border-color:#cbd5e1!important}
.card.sk-gold:not(.art){border-color:#f5c451!important}
.card.sk-obs:not(.art){border-color:#7c3aed!important}
.card.sk-obs{box-shadow:0 0 7px rgba(147,51,234,.35)}
.sk-r{position:absolute;inset:0;border-radius:inherit;padding:max(2.4cqw,2px);pointer-events:none;z-index:6;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card.mini .sk-r{padding:max(1.8cqw,1.5px)}
.sk-silver .sk-r{background:linear-gradient(135deg,#f8fafc 0%,#94a3b8 22%,#e2e8f0 45%,#64748b 68%,#cbd5e1 85%,#f1f5f9 100%)}
.sk-gold .sk-r{background:linear-gradient(135deg,#fef3c7 0%,#c58a1c 22%,#fde68a 45%,#8a5a12 68%,#f5c451 85%,#fffbeb 100%)}
.sk-obs .sk-r{background:linear-gradient(120deg,#12071f 0%,#4c1d95 18%,#1e0b36 34%,#9333ea 52%,#2e1065 68%,#c084fc 84%,#12071f 100%);background-size:300% 100%;animation:skflow 14s ease-in-out infinite alternate;animation-delay:var(--skF,0s)}
@keyframes skflow{from{background-position:0% 50%}to{background-position:100% 50%}}
.sk-sw{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:5;opacity:var(--skA)}
.sk-sw::before{content:'';position:absolute;top:-25%;bottom:-25%;left:-60%;width:42%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 28%,var(--skC) 50%,rgba(255,255,255,0) 72%,rgba(255,255,255,0) 100%);transform:translateX(0) skewX(-12deg);animation:sksw 4.6s linear infinite;animation-delay:var(--skD,0s)}
@keyframes sksw{from{transform:translateX(0) skewX(-12deg)}to{transform:translateX(400%) skewX(-12deg)}}
.card .gl{--gs:max(3.4cqw,5px);position:absolute;width:var(--gs);height:var(--gs);margin:calc(var(--gs)/-2) 0 0 calc(var(--gs)/-2);z-index:7;pointer-events:none;background:var(--glC);
 clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:skgl var(--gd,4s) ease-in-out infinite;animation-delay:var(--gdl,0s)}
.card.sk:not(.sk-full) .gl{animation-name:skglD}
@keyframes skgl{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.85;transform:scale(1) rotate(45deg)}}
@keyframes skglD{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.55;transform:scale(.9) rotate(45deg)}}
.rm .sk-sw,.rm .card .gl{display:none}.rm .sk-obs .sk-r{animation:none}
/* ── Kartenalbum: Ansicht ── */
.cw.alb{position:relative;cursor:pointer}
.alb-l .card{filter:blur(4px) saturate(.35) brightness(.45)}
.alb-lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;pointer-events:none;color:#cbd5e1;text-align:center}
.alb-lk span{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.alb-lk small{font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(3,6,15,.6);border-radius:6px;padding:1px 6px}
.alb-n{position:absolute;top:-6px;left:-5px;z-index:9;background:var(--acc);color:#0b1020;font-size:9px;font-weight:900;letter-spacing:.04em;border-radius:999px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.alb-new .card{animation:albun 1.5s ease-out both}
@keyframes albun{0%{filter:blur(6px) saturate(.3) brightness(.4);transform:scale(.94)}60%{filter:blur(0) saturate(1) brightness(1.15)}100%{filter:none;transform:none}}
.alb-up .card{animation:albup .9s ease-out both}
@keyframes albup{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.rm .alb-new .card,.rm .alb-up .card{animation:none}
.alb-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.alb-bar i{display:block;height:100%}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.skb{border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);border-radius:10px;padding:8px 2px 7px;font:inherit;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.skb.on{border-color:var(--acc);background:rgba(255,255,255,.08);box-shadow:0 0 0 1px var(--acc) inset}
.skb:disabled{opacity:.38;cursor:default}
.skb .skd{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:#1e293b}
.skb.k-silver .skd{background:linear-gradient(135deg,#f8fafc,#94a3b8 40%,#e2e8f0 60%,#64748b)}
.skb.k-gold .skd{background:linear-gradient(135deg,#fef3c7,#c58a1c 40%,#fde68a 60%,#8a5a12)}
.skb.k-obs .skd{background:linear-gradient(135deg,#12071f,#7c3aed 45%,#2e1065 65%,#c084fc)}
.alb-lv{display:flex;gap:10px;align-items:flex-start}
.alb-lv .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;background:rgba(255,255,255,.06)}
.t-name,.menu-head .t-name{font-family:'Russo One','Barlow Condensed',sans-serif;font-weight:400;letter-spacing:.04em;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;line-height:1;
 text-shadow:0 1px 0 #c9d1de,0 2px 0 #9aa4b5,0 3px 0 #6b7486,0 4px 0 #485063,0 6px 8px rgba(0,0,0,.55),0 10px 18px rgba(0,0,0,.35)}
.menu-head .t-name{text-shadow:0 1px 0 #c9d1de,0 2px 0 #8a94a6,0 3px 0 #535c6e,0 5px 6px rgba(0,0,0,.55),0 8px 14px rgba(0,0,0,.35)}
.t-sub{color:#8b95a7;font-family:'Barlow',sans-serif;font-weight:700;letter-spacing:.32em;text-shadow:0 1px 0 #000,0 2px 4px rgba(0,0,0,.6)}
/* ── Menü (Stand 50) ── */
.mtop{display:flex;justify-content:space-between;align-items:center;min-height:42px;margin-bottom:-4px}
.mgear{width:42px;height:42px;border-radius:13px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.mgear .ic{width:23px;height:23px}
.macc{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:rgba(255,255,255,.04);border-radius:13px;padding:5px 11px 5px 5px;height:42px;color:var(--fg);font:inherit;cursor:pointer;max-width:62%;min-width:0}
.macc>b{font-size:13px;font-weight:800;white-space:nowrap}
.macc .ma-t{display:flex;flex-direction:column;line-height:1.15;text-align:left;min-width:0}
.macc .ma-t b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macc .ma-t small{font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:3px}
.macc .ma-t small .ic{width:13px;height:13px}
.macc .ma-t small.off{color:var(--mut)}
.macc .ma-l{width:30px;height:30px;border-radius:22%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.macc .ma-l .ic{width:18px;height:18px}
.alogo{border-radius:22%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#14213d}
.alogo img{width:100%;height:100%;object-fit:cover;display:block}
.alogo .ic{width:58%;height:58%}
.mcard{position:relative;display:block;width:100%;text-align:left;border-radius:18px;padding:19px 14px;margin-top:12px;overflow:hidden;border:1px solid var(--mbd);background:var(--mbg);color:var(--fg);cursor:pointer;min-height:88px;-webkit-tap-highlight-color:transparent}
.mcard:active{transform:scale(.99)}
.mcard.live{border:1.5px solid var(--mc);padding:17px 14px 16px}
.mc-art{position:absolute;right:-10px;top:-14px;width:96px;transform:rotate(13deg);z-index:1;pointer-events:none}
.mcard.live .mc-art{width:106px;top:-8px}
.mc-art .card{box-shadow:0 6px 16px rgba(0,0,0,.45)}
.mc-fade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--mbg) 50%,color-mix(in srgb,var(--mbg) 55%,transparent) 70%,color-mix(in srgb,var(--mbg) 0%,transparent) 90%)}
.mc-in{position:relative;z-index:3}
.mc-row{display:flex;gap:12px;align-items:center;padding-right:64px}
.mc-ic{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--mc);font-size:24px}
.mc-ic .ic{width:26px;height:26px}
.mc-t{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:800;font-size:23px;line-height:1.1;color:#fff}
.mc-s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.35}
.mc-live{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mc);background:color-mix(in srgb,var(--mc) 13%,transparent);border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);border-radius:999px;padding:2px 8px;margin-bottom:8px}
.mc-go{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:236px}
.mc-bar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.mc-bar i{display:block;height:100%;background:var(--mc)}
.mc-btn{background:var(--mc);color:#1a1205;border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;margin-left:auto}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mtile{position:relative;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--ln);border-radius:16px;padding:12px;color:var(--fg);font:inherit;cursor:pointer}
.mtile .mc-ic{width:36px;height:36px;border-radius:11px;margin-bottom:9px;font-size:18px}
.mtile .mc-ic .ic{width:20px;height:20px}
.mtile .mc-t{font-size:17px}.mtile .mc-s{font-size:12px}
.mbadge{position:absolute;top:10px;right:10px;background:#a855f7;color:#1e0533;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
/* ── Konto ── */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.agb{border:1.5px solid var(--ln);background:rgba(255,255,255,.03);border-radius:12px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;line-height:1.15;text-align:center}
.agb.on{border-color:var(--acc);background:rgba(var(--acc-rgb),.1);color:var(--fg)}
.pwf{position:relative}.pwf .inp{padding-right:44px}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pweye .ic{width:19px;height:19px}
.acc-ns{min-height:18px;margin-top:6px;font-size:12.5px;font-weight:700}
.acc-ns.ok{color:var(--ok)}.acc-ns.bad{color:var(--bad)}.acc-ns.mut{color:var(--mut)}
.acc-msg{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.45}
.acc-msg.bad{background:rgba(251,113,133,.12);color:var(--bad)}.acc-msg.ok{background:rgba(52,211,153,.12);color:var(--ok)}
.alink{color:var(--acc);font-weight:800;cursor:pointer;text-decoration:none}
.acc-sync{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:12.5px;font-weight:700}
.acc-sync .ic{width:16px;height:16px}.acc-sync.off{color:var(--mut)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.gbtn:disabled{opacity:.6}
.gbtn svg{width:20px;height:20px;flex-shrink:0}
.aor{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;font-weight:700;margin:14px 0 2px}
.aor:before,.aor:after{content:'';flex:1;height:1px;background:var(--ln)}
/* ── Menü-Hintergrund: Spielfeld + Blitze ── */
#mbg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background-color:#0a0f1e;background-image:var(--mbg-grain,none),radial-gradient(120% 80% at 50% 35%,#13204a 0%,#0c1430 45%,#0a0f1e 100%);background-repeat:repeat,no-repeat}
#mbg.on{opacity:1}
#mbg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;transform:perspective(1160px) rotateX(50deg) rotateY(-2deg);transform-origin:50% 25%}
#mbg:before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(135deg,rgba(5,8,16,.92) 0%,rgba(5,8,16,.55) 22%,rgba(5,8,16,0) 52%);opacity:.35}
#mbg:after{content:'';position:absolute;inset:0;z-index:1;background:radial-gradient(75% 75% at 50% 40%,rgba(10,15,30,0) 55%,rgba(5,8,15,.85) 100%)}
#mbg .ln{fill:none;stroke:rgba(225,236,255,.125);stroke-width:.5;stroke-linecap:round}
#mbg .bolt{fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:14 3000;stroke-dashoffset:20}
#mbg .boltH{fill:none;stroke:#a9cbff;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:14 3000;stroke-dashoffset:20;opacity:0}
body.mbg-on{background:transparent}
.mcard{background:color-mix(in srgb,var(--mbg) 88%,transparent)}

/* ── Fenster: App installieren ── */
.inst-ic{width:64px;height:64px;border-radius:16px;margin:2px auto 0;background:#0a0f1e;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;color:#f97316}

.inst-no{display:block;width:100%;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;font-weight:700;margin-top:10px;cursor:pointer;padding:6px}
.mcard .mc-t{font-size:27px;line-height:1.05;font-weight:900}

.mcard{min-height:92px;display:flex;align-items:center}.mcard.live{display:block}
.mtile{padding:16px 14px}.mtile .mc-t{font-size:20px}.mtile .mc-s{margin-top:3px}

.panel .langsw{margin:2px 0 0}
.code{font-size:42px;font-weight:900;letter-spacing:.3em;color:var(--acc);margin:4px 0;font-variant-numeric:tabular-nums}

/* Header */
#hdr{position:sticky;top:0;z-index:20;background:rgba(10,15,30,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}

.htop{display:flex;align-items:center;gap:10px}
.tn{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{font-size:11px;color:var(--sub);font-weight:700}
.hst{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}

.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;font-size:16px;flex-shrink:0}
/* Karten – Platzhalter im Stil der echten TOP-PICK-Karten */
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:10px;border:2px solid;overflow:hidden;container-type:inline-size;color:#fff}
.card.img{border:0;background:none}

.c-sal{position:absolute;left:3cqw;top:5cqw;writing-mode:vertical-rl;transform:rotate(180deg);font-size:6.5cqw;font-weight:900;letter-spacing:.08em;color:#86efac}
.c-ovr{position:absolute;left:13cqw;top:4.5cqw;font-size:7cqw;font-weight:900;background:rgba(0,0,0,.45);padding:.6cqw 1.8cqw;border-radius:1.8cqw}
.c-skill{position:absolute;right:0;top:4cqw;max-width:60cqw;padding:1.6cqw 3cqw 1.6cqw 4cqw;border-radius:4cqw 0 0 4cqw;font-size:6cqw;font-weight:900;color:#1b1204;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.c-face{position:absolute;left:50%;top:18cqw;width:48cqw;height:48cqw;margin-left:-24cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17cqw;font-weight:900;border:1.2cqw solid}
.c-name{position:absolute;left:3cqw;right:3cqw;top:69cqw;text-align:center;font-size:8.5cqw;font-weight:900;line-height:1.1;text-transform:uppercase;text-shadow:0 1cqw 2cqw rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-stars{position:absolute;left:0;right:0;top:80cqw;text-align:center;font-size:8cqw;letter-spacing:1cqw;line-height:1}
.c-stars .on{color:#fde047;text-shadow:0 0 2cqw rgba(253,224,71,.6)}
.c-stars .off{color:rgba(255,255,255,.28)}
.c-bot{position:absolute;left:6cqw;right:6cqw;bottom:3cqw;display:grid;grid-template-columns:1fr auto 1fr;gap:2cqw;align-items:end}
.c-col{display:flex;flex-direction:column;gap:2cqw;align-items:flex-start}
.c-col:last-child{align-items:flex-end}
/* Wertkästchen: alle gleich groß; SHO/DRV links neben der Zahl, PER/ZONE rechts, senkrecht von oben nach unten */
.pl{box-sizing:border-box;width:25cqw;height:16cqw;border:.8cqw solid rgba(255,255,255,.85);border-radius:2.5cqw;display:flex;align-items:center;justify-content:center;gap:.9cqw;padding:0 1cqw;line-height:1}
.pl i{writing-mode:vertical-rl;font-style:normal;font-size:4.6cqw;font-weight:900;letter-spacing:.02em;line-height:1}
.pl b{flex:1;text-align:center;font-size:12.5cqw;font-weight:900;text-shadow:0 .6cqw 1cqw rgba(0,0,0,.35)}
.pl.o{background:#8fa3c6}.pl.o i{color:#21407e}
.pl.d{background:#b35a5a}.pl.d i{color:#5c1515}
.c-pos{text-align:center;padding-bottom:1cqw}
.c-pos b{display:block;font-size:11cqw;font-weight:900;line-height:1}
.c-pos small{display:block;font-size:4.2cqw;font-weight:900;margin-top:.8cqw;color:rgba(255,255,255,.85)}
.c-bonus{display:inline-block;margin-top:1.5cqw;font-size:4.4cqw;font-weight:900;padding:.8cqw 1.6cqw;border-radius:1.6cqw;color:#1b1204;white-space:nowrap}
.card.mini .m-top{position:absolute;left:5cqw;right:5cqw;top:4cqw;display:flex;justify-content:space-between;font-size:13cqw;font-weight:900;line-height:1.1}
.card.mini .ovr2{background:rgba(0,0,0,.45);border-radius:3cqw;padding:0 3cqw}
.card.mini .c-face{top:22cqw;width:46cqw;height:46cqw;margin-left:-23cqw;font-size:16cqw}
.card.mini .m-name{position:absolute;left:3cqw;right:3cqw;top:72cqw;text-align:center;font-size:11cqw;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.card.mini .m-st{position:absolute;left:4cqw;right:4cqw;bottom:4cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.5cqw}
.card.mini .m-st span{font-size:13cqw;font-weight:900;text-align:center;border-radius:3cqw;line-height:1.25}
.card.mini .m-st .o{background:#8fa3c6}.card.mini .m-st .d{background:#b35a5a}
.injb{position:absolute;top:28%;left:4px;font-size:9px;font-weight:900;background:var(--bad);color:#2b0710;border-radius:5px;padding:1px 4px}
.back{width:100%;aspect-ratio:5/7;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:repeating-linear-gradient(45deg,#14203d 0 7px,#101a33 7px 14px);display:flex;align-items:center;justify-content:center;font-size:24px}
.back.lgd{border-color:rgba(247,168,27,.6);background:repeating-linear-gradient(45deg,#3a2508 0 7px,#2b1b06 7px 14px)}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
.cw{border-radius:12px;display:block;width:100%}
.cw.sel{outline:2.5px solid var(--acc);outline-offset:1px;cursor:pointer;animation:pa 1.6s ease-in-out infinite}
.cw.dis{opacity:.35}
.cw.tgt{outline:2.5px solid var(--bad);outline-offset:1px;cursor:pointer;animation:pr 1.6s ease-in-out infinite}
.court:not(.full){overflow:visible}
.luw{position:relative;width:100%}
.luw .cw{transition:transform .18s ease,box-shadow .18s ease}
.cw.lu-on{outline:2.5px solid var(--acc);outline-offset:1px;transform:translateY(-4px) scale(1.03);box-shadow:0 10px 22px rgba(0,0,0,.45)}
.cw.lu-tgt{outline:2px dashed var(--acc);outline-offset:2px;cursor:pointer;animation:pa 1.6s ease-in-out infinite}
.lu-b{position:absolute;top:calc(38% - 14px);width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:lupop .18s ease-out}
.lu-b .ic{width:15px;height:15px;stroke-width:2.4}
.lu-x{left:-12px;background:var(--bad);color:#fff}
.lu-s{right:-12px;background:#1b2540;color:var(--fg)}
.lu-s.on{background:var(--acc);color:#0a0f1e}
@keyframes lupop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.item.lu-tg{border-color:rgba(var(--acc-rgb,255,154,60),.7);border-style:dashed}
.lu-opt{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lu-opt.on{border-color:var(--acc);background:rgba(var(--acc-rgb,255,154,60),.1)}
.lu-oi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--acc);flex-shrink:0}
.lu-oi .ic{width:18px;height:18px}
.card.oop .m-st span,.card.oop .ovr2,.card.oop .m-top>span:first-child{color:var(--bad)!important}
.card.oop .m-st span{background:rgba(251,113,133,.22)!important;box-shadow:inset 0 0 0 1px rgba(251,113,133,.6)}
.card.oop .pl b,.card.oop .pd b,.card.oop .c-ovr,.card.oop .c-pos{color:var(--bad)!important}
.cs .lab.oop{color:var(--bad)!important}
.empty.tap{cursor:pointer}.empty.lu-tgt{border-color:var(--acc);color:var(--acc);animation:pa 1.6s ease-in-out infinite}
.cw.glow{outline:2.5px solid var(--warn);outline-offset:1px;box-shadow:0 0 18px rgba(251,191,36,.5);animation:none}
.cw.uw{opacity:.6;outline:2px solid var(--ok);outline-offset:1px}
.cw.ul{opacity:.22}
@keyframes pa{50%{box-shadow:0 0 16px rgba(var(--acc-rgb),.5)}}
@keyframes pr{50%{box-shadow:0 0 16px rgba(251,113,133,.5)}}
/* Spielfeld */
.court{position:relative;border-radius:18px;background:linear-gradient(180deg,#0d1b36,#0a1429);border:1px solid var(--ln);padding:8px 4px;margin-top:10px;overflow:hidden}
.court.full:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.09)}
.court.full:after{content:'';position:absolute;left:50%;top:50%;width:84px;height:84px;border:1px solid rgba(255,255,255,.07);border-radius:50%;transform:translate(-50%,-50%)}
.crow{display:flex;justify-content:center;gap:8px;margin:4px 0;position:relative;z-index:1}
.cs{width:var(--cw);display:flex;flex-direction:column;align-items:center;gap:2px}
.cs .lab{font-size:9px;font-weight:800}
:root{--cw:clamp(64px,min(calc((100vw - 44px) / 3),calc((100vh - 260px) / 5.6)),120px)}

@supports (height:100lvh){:root{--cw-lu:clamp(64px,min(calc((100vw - 44px) / 3),calc((100lvh - 260px) / 5.6)),120px)}}
.court:not(.full) .cs{width:var(--cw-lu)}
body.mm .court.full .cs{width:var(--cwm,var(--cw))}
.hcap{display:none}.stb{display:none}
html:has(body.mm),body.mm{overflow:hidden;overscroll-behavior:none}

body.mm .scoreb{padding:6px 10px;border-radius:12px}

body.mm .scoreb .badge{width:26px;height:26px;border-radius:8px;font-size:8px}
body.mm .scoreb .s.mut{display:none}
body.mm .scoreb+.row{margin-top:4px;font-size:11px}

body.mm .court .crow{margin:3px 0;gap:8px}
body.mm .court>div[style*="height:12px"]{height:4px!important}

body.mm .cs .cw{position:relative}

.lot-drum.phys{animation:none}
.drum-t{font-size:22px;font-weight:900;letter-spacing:.1em;color:var(--acc)}
.stb.w{background:var(--ok)}.stb.l{background:var(--bad)}

.hl{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);position:relative;z-index:1;margin:2px 0}
.empty{width:100%;aspect-ratio:5/7;border-radius:12px;border:2px dashed rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.scoreb{display:flex;align-items:center;justify-content:space-between;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;gap:8px}
.scoreb .sc{font-size:28px;font-weight:900;min-width:24px;text-align:center}
.hint{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(13,21,39,.97);border-top:1px solid var(--ln)}
.hint .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub);min-height:36px}
/* Sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,15,.75);display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#111a2e;border:1px solid var(--ln);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out}
.sheet:before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 12px}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
.sheet.sw-r{animation:swr .22s ease-out}.sheet.sw-l{animation:swl .22s ease-out}
@keyframes swr{from{transform:translateX(56px);opacity:0}}@keyframes swl{from{transform:translateX(-56px);opacity:0}}
.sheet.sw-drag{transition:none}.sheet.sw-back{transition:transform .2s ease,opacity .2s ease}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.tile.act{cursor:pointer;border-width:2px}
.tile .v{font-size:22px;font-weight:900}
.tile .n{font-size:11px;color:var(--sub);font-weight:700}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.duel{display:flex;align-items:center;gap:10px}
.duel .side{flex:1;min-width:0}
.duel .side .card{max-width:150px;margin:0 auto}
.bigv{font-size:34px;font-weight:900;text-align:center}
.res{text-align:center;font-weight:900;padding:10px;border-radius:12px;margin-top:10px}
/* Liga */
.game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px;background:var(--p2);border:1px solid var(--ln);border-radius:12px}
.game.mine{border-color:rgba(125,211,252,.45);background:rgba(125,211,252,.06)}
.court-logo{position:absolute;left:50%;top:50%;width:64%;max-width:250px;aspect-ratio:1/1;transform:translate(-50%,-50%);background:var(--logo-img) center/contain no-repeat;opacity:.13;pointer-events:none;z-index:0}
:root{--acc-rgb:255,154,60;--tc:255,154,60;--tl:#ffb877;--tt:#2a1300}

body.tm .kick{color:var(--tl)}
body.tm .tab.on{background:rgba(var(--tc),.13);color:var(--tl)}

.gt{display:flex;align-items:center;gap:8px;min-width:0}
.gt.r{justify-content:flex-end;text-align:right}
.gn{min-width:0}
.gn div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsc{font-size:17px;font-weight:900;min-width:52px;text-align:center}
.tabs{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:4px;gap:4px;margin-top:12px}

.st td{padding:8px 4px;border-top:1px solid var(--ln);font-weight:700}
.st tr.me td{color:var(--acc)}
.ball{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;border:2px solid rgba(255,255,255,.35)}
.ball.out{opacity:.22}
.drum{width:120px;height:120px;border-radius:50%;margin:16px auto 8px;border:3px solid rgba(125,211,252,.4);background:radial-gradient(circle at 35% 30%,#1d2c52,#0b1328);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}

.evc{border-radius:18px;padding:16px;border:2px solid;text-align:center}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:#1b2742;font-weight:900;cursor:pointer}
.step b{min-width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1e3a5f;border:1px solid rgba(125,211,252,.3);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--acc);transition:transform .3s;z-index:60;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,-70px)}
/* Duell-Arena */
.arena{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px calc(34px + env(safe-area-inset-bottom))}
.arena.hidden{display:none}
.ar-bg{position:absolute;inset:0;background:radial-gradient(620px 440px at 50% 42%,rgba(30,52,110,.6),rgba(3,6,15,.95));opacity:0;transition:opacity .25s}
.arena.on .ar-bg{opacity:1}
.ar-top,.ar-stage,.ar-stat,.ar-res,.ar-btn{position:relative;z-index:1;width:100%;max-width:440px}
.ar-top{text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s}
.arena.on .ar-top{opacity:1;transform:none}
.ar-stage{display:flex;align-items:center;justify-content:center;gap:10px}
.ar-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:160px;min-width:0}
.ar-role{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);text-align:center;opacity:0;transition:opacity .3s .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.arena.on .ar-role{opacity:1}
.ar-card{width:100%;max-width:150px;perspective:900px;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .35s}
.flip{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.flip.hid{transform:rotateY(180deg)}
.flip .fr,.flip .bk{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .bk{position:absolute;inset:0;transform:rotateY(180deg)}
.flip .bk .back{height:100%;font-size:40px}
.ar-val{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.ar-val.on{opacity:1;transform:none}
.ar-val.lo{opacity:.35}
.ar-vs{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#0f1a34;border:2px solid rgba(255,255,255,.18);color:var(--sub);opacity:0;transform:scale(.3) rotate(-30deg);transition:opacity .2s,transform .4s cubic-bezier(.3,1.7,.5,1)}
.ar-vs.on{opacity:1;transform:none}
.ar-vs.clash{animation:vsclash .4s}
@keyframes vsclash{40%{transform:scale(1.5);background:#fbbf24;color:#2a1800;border-color:#fde68a}}
.ar-stat{text-align:center;font-size:13px;font-weight:800;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.ar-stat.on{opacity:1;transform:none}
.ar-card.hitL{animation:hitL .35s}
.ar-card.hitR{animation:hitR .35s}
@keyframes hitL{45%{transform:translateX(16px) rotate(3deg)}}
@keyframes hitR{45%{transform:translateX(-16px) rotate(-3deg)}}
.ar-card.win{transform:scale(1.07);filter:drop-shadow(0 0 16px rgba(251,191,36,.75))}
.ar-card.lose{transform:scale(.92) rotate(-4deg);filter:grayscale(.85) brightness(.55)}
.ar-res{text-align:center;font-weight:900;font-size:17px;padding:12px;border-radius:14px;opacity:0;transform:scale(.7);transition:opacity .25s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.ar-res.on{opacity:1;transform:none}
.ar-btn{opacity:0;pointer-events:none;transition:opacity .3s}
.ar-btn.on{opacity:1;pointer-events:auto}
.ar-skip{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;font-size:11px;font-weight:700;color:var(--mut);z-index:1;transition:opacity .3s}
.cw.ghost{visibility:hidden}
.cw.land{animation:land .5s ease-out}
@keyframes land{from{transform:scale(1.2);opacity:.15}}
.sc.pop{animation:scpop .7s ease-out}
@keyframes scpop{30%{transform:scale(1.8);text-shadow:0 0 18px currentColor}}
/* Würfel */
.die.rolling{animation:tumble .3s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-8px)}100%{transform:rotate(360deg) translateY(0)}}
.die.landed{animation:dieland .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes dieland{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.item.gm1{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.chip.rk{animation:rkpop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rkpop{from{transform:scale(0);opacity:0}}
/* Münzwurf */
.coin-wrap{position:relative;z-index:1;perspective:800px;height:140px;display:flex;align-items:flex-end;justify-content:center}
.coin-wrap.toss{animation:toss 1s cubic-bezier(.3,.6,.4,1)}
@keyframes toss{40%{transform:translateY(-80px)}100%{transform:translateY(0)}}
.coin3{width:110px;height:110px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.25,1)}
.coin3 .cf{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:900;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:5px solid #b8860b;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),0 10px 24px rgba(0,0,0,.45)}
.coin3 .cf span{font-size:11px;letter-spacing:.14em;margin-top:2px}
.coin3 .head{background:radial-gradient(circle at 35% 30%,#fde68a,#d4a017);color:#3b2600}
.coin3 .tail{background:radial-gradient(circle at 35% 30%,#e5e7eb,#9ca3af);color:#1f2937;border-color:#6b7280;transform:rotateY(180deg)}
.cscore{position:relative;z-index:1;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.cscore span{display:inline-block}
.cscore span.pop{animation:scpop .7s ease-out}
.cslots{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:440px}
.cslot{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:7px 3px;text-align:center;transition:transform .25s,border-color .25s,background .25s,opacity .25s;min-width:0}
.cslot .pos{font-size:10px;font-weight:900;color:var(--sub)}
.cslot .nm{font-size:9px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cslot .r{font-size:16px;margin-top:2px;min-height:20px}
.cslot.now{border-color:var(--acc);transform:translateY(-4px)}
.cslot.w{border-color:var(--ok);background:rgba(52,211,153,.12)}
.cslot.l{border-color:var(--bad);background:rgba(251,113,133,.12)}
.cslot.off{opacity:.3}
/* Draft-Lotterie */
.lot{position:relative;z-index:1;width:220px;height:285px;display:flex;flex-direction:column;align-items:center}
.lot-drum{position:relative;width:200px;height:200px;border-radius:50%;border:4px solid rgba(125,211,252,.5);background:radial-gradient(circle at 35% 30%,rgba(125,211,252,.18),rgba(10,20,45,.9));box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 30px rgba(125,211,252,.15);overflow:hidden;animation:drum 1.1s linear infinite}
.lot-drum.stop,.lot-drum.stop .lb{animation-play-state:paused}
@keyframes drum{to{transform:rotate(360deg)}}
.lb{position:absolute;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;border:2px solid rgba(255,255,255,.4);animation:jig .7s ease-in-out infinite alternate}
@keyframes jig{0%{transform:translate(-14px,10px)}50%{transform:translate(12px,-16px)}100%{transform:translate(-6px,14px)}}
.lb.gone{opacity:0;transition:opacity .2s}
.lot-chute{width:36px;height:22px;background:rgba(125,211,252,.25);border:2px solid rgba(125,211,252,.4);border-top:0;border-radius:0 0 10px 10px;margin-top:-3px}
.lot-out{position:absolute;left:50%;top:212px;width:56px;height:56px;margin-left:-28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:3px solid rgba(255,255,255,.55);opacity:0;transform:translateY(-30px) scale(.5)}
.lot-out.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) forwards}
.lot-out.shown{opacity:1;transform:translateY(10px)}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) scale(.5)}60%{opacity:1;transform:translateY(20px) scale(1.15)}100%{opacity:1;transform:translateY(10px) scale(1)}}
@media (prefers-reduced-motion:reduce){.die,.chip.rk{animation:none!important}}
/* Aufdecken */
.rays{position:absolute;left:50%;top:44%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--g) 0deg 6deg,transparent 6deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 65%);mask:radial-gradient(circle,#000 0,transparent 65%);opacity:0;transition:opacity .5s;animation:spin 16s linear infinite;pointer-events:none}
.rays.on{opacity:.32}
.rv-card{position:relative;z-index:1;width:180px;perspective:900px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rv-card.glowing{animation:rvpulse 1.6s ease-in-out infinite}
@keyframes rvpulse{0%,100%{filter:drop-shadow(0 0 16px var(--g))}50%{filter:drop-shadow(0 0 32px var(--g))}}
.evcard{aspect-ratio:5/7;border-radius:14px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}

.evcard .en{font-size:16px;font-weight:900}
.evcard .ed{font-size:11px;color:var(--sub);line-height:1.4}
.evback{height:100%;border-radius:14px;border:3px solid rgba(167,139,250,.6);background:repeating-linear-gradient(45deg,#1f1640 0 8px,#18112f 8px 16px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;color:#c4b5fd}
.evback span{font-size:11px;font-weight:900;letter-spacing:.2em;margin-top:6px}
/* Konfetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation-name:fall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
/* Phasen-Übergänge */
#app.enter > *:not(.cta):not(.hint){animation:pageIn .4s cubic-bezier(.2,.8,.2,1) both}
#app.enter > *:not(.cta):not(.hint):nth-child(n+3){animation-delay:.05s}
#app.enter > *:not(.cta):not(.hint):nth-child(n+5){animation-delay:.1s}

.intro{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,9,20,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.intro.hidden{display:none}
.intro.show{animation:fadeIn .25s both}
.intro.out{animation:fadeOut .3s both}
.intro .in{animation:introIn .6s cubic-bezier(.2,.8,.2,1) both}

@keyframes introIn{from{opacity:0;transform:scale(.85) translateY(12px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}

.t-logo{position:relative;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:84px;background:radial-gradient(circle at 35% 30%,#ffb347,#f7a81b 45%,#b45309);box-shadow:0 0 60px rgba(247,168,27,.45),inset -10px -14px 24px rgba(0,0,0,.25);animation:float 3s ease-in-out infinite;overflow:hidden}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const DB=(function(){
  const db={};
  LEGEND_DATA.forEach((r,i)=>{const id='L'+String(i+1).padStart(2,'0');db[id]={id:id,name:r[0],pos:r[1],tier:'Legend',sh:r[2],dr:r[3],pd:r[4],rp:r[5],sal:100,skill:'',skillText:'',bonus:''};});
  // Platzhalter für Free Agents (All-Star/Basic) und Rookies – werden durch echte Karten ersetzt
  const rnd=mulberry32(7331),R=(a,b)=>a+Math.floor(rnd()*(b-a+1));

  const PROF={G:{sh:6,pd:2,dr:5,rp:-14},F:{sh:0,pd:2,dr:2,rp:-2},C:{sh:-10,pd:-4,dr:0,rp:10}};
  const T={'All-Star':{b:[80,85],s:[20,38]},'Basic':{b:[71,77],s:[5,15]},'Rookie':{b:[71,76],s:[10,10]}};
  const used=new Set();
  function nm(){let n;do{n=FIRST[R(0,FIRST.length-1)]+' '+LAST[R(0,LAST.length-1)];}while(used.has(n));used.add(n);return n;}
  function make(pre,tier,count,cyc){

})();

const SAL_FIX={Legend:100,Rookie:10}; // Legends und Rookies haben immer dasselbe Gehalt
const CARDS={src:'builtin',n:{L:0,S:0,B:0,R:0},errors:[],at:0,ok:false};
function csvParse(t){
  const rows=[];let row=[],f='',q=false;t=String(t||'').replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function cardSlug(n){return String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function cardsParse(text){
  const rows=csvParse(text);if(rows.length<2)return{fatal:'Die Datei enthält keine Kartenzeilen.'};
  const H=rows[0].map(h=>String(h).trim().toLowerCase()),col=(...n)=>H.findIndex(h=>n.indexOf(h)>-1);
  const ci={name:col('kartenname')>-1?col('kartenname'):col('name','spielername','spieler'),tier:col('typ','stufe','tier'),pos:col('position','pos'),sh:col('wurf','sho','shooting'),dr:col('drive','drv','driving'),pd:col('per.def.','per. def.','per def','per','perimeter','perimeter def'),rp:col('zone def','zone def.','zone','rim protection'),sal:col('gehalt','salary','mio')};
  if(ci.name<0||ci.tier<0||ci.pos<0||ci.sh<0||ci.dr<0||ci.pd<0||ci.rp<0)return{fatal:'Spaltenüberschriften fehlen: Typ, Position, Kartenname, Wurf, Drive, Zone DEF, Per.Def.'};
  const TIERS={legend:'Legend',legends:'Legend',legende:'Legend',legenden:'Legend',stars:'All-Star',rookies:'Rookie','all-star':'All-Star',allstar:'All-Star','all star':'All-Star',star:'All-Star',basic:'Basic',starter:'Basic',rookie:'Rookie'},POSN={g:'G',guard:'G',f:'F',forward:'F',c:'C',center:'C'};
  const PRE={Legend:'L','All-Star':'S',Basic:'B',Rookie:'R'},builtin={};LEGEND_DATA.forEach((r,i)=>{builtin[cardSlug(r[0])]='L'+String(i+1).padStart(2,'0');});
  const seen=new Set(),errs=[],list=[],n={L:0,S:0,B:0,R:0};
  rows.slice(1).forEach((r,k)=>{
    const line=k+2,name=String(r[ci.name]||'').trim();if(!name)return;
    const tier=TIERS[String(r[ci.tier]||'').trim().toLowerCase()],pos=POSN[String(r[ci.pos]||'').trim().toLowerCase()];
    const v=x=>{const z=parseInt(String(r[x]||'').replace(/[^0-9]/g,''),10);return z>=1&&z<=99?z:null;};
    const st={sh:v(ci.sh),dr:v(ci.dr),pd:v(ci.pd),rp:v(ci.rp)};
    if(!tier){errs.push(`Zeile ${line} (${name}): Typ unbekannt`);return;}
    if(!pos){errs.push(`Zeile ${line} (${name}): Position muss Guard, Forward oder Center sein`);return;}
    if(Object.values(st).some(x=>x===null)){errs.push(`Zeile ${line} (${name}): Werte müssen Zahlen von 1 bis 99 sein`);return;}
    const slug=cardSlug(name);if(seen.has(slug)){errs.push(`Zeile ${line} (${name}): Kartenname doppelt`);return;}seen.add(slug);
    let sal=SAL_FIX[tier];if(sal==null){sal=ci.sal>-1?parseInt(String(r[ci.sal]||'').replace(/[^0-9]/g,''),10):NaN;if(!(sal>=1&&sal<=200))sal=null;}
    list.push({id:(tier==='Legend'&&builtin[slug])||(PRE[tier]+'_'+slug),name:name,pos:pos,tier:tier,sh:st.sh,dr:st.dr,pd:st.pd,rp:st.rp,sal:sal});n[PRE[tier]]++;
  });
  return{list:list,errs:errs,n:n};
}
function cardsApply(text,src,at){
  const P=cardsParse(text);if(P.fatal){CARDS.errors=[P.fatal];return false;}if(!P.list.length)return false;
  const ids=new Set();
  P.list.forEach(c=>{DB[c.id]=Object.assign(DB[c.id]||{},c,{skill:'',skillText:'',bonus:'',hidden:false});ids.add(c.id);});
  Object.keys(DB).forEach(id=>{if(!ids.has(id))DB[id].hidden=true;});
  // Gehalt automatisch nach Stärke, wenn keine Gehalt-Spalte gepflegt ist: All-Stars 20–38, Basics 5–15 Mio
  [['All-Star',20,38],['Basic',5,15]].forEach(([t,lo,hi])=>{const L=[...ids].filter(id=>DB[id].tier===t);if(!L.length)return;const ov=L.map(id=>rating(null,id)),mn=Math.min(...ov),mx=Math.max(...ov);
    L.forEach((id,k)=>{if(DB[id].sal==null){const f=mx>mn?(ov[k]-mn)/(mx-mn):.5;DB[id].sal=Math.round(lo+f*(hi-lo));}});});
  CARDS.src=src||'sheet';CARDS.n=P.n;CARDS.errors=P.errs;CARDS.at=at||Date.now();CARDS.ok=true;
  if(typeof cardImgRematch==='function')cardImgRematch();
  return true;
}

function cardsSource(){return (typeof CARDS_CSV_URL!=='undefined'&&CARDS_CSV_URL)||(typeof AUD!=='undefined'&&AUD&&AUD.cardsCsv)||'';}
async function cardsRefresh(){
  const URL_=cardsSource();if(!URL_)return false;
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(URL_+(URL_.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);

/* Skin einer Karte bestimmen: eigene Karten aus dem Album, Gegner online aus dem Spielstand */
function skMine(g){if(!ST||!ST.gms)return false;return NET.on?(!!g.pid&&g.pid===NET.pid):g===ST.gms[0];}
function skinFor(g,id,o){
  if(o&&o.skin!==undefined)return o.skin&&o.skin!=='none'&&SK_KEYS.indexOf(o.skin)>-1?o.skin:null;

}
function skHash(s){s=String(s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function skinStyle(){const t=Date.now();return `;--skD:-${t%4600}ms;--skF:-${t%28000}ms`;}

  return `<div class="sk-sw"></div><div class="sk-r"></div>${gl}`;

function roundRobin(list){
  const a=list.slice();if(a.length%2)a.push(-1);
  const n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const g=[];
    for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x<0||y<0)continue;g.push((r+i)%2?[y,x]:[x,y]);}
    rounds.push(g);a.splice(1,0,a.pop());
  }
  return rounds;
}
function startSeason(){
  ST.gms.forEach(g=>{g.w=0;g.l=0;g.pf=0;g.pa=0;g.inj={};g.buffs=[];});
  const rr=roundRobin(ST.order);ST.sched=[];
  rr.forEach((gs,k)=>ST.sched.push({stage:'H',label:`Hinrunde · Spieltag ${k+1}/${rr.length}`,games:gs.map(p=>({h:p[0],a:p[1],hs:null,as:null}))}));
  rr.forEach((gs,k)=>ST.sched.push({stage:'R',label:`Rückrunde · Spieltag ${k+1}/${rr.length}`,games:gs.map(p=>({h:p[1],a:p[0],hs:null,as:null}))}));
  ST.md=0;ST.midTrade=false;ST.seeds=null;UI.tab='md';
  go('hub');
}

/* ═════════════ AUFSTELLUNG (Gehaltsgrenze gilt für die Starting 5) ═════════════ */
function luIds(lu){return (lu||[]).filter(Boolean);}
function slotify(ids){
  const out=[null,null,null,null,null],rest=luIds(ids);
  SLOT_POS.forEach((p,i)=>{const k=rest.findIndex(id=>DB[id].pos===p);if(k>-1)out[i]=rest.splice(k,1)[0];});
  for(let i=0;i<5;i++)if(out[i]===null&&rest.length)out[i]=rest.shift();
  return out;
}
/* Aufstellungen sind 5 feste Plätze [G,G,F,F,C]; ältere Listen werden nach Position einsortiert */
function arrange(ids){if(ids&&ids.length===5)return ids.slice();return slotify(ids||[]);}
function oopCount(lu){return lu.reduce((a,id,i)=>a+(oop(i,id)?1:0),0);}
function luScore(g,id,st){
  if(st==='off'){const a=[sv(g,id,'sh'),sv(g,id,'dr')].sort((x,y)=>y-x);return a[0]*.7+a[1]*.3+rating(g,id)*.01;}
  if(st==='def')return (sv(g,id,'pd')+sv(g,id,'rp'))/2+rating(g,id)*.01;
  return rating(g,id);
}
function luPool(g){const h=healthy(g);return h.length>=5?h:g.roster.slice();}
function autoLineup(g,st,keep){
  const pool=luPool(g),cap=capOf(g),kp=(keep||[]).filter(id=>pool.indexOf(id)>-1);
  let best=null,bs=-1e9,cheap=null,cs=1e9;
  combos(pool,5).forEach(c=>{
    if(!kp.every(id=>c.indexOf(id)>-1))return;
    const cost=lineupCost(c);if(cost<cs){cs=cost;cheap=c;}
    if(cost>cap)return;
    const lu=slotify(c),sc=c.reduce((a,id)=>a+luScore(g,id,st),0)-CFG.OOP*oopCount(lu);
    if(sc>bs){bs=sc;best=lu;}
  });
  return best||slotify(cheap||pool.slice(0,5));
}
function lineupValid(g,ids){
  const l=luIds(ids);if(!ids||l.length!==5||new Set(l).size!==5)return false;
  const h=healthy(g),own=l.every(id=>g.roster.indexOf(id)>-1);if(!own)return false;
  if(h.length>=5&&l.some(id=>h.indexOf(id)<0))return false;
  return lineupCost(l)<=capOf(g);
}
function luRestore(g,last,st){
  if(!last||last.length!==5)return autoLineup(g,st);
  const sl=last.map(id=>id&&g.roster.indexOf(id)>-1?id:null);if(lineupValid(g,sl))return sl;
  const h=luPool(g),keep=luIds(sl).filter(id=>h.indexOf(id)>-1),out=sl.map(id=>keep.indexOf(id)>-1?id:null);
  const best=autoLineup(g,st,keep),add=luIds(best).filter(id=>keep.indexOf(id)<0);
  add.forEach(id=>{let i=out.findIndex((x,k)=>!x&&SLOT_POS[k]===DB[id].pos);if(i<0)i=out.findIndex(x=>!x);if(i>-1)out[i]=id;});
  return lineupValid(g,out)?out:best;
}
function upLastLineup(){
  const g=G_(0),u=ST.up||{},last=u.lastLu2&&u.lastLu2.length===5?u.lastLu2:null;
  if(last){const sl=last.map(id=>id&&g.roster.indexOf(id)>-1?id:null);if(lineupValid(g,sl))return sl;
    const keep=luIds(sl),best=autoLineup(g,UI.luStyle,keep);
    const out=sl.slice(),add=luIds(best).filter(id=>keep.indexOf(id)<0);
    add.sort((a,b)=>{const fa=out.some((x,i)=>!x&&SLOT_POS[i]===DB[a].pos)?0:1,fb=out.some((x,i)=>!x&&SLOT_POS[i]===DB[b].pos)?0:1;return fa-fb;});
    add.forEach(id=>{let i=out.findIndex((x,k)=>!x&&SLOT_POS[k]===DB[id].pos);if(i<0)i=out.findIndex(x=>!x);if(i>-1)out[i]=id;});
    return lineupValid(g,out)?out:best;}
  const keep=((u.lastLu)||[]).filter(id=>g.roster.indexOf(id)>-1);
  return autoLineup(g,UI.luStyle,keep.length<=5?keep:[]);
}
function enterLineup(){UI.luSel=null;UI.luSwap=false;const g=G_(0);UI.lu=ST.mode==='up'?upLastLineup():luRestore(g,g.lastLu,UI.luStyle);go('lineup');}

function luChips(lu,cost,cap){

/* ═════════════ SPIELTAG & EREIGNISSE ═════════════ */
function simGame(gm){let h=0,a=0;while(h<3&&a<3){if(Math.random()<.5)h++;else a++;}gm.hs=h;gm.as=a;gm.sim=true;}
function completeMatchday(){
  const md=ST.sched[ST.md];if(md.done){go('events');return;}
  const myG=md.games.find(x=>(x.h===0||x.a===0)&&x.hs===null);
  if(myG){coinSim(myG);return;}
  md.games.forEach(gm=>{if(!gm.lh)gm.lh=autoLineup(G_(gm.h));if(!gm.la)gm.la=autoLineup(G_(gm.a));});
  md.games.forEach(gm=>{
    if(gm.hs===null)simGame(gm);
    if(md.stage==='H'||md.stage==='R'){const H=G_(gm.h),A=G_(gm.a);H.pf+=gm.hs;H.pa+=gm.as;A.pf+=gm.as;A.pa+=gm.hs;if(gm.hs>gm.as){H.w++;A.l++;}else{A.w++;H.l++;}}
  });
  ST.ev={list:[]};
  md.games.forEach(gm=>{postGame(gm.h,gm.lh);postGame(gm.a,gm.la);});
  md.done=true;UI.lu=null;go('events');
}
function drawEvent(){const tot=EVENTS.reduce((s,e)=>s+e.w,0);let r=Math.random()*tot;for(const e of EVENTS){r-=e.w;if(r<0)return e.id;}return 'quiet';}

function applyEvent(gi,ev,played){
  const g=G_(gi),hl=healthy(g);
  switch(ev){
    case 'inj':case 'sev':{if(!hl.length)return{text:'Niemand betroffen.'};const p=pick(hl);g.inj[p]=ev==='inj'?1:3;return{text:`${DB[p].name} fällt ${ev==='inj'?'das nächste Spiel':'3 Spiele'} aus.`};}
    case 'upg':{const rk=(played||[]).filter(x=>g.roster.indexOf(x)>-1&&DB[x].tier==='Rookie'&&lvl(g,x)<CFG.UP_MAX);
      if(!rk.length)return{text:'Kein Rookie, der gespielt hat, kann aufsteigen – das Upgrade verfällt.'};
      const p=rk[0];doUp(g,p);return{text:`${DB[p].name} steigt auf ${lvl(g,p)}★ – alle Werte +${CFG.UP_STEP}.`};}
    case 'trade':g.trade++;return{text:'+1 Trade-Karte'};
    case 'pick':g.picks++;return{text:'+1 Pick-Karte'};
    case 'hot':case 'lock':{if(!hl.length)return{text:'Kein Effekt.'};const p=pick(hl),ks=ev==='hot'?['sh','dr']:['pd','rp'];ks.forEach(k=>g.buffs.push({id:p,k:k,v:5,g:1}));return{text:`${DB[p].name}: ${ks.map(k=>'+5 '+STAT[k]).join(', ')} im nächsten Spiel.`};}
    case 'med':{const n=Object.keys(g.inj).length;g.inj={};return{text:n?`${n} Verletzung${n>1?'en':''} geheilt.`:'Alle fit – keine Wirkung.'};}
    default:return{text:'Kein Effekt.'};
  }
}
function postGame(gi,lineup){
  const g=G_(gi);
  Object.keys(g.inj).forEach(id=>{g.inj[id]--;if(g.inj[id]<=0)delete g.inj[id];});
  g.buffs=g.buffs.map(b=>({id:b.id,k:b.k,v:b.v,g:b.g-1})).filter(b=>b.g>0);

function advance(){

function winnerOf(g){return g.hs>g.as?g.h:g.a;}

function createPlayoffs(){

/* ═════════════ TRADETIME ═════════════ */
function newTr(p){return{p:p||1,give:[],get:[],gT:0,gP:0,rT:0,rP:0,msg:null};}
function enterTrade(stage){ST.tr={stage:stage};UI.tr=newTr(1);go('trade');}
function tradeEval(){
  const t=UI.tr,me=G_(0),P=G_(t.p);
  const outV=lineupCost(t.give)+(t.gT+t.gP)*CFG.CARD_VALUE,inV=lineupCost(t.get)+(t.rT+t.rP)*CFG.CARD_VALUE,diff=inV-outV;
  const myR=me.roster.filter(id=>t.give.indexOf(id)<0).concat(t.get),pR=P.roster.filter(id=>t.get.indexOf(id)<0).concat(t.give);
  const any=t.give.length+t.get.length+t.gT+t.gP+t.rT+t.rP>0;
  const checks=[
    {ok:any,txt:'Angebot enthält Spieler oder Karten'},
    {ok:Math.abs(diff)<=CFG.TRADE_TOL,txt:`Wertausgleich ±${CFG.TRADE_TOL} Mio. (Δ ${diff>0?'+':''}${diff})`},
    {ok:myR.length>=CFG.ROSTER_MIN&&myR.length<=CFG.ROSTER_MAX,txt:`Dein Kader: ${myR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},
    {ok:pR.length>=CFG.ROSTER_MIN&&pR.length<=CFG.ROSTER_MAX,txt:`Kader ${esc(P.name)}: ${pR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},
    {ok:!missingPos(myR).length,txt:'Deine Positionen bleiben besetzt'},
    {ok:!missingPos(pR).length,txt:`Positionen ${esc(P.name)} bleiben besetzt`}
  ];
  return{outV:outV,inV:inV,checks:checks,valid:checks.every(c=>c.ok)};
}
function cardSteps(side,g){
  const t=UI.tr,kT=side+'T',kP=side+'P';
  return `<div class="row between mt"><span class="s b">🎟 Trade-Karten <span class="mut">(${g.trade})</span></span><div class="step"><button onclick="trCard('${kT}',-1)">−</button><b>${t[kT]}</b><button onclick="trCard('${kT}',1)">+</button></div></div>
<div class="row between mt"><span class="s b">🎱 Pick-Karten <span class="mut">(${g.picks})</span></span><div class="step"><button onclick="trCard('${kP}',-1)">−</button><b>${t[kP]}</b><button onclick="trCard('${kP}',1)">+</button></div></div>`;
}
function vTrade(){
  tipOnce('trade');
  if(!UI.tr)UI.tr=newTr(1);
  const t=UI.tr,me=G_(0),P=G_(t.p),e=tradeEval(),mid=ST.tr&&ST.tr.stage==='mid';
  app(`${phaseHead(mid?'Phase 6 · Saisonmitte':'Offseason','Tradetime',`Tausche Spieler, Trade- und Pick-Karten. Der Gesamtwert muss innerhalb ±${CFG.TRADE_TOL} Mio. ausgeglichen sein (1 Karte = ${CFG.CARD_VALUE} Mio.).`)}
<div class="lbl mt">Handelspartner</div>
<div class="row wrap">${ST.gms.map((g,i)=>i===0?'':`<button class="chip ${t.p===i?'acc':''}" onclick="trPartner(${i})">${esc(g.name)} · ${TEAMS[g.team].sh}</button>`).join('')}</div>
<div class="panel"><div class="lbl">Du gibst <span>${e.outV} Mio</span></div><div class="col">${sortRoster(me).map(id=>pRow(0,id,{cls:t.give.indexOf(id)>-1?'on':'',click:`trTog('give','${id}')`})).join('')}</div>${cardSteps('g',me)}</div>
<div class="panel"><div class="lbl">Du bekommst von ${esc(P.name)} <span>${e.inV} Mio</span></div><div class="col">${sortRoster(P).map(id=>pRow(t.p,id,{cls:t.get.indexOf(id)>-1?'on':'',click:`trTog('get','${id}')`})).join('')}</div>${cardSteps('r',P)}</div>
<div class="panel"><div class="lbl">Prüfung</div><div class="col">${e.checks.map(c=>`<div class="row s"><b style="color:${c.ok?'var(--ok)':'var(--bad)'}">${c.ok?'✓':'✗'}</b><span>${c.txt}</span></div>`).join('')}</div>
${t.msg?`<div class="res" style="background:${t.msg.ok?'rgba(52,211,153,.12)':'rgba(251,113,133,.12)'};color:${t.msg.ok?'var(--ok)':'var(--bad)'}">${t.msg.txt}</div>`:''}</div>
<div class="cta"><div class="in"><button class="btn sec" onclick="endTrade()">Tradetime beenden</button><button class="btn" ${e.valid?'':'disabled'} onclick="sendOffer()">Angebot senden</button></div></div>`);
}
function trCard(k,d){const t=UI.tr,g=k[0]==='g'?G_(0):G_(t.p),max=k[1]==='T'?g.trade:g.picks;t[k]=Math.max(0,Math.min(max,t[k]+d));t.msg=null;render();}
function trTog(side,id){const a=UI.tr[side],i=a.indexOf(id);if(i>-1)a.splice(i,1);else a.push(id);UI.tr.msg=null;render();}
function trPartner(i){UI.tr=newTr(i);render();}
function moveCard(from,to,id){
  from.roster=from.roster.filter(x=>x!==id);to.roster.push(id);
  if(from.up[id]){to.up[id]=from.up[id];delete from.up[id];}
  if(from.inj[id]){to.inj[id]=from.inj[id];delete from.inj[id];}
  to.buffs=to.buffs.concat(from.buffs.filter(b=>b.id===id));from.buffs=from.buffs.filter(b=>b.id!==id);
}
function sendOffer(){
  const t=UI.tr,e=tradeEval();if(!e.valid)return;
  const me=G_(0),P=G_(t.p),val=(g,id)=>Math.pow(Math.max(0,rating(g,id)-55),1.6)/10;
  const gain=t.give.reduce((s,id)=>s+val(me,id),0)+(t.gT+t.gP)*2-t.get.reduce((s,id)=>s+val(P,id),0)-(t.rT+t.rP)*2;
  if(!(gain>=0||(gain>-1.5&&Math.random()<.35))){t.msg={ok:false,txt:`${esc(P.name)} lehnt ab – zu wenig Gegenwert.`};render();return;}
  t.give.forEach(id=>moveCard(me,P,id));t.get.forEach(id=>moveCard(P,me,id));
  me.trade+=t.rT-t.gT;P.trade+=t.gT-t.rT;me.picks+=t.rP-t.gP;P.picks+=t.gP-t.rP;
  const p=t.p;UI.tr=newTr(p);UI.tr.msg={ok:true,txt:`Trade mit ${esc(P.name)} abgeschlossen! ✅`};
  render();save();
}
function endTrade(){const st=ST.tr?ST.tr.stage:'mid';UI.tr=null;if(st==='mid'){ST.midTrade=true;go('hub');}else enterRelease();}

function releaseCheck(g,id){const r=g.roster.filter(x=>x!==id);if(r.length<CFG.ROSTER_MIN)return 'Kader muss mindestens '+CFG.ROSTER_MIN+' Spieler haben';if(missingPos(r).length)return 'Sonst fehlt eine Position';return '';}

/* ── Firebase-Anbindung (GitHub Pages / eigene Webseite) ── */
const FB_VER='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Laden fehlgeschlagen: '+src));document.head.appendChild(s);});}
function fbConfigured(){return !!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL);}
function fbErr(e){const c=String(e&&(e.code||e.message)||'');return{code:/permission/i.test(c)?'not_granted':'unavailable',message:c};}
function fbAdapter(rdb){
  const clean=v=>JSON.parse(JSON.stringify(v)),mk=(id,s)=>({id:id,exists:s.exists(),data:()=>s.val(),metadata:{fromCache:false}});
  function doc(p){const id=p.split('/').pop(),r=rdb.ref(p+'/_d');return{id:id,path:p,
    get:()=>r.once('value').then(s=>mk(id,s),e=>{throw fbErr(e);}),
    set:d=>r.set(clean(d)).catch(e=>{throw fbErr(e);}),
    onSnapshot:(next,err)=>{const h=r.on('value',s=>next(mk(id,s)),e=>{if(err)err(fbErr(e));});return()=>r.off('value',h);}};}
  function collection(p){const r=rdb.ref(p);return{path:p,doc:id=>doc(p+'/'+id),
    onSnapshot:(next,err)=>{const h=r.on('value',s=>{const docs=[];s.forEach(c=>{const cs=c.child('_d');if(cs.exists())docs.push({id:c.key,exists:true,data:()=>cs.val()});});next({docs:docs,size:docs.length,empty:!docs.length,metadata:{}});},e=>{if(err)err(fbErr(e));});return()=>r.off('value',h);}};}
  return{doc:doc,collection:collection};
}
async function fbInit(){

  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();
  await new Promise(r=>{let done=false;const un=auth.onAuthStateChanged(()=>{if(done)return;done=true;try{un();}catch(e){}r();});setTimeout(()=>{if(!done){done=true;r();}},6000);});
  if(!auth.currentUser)await auth.signInAnonymously();
  NET.uid=auth.currentUser.uid;NET.db=fbAdapter(firebase.database());NET.canWrite=true;NET.mode='firebase';NET.status='ok';
  try{accInit();}catch(e){console.error(e);}
}

function roomRef(){return NET.db.doc('tp/'+NET.code);}

function hostName(){if(!ST||!ST.net)return '';const g=(ST.gms||[]).find(x=>x.pid===ST.net.host);if(g)return g.name;const p=ST.net.lobby.players.find(x=>x.pid===ST.net.host);return p?p.name:'';}

  UI.pendT=setTimeout(()=>{if(UI.pending){UI.pending=false;render();toast('Keine Antwort vom Host – ist seine App noch geöffnet?');}},15000);
  sendInbox();render();
}
function apply(gi,t,d,pid){const h=H[t];if(h){try{h(gi,d||{},pid);}catch(e){console.error(e);}}}

/* ── Timer & Bereit-Status (Host steuert, alle sehen den Countdown) ── */
function setTimer(key,dur){ST.tmSeq=(ST.tmSeq||0)+1;ST.tm={id:ST.tmSeq,key:key,dur:dur,until:Date.now()+dur*1000};}
function hostTimers(){
  clearTimeout(NET.tmT);const t=ST&&ST.tm;if(!t||!NET.host)return;
  NET.tmT=setTimeout(()=>{
    if(!ST||!NET.on||!NET.host||!ST.tm||ST.tm.id!==t.id)return;
    if(t.key==='dice'){ST.tm=null;ST.gms.forEach((g,i)=>{if(!g.roll)H.roll_me(i,{});});}

  },Math.max(0,t.until-Date.now())+150);
}
function hostAuto(){
  if(ST.mode==='jb'){jbHostAuto();return;}
  if(ST.rdy&&humans().every(i=>ST.rdy.done.indexOf(i)>-1))nextPhase();
  if(ST.phase==='dice'&&!ST.order.length&&(!ST.tm||ST.tm.key!=='dice'))setTimer('dice',15);
  let need=null;
  if(ST.phase==='dice'&&ST.order.length)need=['dice',15];
  else if(ST.phase==='captain'&&ST.cap.turn>=ST.gms.length)need=['captain',15];
  else if(ST.phase==='fa'&&ST.fa&&faCur()<0)need=['fa',30];
  else if(ST.phase==='draft'&&draftDone())need=['draft',30];
  else if(ST.phase==='events')need=['events',30];
  else if(ST.phase==='season')need=['season',30];
  else if(ST.phase==='trade')need=['trade',0];
  else if(ST.phase==='release')need=['release',0];
  else if(ST.phase==='draft'&&ST.dr&&ST.dr.setup)need=['bets',0];
  else if(ST.phase==='trade_mid')need=['trade_mid',30];
  if(need){if(!ST.rdy||ST.rdy.ph!==need[0]){ST.rdy={ph:need[0],done:[]};if(need[1])setTimer('rdy',need[1]);else ST.tm=null;}}
  else{if(ST.rdy)ST.rdy=null;if(ST.tm&&ST.tm.key==='rdy')ST.tm=null;}
  if(ST.phase==='hub'){const md=curMd();if(md&&!md.done){md.games.forEach(G=>{if(G.st==='open'){if(isBot(G.h)&&isBot(G.a))G.st='auto';else netLineupCheck(G);}});maybeComplete();}}

  }
}

setInterval(()=>{const els=document.querySelectorAll('[data-cd]');for(const el of els){const s=String(Math.max(0,Math.ceil((+el.dataset.cd-Date.now())/1000)));if(el.textContent!==s)el.textContent=s;}},250);

/* ── Effekte, die auf allen Geräten abgespielt werden ── */
function fx(k,d,to){ST.fxs=(ST.fxs||0)+1;ST.fx.push({s:ST.fxs,k:k,d:d,to:to||null});if(ST.fx.length>30)ST.fx.splice(0,ST.fx.length-30);}
function playFx(){if(!ST||!ST.fx)return;const me=ME();ST.fx.forEach(f=>{if(f.s>UI.fxSeen){UI.fxSeen=f.s;if(!f.to||f.to.indexOf(me)>-1)UI.fxQ.push(f);}});nextFx();}
function nextFx(){
  if(UI.fxBusy||!UI.fxQ.length)return;const f=UI.fxQ.shift(),fn=FX[f.k];UI.fxBusy=true;let fin=false;
  const done=()=>{if(fin)return;fin=true;UI.fxBusy=false;nextFx();};
  if(fn&&ST&&NET.on){try{fn(f.d,done);}catch(e){done();}}else done();
}
const FX={
  msg:(t,done)=>{toast(t);setTimeout(done,900);},
  die:(d,done)=>{
    done();sfx('dice');if(RM||!ST||ST.phase!=='dice')return;UI.dieAnim=UI.dieAnim||{};UI.dieAnim[d.gi]=1;render();
    const iv=setInterval(()=>{const el=$('die-'+d.gi);if(el)el.textContent=DIE[rint(1,6)];},80);
    setTimeout(()=>{clearInterval(iv);if(UI.dieAnim)delete UI.dieAnim[d.gi];if(!ST)return;render();const el=$('die-'+d.gi);if(el)el.classList.add('landed');},900);
  },
  dice:(d,done)=>{
    if(RM||!ST||ST.phase!=='dice'){done();return;}
    UI.diceAnim=true;render();const gs=ST.gms.slice(),n=gs.length;
    gs.forEach((g,i)=>{const el=$('die-'+i);if(!el)return;el.classList.add('rolling');const iv=setInterval(()=>{el.textContent=DIE[rint(1,6)];},80);
      setTimeout(()=>{clearInterval(iv);el.classList.remove('rolling');el.textContent=DIE[g.roll];el.classList.add('landed');},800+i*350);});
    setTimeout(()=>{UI.diceAnim=false;render();done();},800+(n-1)*350+750);
  },
  reveal:(d,done)=>{
    const g=G_(d.gi);if(!g){done();return;}
    if(RM){cardSheet(d.id,d.gi,{title:'Dein Kapitän'});done();return;}
    showReveal({front:cardHTML(d.id,g),back:'<div class="back lgd">🏀</div>',from:null,glow:TIER_COL.Legend,kicker:'Dein Kapitän · Legend',title:esc(DB[d.id].name),sub:`${POS_NAME[DB[d.id].pos]} · OVR ${rating(g,d.id)}`,onDone:done});
  },
  lottery:(d,done)=>{
    if(RM){toast(`Pick ${d.n}: ${d.gi===ME()?'Du!':G_(d.gi).name}`);setTimeout(done,900);return;}
    lotAnim(d.gi,d.n,d.rem,done);
  }
};

/* ── Spiel-Handler (laufen nur beim Host) ── */
function newGM(name,team,pid,uid,bot){return{name:name,team:team,pid:pid,uid:uid||'',bot:bot,roster:[],trade:0,picks:0,rings:0,ringHolder:false,inj:{},buffs:[],up:{},roll:0,w:0,l:0,pf:0,pa:0};}
function lobbyJoin(pid,b){
  const L=ST.net.lobby;
  if(b.left){const k=L.players.findIndex(x=>x.pid===pid&&pid!==ST.net.host);if(k<0)return false;L.players.splice(k,1);return true;}
  if(L.players.some(x=>x.pid===pid)||L.players.length>=(ST.mode==='jb'?2:6))return false;
  if(b.name==null)return false;
  const used=L.players.map(x=>x.team);let t=b.team|0;if(t<0||t>5||used.indexOf(t)>-1)t=[0,1,2,3,4,5].find(x=>used.indexOf(x)<0);
  L.players.push({pid:pid,uid:String(b.uid||''),name:String(b.name||'Gast').slice(0,14),team:t});L.n=Math.max(L.n,L.players.length);return true;
}
const H={};
H.lobby_n=(gi,d,pid)=>{if(ST.phase!=='lobby'||!isHostP(pid))return;const L=ST.net.lobby;L.n=Math.max(2,L.players.length,Math.min(6,d.n|0));};
H.lobby_team=(gi,d,pid)=>{if(ST.phase!=='lobby')return;const L=ST.net.lobby,p=L.players.find(x=>x.pid===pid),t=d.team|0;if(!p||t<0||t>5||L.players.some(x=>x!==p&&x.team===t))return;p.team=t;};
H.lobby_leave=(gi,d,pid)=>{if(ST.phase!=='lobby'||isHostP(pid))return;const L=ST.net.lobby;L.players=L.players.filter(x=>x.pid!==pid);};
H.start=(gi,d,pid)=>{
  if(ST.phase!=='lobby'||!isHostP(pid))return;const L=ST.net.lobby,n=Math.max(L.n,L.players.length);
  const used=L.players.map(p=>p.team),free=shuffle([0,1,2,3,4,5].filter(t=>used.indexOf(t)<0));
  ST.gms=L.players.map(p=>newGM(p.name,p.team,p.pid,p.uid,false));
  let b=0;const _bn=botNames(6);while(ST.gms.length<n){ST.gms.push(newGM('🤖 '+_bn[b],free.shift(),null,'',true));b++;}
  ST.goal=goalOf(L.goalMode||'two',L.goalN||3);ST.cards=cardsSnapshot();ST.phase='dice';
};
H.claim=(gi,d,pid)=>{if(ST.phase==='lobby'||ST.closed||ST.gms.some(g=>g.pid===pid))return;const k=d.gi|0,g=ST.gms[k];if(!g)return;
  if(g.bot){g.bot=false;g.name=String((NET.names&&NET.names[pid])||'Gast').slice(0,14);g.pid=pid;g.uid=NET.uids[pid]||'';fx('msg',g.name+' übernimmt '+TEAMS[g.team].name,othersOf(k));return;}
  g.pid=pid;if(NET.uids[pid])g.uid=NET.uids[pid];fx('msg',g.name+' ist wieder dabei',othersOf(k));};
H.quit=(gi,d,pid)=>{
  if(ST.mode==='jb'&&ST.phase!=='lobby'){if(gi<0||isBot(gi))return;const g=G_(gi);fx('msg',g.name+' hat das Match verlassen',othersOf(gi));g.bot=true;g.pid=null;g.uid='';g.name='🤖 '+g.name;return;}
  if(ST.phase==='lobby'){if(!isHostP(pid)){const L=ST.net.lobby;L.players=L.players.filter(x=>x.pid!==pid);}return;}
  if(gi<0||isBot(gi))return;const g=G_(gi);fx('msg',g.name+' hat das Spiel verlassen – ein KI-Manager übernimmt',othersOf(gi));g.bot=true;g.pid=null;g.uid='';g.name='🤖 '+g.name;};
H.roll=(gi,d,pid)=>{
  if(ST.phase!=='dice'||ST.order.length||!isHostP(pid))return;
  let r;do{r=ST.gms.map(()=>rint(1,6));}while(new Set(r).size!==r.length);
  ST.gms.forEach((g,i)=>{g.roll=r[i];});ST.order=ST.gms.map((g,i)=>i).sort((a,b)=>ST.gms[b].roll-ST.gms[a].roll);fx('dice',{});
};
H.ready=(gi)=>{const r=ST.rdy;if(!r||gi<0||isBot(gi)||r.done.indexOf(gi)>-1)return;r.done.push(gi);if(humans().every(i=>r.done.indexOf(i)>-1))nextPhase();};
H.roll_me=(gi)=>{
  if(ST.phase!=='dice'||ST.order.length||gi<0)return;const g=G_(gi);if(!g||g.roll)return;
  g.roll=rint(1,6);fx('die',{gi:gi,r:g.roll});
  if(ST.gms.every(x=>x.roll)){
    const tb=ST.gms.map(()=>Math.random());
    ST.gms.forEach((x,i)=>{x.tie=ST.gms.some((y,j)=>j!==i&&y.roll===x.roll);});
    ST.order=ST.gms.map((x,i)=>i).sort((a,b)=>ST.gms[b].roll-ST.gms[a].roll||tb[b]-tb[a]);
  }
};
H.next=(gi,d,pid)=>{if(isHostP(pid))nextPhase();};
function nextPhase(){
  const ph=ST.phase;ST.rdy=null;ST.tm=null;
  if(ph==='dice'&&ST.order.length)enterCaptain();
  else if(ph==='captain'&&ST.cap.turn>=ST.gms.length)enterFA('start');
  else if(ph==='fa'&&faCur()<0)endFA();
  else if(ph==='draft'&&ST.dr&&ST.dr.setup){ST.dr.bets=ST.dr.bets||{};humans().forEach(i=>{if(ST.dr.bets[i]==null)ST.dr.bets[i]=0;});netBuildBalls();}
  else if(ph==='draft'&&draftDone()){const r=ST.dr,sm=r.mode==='season';ST.decks.R=ST.decks.R.concat(r.pool);ST.dr=null;if(sm)ST.season++;startSeason();initMd();}
  else if(ph==='season'){ST.tr={stage:'post'};ST.offers=[];ST.phase='trade';}
  else if(ph==='trade'){ST.offers=[];if(ST.tr&&ST.tr.stage==='mid'){ST.midTrade=true;initMd();ST.phase='hub';}else ST.phase='release';}
  else if(ph==='release'){botReleases();enterFA('season');}
  else if(ph==='events')netAdvance();
  else if(ph==='trade_mid'){ST.midTrade=true;initMd();ST.phase='hub';}
};
H.cap=(gi,d)=>{
  if(ST.phase!=='captain')return;const c=ST.cap;if(c.turn>=ST.gms.length||ST.order[c.turn]!==gi)return;
  const i=d.i|0;if(i<0||i>=c.pool.length)return;const id=c.pool.splice(i,1)[0];
  G_(gi).roster.push(id);if(ST.decks.L.length)c.pool.push(ST.decks.L.shift());c.turn++;
  if(!isBot(gi))fx('reveal',{id:id,gi:gi},[gi]);fx('msg',G_(gi).name+' zieht '+DB[id].name,othersOf(gi));
};
H.fa_sign=(gi,d)=>{
  if(ST.phase!=='fa'||faCur()!==gi)return;const f=ST.fa,i=f.pool.indexOf(d.id);if(i<0||faCheck(gi,d.id))return;
  f.pool.splice(i,1);G_(gi).roster.push(d.id);if(f.mode==='start')f.left[gi]--;else G_(gi).trade--;
  if(ST.decks.FA.length)f.pool.push(ST.decks.FA.shift());f.skips[gi]=0;f.turn++;
  fx('msg',G_(gi).name+' verpflichtet '+DB[d.id].name,othersOf(gi));
};
H.fa_skip=(gi)=>{if(ST.phase!=='fa'||faCur()!==gi)return;const f=ST.fa;if(f.mode==='season')f.passed[gi]=true;else{f.skips[gi]=(f.skips[gi]||0)+1;if(f.skips[gi]>=6)f.left[gi]=0;}f.turn++;};
H.draw=(gi)=>{
  const r=ST.dr;if(ST.phase!=='draft'||!r||r.setup||r.cur>=0)return;
  const rem=r.balls.filter(x=>r.order.indexOf(x)<0);if(!rem.length)return;if(gi<0&&!rem.every(isBot))return;
  const g2=pick(rem);r.order.push(g2);r.cur=g2;fx('lottery',{gi:g2,n:r.order.length,rem:rem});
};
H.dr_take=(gi,d)=>{const r=ST.dr;if(ST.phase!=='draft'||!r||r.cur!==gi||gi<0)return;const i=r.pool.indexOf(d.id);if(i<0||draftCheck(gi))return;r.pool.splice(i,1);G_(gi).roster.push(d.id);r.picks.push({gi:gi,id:d.id});r.cur=-1;fx('msg',G_(gi).name+' draftet '+DB[d.id].name,othersOf(gi));};
H.dr_skip=(gi)=>{const r=ST.dr;if(ST.phase!=='draft'||!r||r.cur!==gi||gi<0)return;r.picks.push({gi:gi,id:null});r.cur=-1;};
function draftDone(){const r=ST.dr;return !!r&&!r.setup&&r.cur<0&&!r.balls.filter(x=>r.order.indexOf(x)<0).length;}

/* ── KI-Manager (laufen beim Host) ── */
function botTick(){
  clearTimeout(NET.botT);if(!ST||!NET.on||!NET.host)return;
  const ph=ST.phase,run=(gi,t,d,ms)=>{NET.botT=setTimeout(()=>{if(!ST||!NET.on||!NET.host)return;apply(gi,t,d,NET.pid);commitNet();},ms);};
  if(ph==='dice'){if(!ST.order.length){const gi=ST.gms.findIndex(g=>g.bot&&!g.roll);if(gi>=0)run(gi,'roll_me',{},900+rint(0,700));}}
  else if(ph==='captain'){const c=ST.cap;if(c.turn<ST.gms.length){const gi=ST.order[c.turn];if(isBot(gi))run(gi,'cap',{i:rint(0,c.pool.length-1)},1100);}}
  else if(ph==='fa'){const gi=faCur();if(gi>=0&&isBot(gi)){const id=botFAChoice(gi);run(gi,id?'fa_sign':'fa_skip',id?{id:id}:{},900);}}
  else if(ph==='hub')botHub();
  else if(ph==='jb_draft'){const gi=jbCur();if(gi>=0&&isBot(gi))run(gi,'jb_pick',{id:jbAutoPick(gi)},1300);}
  else if(ph==='draft'){const r=ST.dr;if(r&&!r.setup){
    if(r.cur>=0&&isBot(r.cur)){const id=botDraftChoice(r.cur);run(r.cur,id?'dr_take':'dr_skip',id?{id:id}:{},2800);}
    else if(r.cur<0){const rem=r.balls.filter(x=>r.order.indexOf(x)<0);if(rem.length&&rem.every(isBot))run(-1,'draw',{},1800);}}}
}
function botFAChoice(gi){
  const f=ST.fa,g=G_(gi),opts=f.pool.filter(id=>!faCheck(gi,id)).map(id=>({id:id}));if(!opts.length)return null;
  if(f.mode==='start'){const miss=missingPos(g.roster);opts.forEach(o=>{const c=DB[o.id];o.s=rating(null,o.id)+(miss.indexOf(c.pos)>-1?6:0)-c.sal*0.08+Math.random()*3;});}
  else opts.forEach(o=>{const c=DB[o.id],same=g.roster.filter(x=>DB[x].pos===c.pos).map(x=>rating(g,x)),worst=same.length?Math.min.apply(null,same):0;o.s=rating(null,o.id)-worst+(g.roster.length<9?6:0)+Math.random()*2;});
  opts.sort((a,b)=>b.s-a.s);if(f.mode==='season'&&opts[0].s<2)return null;return opts[0].id;
}
function botDraftChoice(gi){const r=ST.dr,g=G_(gi),miss=missingPos(g.roster);if(draftCheck(gi)||!r.pool.length)return null;return r.pool.map(id=>({id:id,s:rating(null,id)+(miss.indexOf(DB[id].pos)>-1?5:0)+Math.random()*2})).sort((a,b)=>b.s-a.s)[0].id;}

};

function netBuildBalls(){
  const r=ST.dr;r.bets=r.bets||{};r.balls=[];
  ST.gms.forEach((g,i)=>{let b=0;if(g.roster.length<CFG.ROSTER_MAX&&g.picks>0)b=g.bot?Math.min(g.picks,rint(1,2)):(r.bets[i]||0);b=Math.max(0,Math.min(b,g.picks));g.picks-=b;for(let k=0;k<b;k++)r.balls.push(i);});
  r.balls=shuffle(r.balls);r.setup=false;
