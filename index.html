<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOP PICK – Basketball Manager</title>
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TOP PICK">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0f1e;--p2:#0d1527;--ln:rgba(255,255,255,.08);--fg:#e8eefc;--sub:#9aa8c3;--mut:#65738c;--acc:#ff9a3c;--acc2:#ff9a3c;--sky:#7dd3fc;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:'Barlow',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% -180px,#1b2752 0%,var(--bg) 70%) fixed}
button,input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.kick{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.h1{font-size:23px;font-weight:900;margin:2px 0 4px}
.h2{font-size:16px;font-weight:800}
.sub{color:var(--sub);font-size:13px;line-height:1.55}
.s{font-size:12px}.mut{color:var(--mut)}.b{font-weight:800}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}.between{justify-content:space-between}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:14px;padding:14px 16px;border-radius:13px;background:var(--acc);color:#2a1300;width:100%}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1b2742;color:#dbe7ff;border:1px solid var(--ln)}
.btn.ok{background:#34d399;color:#03170d}
.btn.warn{background:#fbbf24;color:#2a1800}
.btn.bad{background:#fb7185;color:#2b0710}
.btn.sm{width:auto;padding:9px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.38;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--sub);white-space:nowrap}
.chip.ok{border-color:rgba(52,211,153,.4);color:var(--ok);background:rgba(52,211,153,.08)}
.chip.bad{border-color:rgba(251,113,133,.4);color:var(--bad);background:rgba(251,113,133,.08)}
.chip.acc{border-color:rgba(var(--acc-rgb),.45);color:var(--acc);background:rgba(var(--acc-rgb),.1)}
button.chip{cursor:pointer;padding:7px 11px}
.badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;overflow:hidden}
.badge.lg{width:52px;height:52px;border-radius:14px;font-size:13px}
.badge img{width:100%;height:100%;object-fit:contain}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--p2);border:1px solid var(--ln);border-radius:12px}
.item.tap{cursor:pointer}
.item.on{border-color:var(--ok);background:rgba(52,211,153,.08)}
.item.off{opacity:.45}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:22px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,15,30,0),rgba(10,15,30,.95) 40%);pointer-events:none}
.cta .in{max-width:560px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.cta .in .btn{flex:1}
.seg{display:flex;gap:6px}
.segb{flex:1;padding:12px 0;border-radius:11px;border:1px solid var(--ln);background:var(--p2);font-weight:900;font-size:16px;cursor:pointer}
.segb.on{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.12)}
.inp{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:12px;font-weight:700;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamb{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;text-align:left;font-size:12px;font-weight:800;line-height:1.2}
.die{font-size:30px;width:38px;text-align:center}
.code{font-size:42px;font-weight:900;letter-spacing:.3em;color:var(--acc);margin:4px 0;font-variant-numeric:tabular-nums}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);margin:0 2px;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
/* Header */
#hdr{position:sticky;top:0;z-index:20;background:rgba(10,15,30,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
#hdr .in{max-width:560px;margin:0 auto;padding:10px 14px 8px}
.htop{display:flex;align-items:center;gap:10px}
.tn{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{font-size:11px;color:var(--sub);font-weight:700}
.hst{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.hst::-webkit-scrollbar{display:none}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;font-size:16px;flex-shrink:0}
/* Karten – Platzhalter im Stil der echten TOP-PICK-Karten */
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:10px;border:2px solid;overflow:hidden;container-type:inline-size;color:#fff}
.card.img{border:0;background:none}
.card.img img{width:100%;height:100%;object-fit:cover;display:block}
.c-sal{position:absolute;left:3cqw;top:5cqw;writing-mode:vertical-rl;transform:rotate(180deg);font-size:6.5cqw;font-weight:900;letter-spacing:.08em;color:#86efac}
.c-ovr{position:absolute;left:13cqw;top:4.5cqw;font-size:6cqw;font-weight:900;background:rgba(0,0,0,.45);padding:.6cqw 1.8cqw;border-radius:1.8cqw}
.c-skill{position:absolute;right:0;top:4cqw;max-width:60cqw;padding:1.6cqw 3cqw 1.6cqw 4cqw;border-radius:4cqw 0 0 4cqw;font-size:6cqw;font-weight:900;color:#1b1204;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.c-face{position:absolute;left:50%;top:18cqw;width:48cqw;height:48cqw;margin-left:-24cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17cqw;font-weight:900;border:1.2cqw solid}
.c-name{position:absolute;left:3cqw;right:3cqw;top:69cqw;text-align:center;font-size:8.5cqw;font-weight:900;line-height:1.1;text-transform:uppercase;text-shadow:0 1cqw 2cqw rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-stars{position:absolute;left:0;right:0;top:80cqw;text-align:center;font-size:8cqw;letter-spacing:1cqw;line-height:1}
.c-stars .on{color:#fde047;text-shadow:0 0 2cqw rgba(253,224,71,.6)}
.c-stars .off{color:rgba(255,255,255,.28)}
.c-bot{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;display:grid;grid-template-columns:1fr 24cqw 1fr;gap:2cqw;align-items:end}
.c-col{display:flex;flex-direction:column;gap:2cqw}
.pl{border:.8cqw solid rgba(255,255,255,.85);border-radius:2.5cqw;text-align:center;padding:1cqw 0 1.2cqw;line-height:1}
.pl i{display:block;font-style:normal;font-size:4.6cqw;font-weight:900}
.pl b{display:block;font-size:10cqw;font-weight:900;text-shadow:0 .6cqw 1cqw rgba(0,0,0,.35)}
.pl.o{background:#8fa3c6}.pl.o i{color:#21407e}
.pl.d{background:#b35a5a}.pl.d i{color:#5c1515}
.c-pos{text-align:center;padding-bottom:1cqw}
.c-pos b{display:block;font-size:11cqw;font-weight:900;line-height:1}
.c-pos small{display:block;font-size:4.2cqw;font-weight:900;margin-top:.8cqw;color:rgba(255,255,255,.85)}
.c-bonus{display:inline-block;margin-top:1.5cqw;font-size:4.4cqw;font-weight:900;padding:.8cqw 1.6cqw;border-radius:1.6cqw;color:#1b1204;white-space:nowrap}
.card.mini .m-top{position:absolute;left:5cqw;right:5cqw;top:4cqw;display:flex;justify-content:space-between;font-size:13cqw;font-weight:900;line-height:1.1}
.card.mini .ovr2{background:rgba(0,0,0,.45);border-radius:3cqw;padding:0 3cqw}
.card.mini .c-face{top:22cqw;width:46cqw;height:46cqw;margin-left:-23cqw;font-size:16cqw}
.card.mini .m-name{position:absolute;left:3cqw;right:3cqw;top:72cqw;text-align:center;font-size:11cqw;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.card.mini .m-st{position:absolute;left:4cqw;right:4cqw;bottom:4cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.5cqw}
.card.mini .m-st span{font-size:13cqw;font-weight:900;text-align:center;border-radius:3cqw;line-height:1.25}
.card.mini .m-st .o{background:#8fa3c6}.card.mini .m-st .d{background:#b35a5a}
.injb{position:absolute;top:28%;left:4px;font-size:9px;font-weight:900;background:var(--bad);color:#2b0710;border-radius:5px;padding:1px 4px}
.back{width:100%;aspect-ratio:5/7;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:repeating-linear-gradient(45deg,#14203d 0 7px,#101a33 7px 14px);display:flex;align-items:center;justify-content:center;font-size:24px}
.back.lgd{border-color:rgba(247,168,27,.6);background:repeating-linear-gradient(45deg,#3a2508 0 7px,#2b1b06 7px 14px)}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
.cw{border-radius:12px;display:block;width:100%}
.cw.sel{outline:2.5px solid var(--acc);outline-offset:1px;cursor:pointer;animation:pa 1.6s ease-in-out infinite}
.cw.dis{opacity:.35}
.cw.tgt{outline:2.5px solid var(--bad);outline-offset:1px;cursor:pointer;animation:pr 1.6s ease-in-out infinite}
.cw.glow{outline:2.5px solid var(--warn);outline-offset:1px;box-shadow:0 0 18px rgba(251,191,36,.5);animation:none}
.cw.uw{opacity:.6;outline:2px solid var(--ok);outline-offset:1px}
.cw.ul{opacity:.22}
@keyframes pa{50%{box-shadow:0 0 16px rgba(var(--acc-rgb),.5)}}
@keyframes pr{50%{box-shadow:0 0 16px rgba(251,113,133,.5)}}
/* Spielfeld */
.court{position:relative;border-radius:18px;background:linear-gradient(180deg,#0d1b36,#0a1429);border:1px solid var(--ln);padding:8px 4px;margin-top:10px;overflow:hidden}
.court.full:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.09)}
.court.full:after{content:'';position:absolute;left:50%;top:50%;width:84px;height:84px;border:1px solid rgba(255,255,255,.07);border-radius:50%;transform:translate(-50%,-50%)}
.crow{display:flex;justify-content:center;gap:8px;margin:4px 0;position:relative;z-index:1}
.cs{width:var(--cw);display:flex;flex-direction:column;align-items:center;gap:2px}
.cs .lab{font-size:9px;font-weight:800}
:root{--cw:clamp(64px,min(calc((100vw - 44px) / 3),calc((100vh - 260px) / 5.6)),120px)}
@supports (height:100svh){:root{--cw:clamp(64px,min(calc((100vw - 44px) / 3),calc((100svh - 260px - env(safe-area-inset-bottom,0px)) / 5.6)),120px)}}
:root{--cw-lu:var(--cw)}
@supports (height:100lvh){:root{--cw-lu:clamp(64px,min(calc((100vw - 44px) / 3),calc((100lvh - 260px) / 5.6)),120px)}}
.court:not(.full) .cs{width:var(--cw-lu)}
body.mm .court.full .cs{width:var(--cwm,var(--cw))}
.hcap{display:none}.stb{display:none}
html:has(body.mm),body.mm{overflow:hidden;overscroll-behavior:none}
body.mm #app{padding-bottom:0}
body.mm #hdr .hst{display:none}
body.mm #hdr .in{padding:6px 12px}
body.mm #hdr .htop{gap:8px}
body.mm #hdr .badge{width:26px;height:26px;border-radius:8px;font-size:8px}
body.mm #hdr .tn{font-size:13px}
body.mm #hdr .ts{display:none}
body.mm #hdr .ib{width:32px;height:32px;border-radius:9px;font-size:14px}
body.mm .hcap{display:inline-flex}
body.mm #app{padding-top:8px;padding-left:10px;padding-right:10px}
body.mm .scoreb{padding:6px 10px;border-radius:12px}
body.mm .scoreb .sc{font-size:22px}
body.mm .scoreb .badge{width:26px;height:26px;border-radius:8px;font-size:8px}
body.mm .scoreb .s.mut{display:none}
body.mm .scoreb+.row{margin-top:4px;font-size:11px}
body.mm .court{margin-top:6px;padding:6px 4px}
body.mm .court .crow{margin:3px 0;gap:8px}
body.mm .court>div[style*="height:12px"]{height:4px!important}
body.mm .hl{font-size:9px;margin:0}
body.mm .cs .lab{display:none}
body.mm .cs .cw{position:relative}
body.mm .stb{display:flex;position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#06121d;border:2px solid #0a1429;z-index:2}
.lot-drum.phys{animation:none}
.drum-t{font-size:22px;font-weight:900;letter-spacing:.1em;color:var(--acc)}
.stb.w{background:var(--ok)}.stb.l{background:var(--bad)}

.hl{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);position:relative;z-index:1;margin:2px 0}
.empty{width:100%;aspect-ratio:5/7;border-radius:12px;border:2px dashed rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.scoreb{display:flex;align-items:center;justify-content:space-between;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;gap:8px}
.scoreb .sc{font-size:28px;font-weight:900;min-width:24px;text-align:center}
.hint{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(13,21,39,.97);border-top:1px solid var(--ln)}
.hint .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub);min-height:36px}
/* Sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,15,.75);display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#111a2e;border:1px solid var(--ln);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out}
.sheet:before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 12px}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.tile.act{cursor:pointer;border-width:2px}
.tile .v{font-size:22px;font-weight:900}
.tile .n{font-size:11px;color:var(--sub);font-weight:700}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.duel{display:flex;align-items:center;gap:10px}
.duel .side{flex:1;min-width:0}
.duel .side .card{max-width:150px;margin:0 auto}
.bigv{font-size:34px;font-weight:900;text-align:center}
.res{text-align:center;font-weight:900;padding:10px;border-radius:12px;margin-top:10px}
/* Liga */
.game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px;background:var(--p2);border:1px solid var(--ln);border-radius:12px}
.game.mine{border-color:rgba(125,211,252,.45);background:rgba(125,211,252,.06)}
.court-logo{position:absolute;left:50%;top:50%;width:64%;max-width:250px;aspect-ratio:1/1;transform:translate(-50%,-50%);background:var(--logo-img) center/contain no-repeat;opacity:.13;pointer-events:none;z-index:0}
:root{--acc-rgb:255,154,60;--tc:255,154,60;--tl:#ffb877;--tt:#2a1300}
body.tm{--acc:var(--tm);--acc2:var(--tm);--acc-rgb:var(--tc);background:radial-gradient(760px 460px at 50% -160px,rgba(var(--tc),.16) 0%,rgba(var(--tc),0) 72%),radial-gradient(900px 520px at 50% -180px,#1b2752 0%,var(--bg) 70%) fixed}
body.tm #hdr{background:linear-gradient(rgba(var(--tc),.08),rgba(var(--tc),.08)),rgba(10,15,30,.92);border-bottom-color:rgba(var(--tc),.22)}
body.tm #hdr .ib{border-color:rgba(var(--tc),.2)}
body.tm .kick{color:var(--tl)}
body.tm .tab.on{background:rgba(var(--tc),.13);color:var(--tl)}
body.tm .game.mine{border-color:rgba(var(--tc),.4);background:rgba(var(--tc),.055)}
body.tm .panel.mine{border-color:rgba(var(--tc),.26);background:linear-gradient(180deg,rgba(var(--tc),.06),rgba(255,255,255,.02))}
body.tm .btn:not(.sec):not(.ok):not(.warn):not(.bad){color:var(--tt)}

.gt{display:flex;align-items:center;gap:8px;min-width:0}
.gt.r{justify-content:flex-end;text-align:right}
.gn{min-width:0}
.gn div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsc{font-size:17px;font-weight:900;min-width:52px;text-align:center}
.tabs{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:4px;gap:4px;margin-top:12px}
.tab{flex:1;padding:9px 0;border-radius:9px;border:0;background:transparent;font-weight:800;font-size:13px;color:var(--sub);cursor:pointer}
.tab.on{background:#1d2a48;color:var(--fg)}
table.st{width:100%;border-collapse:collapse;font-size:13px}
.st th{font-size:10px;color:var(--mut);text-align:left;font-weight:800;padding:6px 4px;text-transform:uppercase;letter-spacing:.06em}
.st td{padding:8px 4px;border-top:1px solid var(--ln);font-weight:700}
.st tr.me td{color:var(--acc)}
.ball{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;border:2px solid rgba(255,255,255,.35)}
.ball.out{opacity:.22}
.drum{width:120px;height:120px;border-radius:50%;margin:16px auto 8px;border:3px solid rgba(125,211,252,.4);background:radial-gradient(circle at 35% 30%,#1d2c52,#0b1328);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}
.drum.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.evc{border-radius:18px;padding:16px;border:2px solid;text-align:center}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:#1b2742;font-weight:900;cursor:pointer}
.step b{min-width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1e3a5f;border:1px solid rgba(125,211,252,.3);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--acc);transition:transform .3s;z-index:60;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,-70px)}
/* Duell-Arena */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const DB=(function(){
  const db={};
  LEGEND_DATA.forEach((r,i)=>{const id='L'+String(i+1).padStart(2,'0');db[id]={id:id,name:r[0],pos:r[1],tier:'Legend',sh:r[2],dr:r[3],pd:r[4],rp:r[5],sal:100,skill:'',skillText:'',bonus:''};});
  // Platzhalter für Free Agents (All-Star/Basic) und Rookies – werden durch echte Karten ersetzt

  const PROF={G:{sh:6,pd:2,dr:5,rp:-14},F:{sh:0,pd:2,dr:2,rp:-2},C:{sh:-10,pd:-4,dr:0,rp:10}};
  const T={'All-Star':{b:[80,85],s:[20,38]},'Basic':{b:[71,77],s:[5,15]},'Rookie':{b:[71,76],s:[10,10]}};
  const used=new Set();
  function nm(){let n;do{n=FIRST[R(0,FIRST.length-1)]+' '+LAST[R(0,LAST.length-1)];}while(used.has(n));used.add(n);return n;}
  function make(pre,tier,count,cyc){
    for(let i=0;i<count;i++){
      const pos=cyc[i%cyc.length],t=T[tier],base=R(t.b[0],t.b[1]);

    }
  }

  make('B','Basic',56,['G','F','G','F','C']);
  make('R','Rookie',40,['G','F','G','F','C']);
  return db;
})();

function csvParse(t){
  const rows=[];let row=[],f='',q=false;t=String(t||'').replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function cardSlug(n){return String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function cardsParse(text){
  const rows=csvParse(text);if(rows.length<2)return{fatal:'Die Datei enthält keine Kartenzeilen.'};
  const H=rows[0].map(h=>String(h).trim().toLowerCase()),col=(...n)=>H.findIndex(h=>n.indexOf(h)>-1);
  const ci={name:col('kartenname')>-1?col('kartenname'):col('name','spielername','spieler'),tier:col('typ','stufe','tier'),pos:col('position','pos'),sh:col('wurf','sho','shooting'),dr:col('drive','drv','driving'),pd:col('per.def.','per. def.','per def','per','perimeter','perimeter def'),rp:col('zone def','zone def.','zone','rim protection'),sal:col('gehalt','salary','mio')};
  if(ci.name<0||ci.tier<0||ci.pos<0||ci.sh<0||ci.dr<0||ci.pd<0||ci.rp<0)return{fatal:'Spaltenüberschriften fehlen: Typ, Position, Kartenname, Wurf, Drive, Zone DEF, Per.Def.'};
  const TIERS={legend:'Legend',legends:'Legend',legende:'Legend',legenden:'Legend',stars:'All-Star',rookies:'Rookie','all-star':'All-Star',allstar:'All-Star','all star':'All-Star',star:'All-Star',basic:'Basic',starter:'Basic',rookie:'Rookie'},POSN={g:'G',guard:'G',f:'F',forward:'F',c:'C',center:'C'};
  const PRE={Legend:'L','All-Star':'S',Basic:'B',Rookie:'R'},builtin={};LEGEND_DATA.forEach((r,i)=>{builtin[cardSlug(r[0])]='L'+String(i+1).padStart(2,'0');});
  const seen=new Set(),errs=[],list=[],n={L:0,S:0,B:0,R:0};
  rows.slice(1).forEach((r,k)=>{
    const line=k+2,name=String(r[ci.name]||'').trim();if(!name)return;
    const tier=TIERS[String(r[ci.tier]||'').trim().toLowerCase()],pos=POSN[String(r[ci.pos]||'').trim().toLowerCase()];
    const v=x=>{const z=parseInt(String(r[x]||'').replace(/[^0-9]/g,''),10);return z>=1&&z<=99?z:null;};
    const st={sh:v(ci.sh),dr:v(ci.dr),pd:v(ci.pd),rp:v(ci.rp)};
    if(!tier){errs.push(`Zeile ${line} (${name}): Typ unbekannt`);return;}
    if(!pos){errs.push(`Zeile ${line} (${name}): Position muss Guard, Forward oder Center sein`);return;}
    if(Object.values(st).some(x=>x===null)){errs.push(`Zeile ${line} (${name}): Werte müssen Zahlen von 1 bis 99 sein`);return;}
    const slug=cardSlug(name);if(seen.has(slug)){errs.push(`Zeile ${line} (${name}): Kartenname doppelt`);return;}seen.add(slug);
    let sal=SAL_FIX[tier];if(sal==null){sal=ci.sal>-1?parseInt(String(r[ci.sal]||'').replace(/[^0-9]/g,''),10):NaN;if(!(sal>=1&&sal<=200))sal=null;}
    list.push({id:(tier==='Legend'&&builtin[slug])||(PRE[tier]+'_'+slug),name:name,pos:pos,tier:tier,sh:st.sh,dr:st.dr,pd:st.pd,rp:st.rp,sal:sal});n[PRE[tier]]++;
  });
  return{list:list,errs:errs,n:n};
}
function cardsApply(text,src,at){
  const P=cardsParse(text);if(P.fatal){CARDS.errors=[P.fatal];return false;}if(!P.list.length)return false;
  const ids=new Set();
  P.list.forEach(c=>{DB[c.id]=Object.assign(DB[c.id]||{},c,{skill:'',skillText:'',bonus:'',hidden:false});ids.add(c.id);});
  Object.keys(DB).forEach(id=>{if(!ids.has(id))DB[id].hidden=true;});
  // Gehalt automatisch nach Stärke, wenn keine Gehalt-Spalte gepflegt ist: All-Stars 20–38, Basics 5–15 Mio
  [['All-Star',20,38],['Basic',5,15]].forEach(([t,lo,hi])=>{const L=[...ids].filter(id=>DB[id].tier===t);if(!L.length)return;const ov=L.map(id=>rating(null,id)),mn=Math.min(...ov),mx=Math.max(...ov);
    L.forEach((id,k)=>{if(DB[id].sal==null){const f=mx>mn?(ov[k]-mn)/(mx-mn):.5;DB[id].sal=Math.round(lo+f*(hi-lo));}});});
  CARDS.src=src||'sheet';CARDS.n=P.n;CARDS.errors=P.errs;CARDS.at=at||Date.now();CARDS.ok=true;
  if(typeof cardImgRematch==='function')cardImgRematch();
  return true;
}

function cardsSource(){return (typeof CARDS_CSV_URL!=='undefined'&&CARDS_CSV_URL)||(typeof AUD!=='undefined'&&AUD&&AUD.cardsCsv)||'';}
async function cardsRefresh(){
  const URL_=cardsSource();if(!URL_)return false;
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(URL_+(URL_.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();
    if(/<html/i.test(t.slice(0,300)))throw new Error('Kein CSV – ist die Tabelle als CSV veröffentlicht?');
    if(cardsApply(t,'sheet')){try{localStorage.setItem('tp_cards_csv',t);localStorage.setItem('tp_cards_at',String(Date.now()));}catch(e){}CARDS.fetchErr='';return true;}
  }catch(e){CARDS.fetchErr=String(e&&e.message||e);}
  return false;
}
function cardsNeed(n){return{L:n,FA:8*n+8,R:n};}
function cardsCheck(n){
  const c=CARDS.n,need=cardsNeed(n),fa=c.S+c.B,miss=[];
  if(c.L<need.L)miss.push(`${need.L-c.L} Legend${need.L-c.L>1?'s':''}`);
  if(fa<need.FA)miss.push(`${need.FA-fa} All-Stars oder Basics`);
  if(c.R<need.R)miss.push(`${need.R-c.R} Rookie${need.R-c.R>1?'s':''}`);
  return miss;
}
function cardsWarnHTML(n,what){
  const miss=cardsCheck(n);if(!miss.length)return '';
  return `<div class="panel" style="border-color:rgba(251,113,133,.5)"><div class="b" style="color:var(--bad)">Zu wenige Karten für ${what}</div><div class="s mut" style="margin-top:6px;line-height:1.55">Es fehlen noch ${miss.join(', ')}. Trag weitere Karten in deine Kartentabelle ein.</div></div>`;
}
function cardsPanelHTML(){
  const c=CARDS,src=c.src==='sheet'?(/^https?:/i.test(cardsSource())?'Google Tabelle':'karten.csv'):'Eingebaute Karten';
  return `<div class="panel"><div class="lbl">Karten <span>${src}</span></div>
<div class="row wrap"><span class="chip">Legends ${c.n.L}</span><span class="chip">All-Stars ${c.n.S}</span><span class="chip">Basics ${c.n.B}</span><span class="chip">Rookies ${c.n.R}</span></div>
${c.src!=='builtin'&&c.at?`<div class="s mut mt">Stand: ${fmtAt(c.at)}</div>`:''}

${cardsSource()?'<button class="btn sec mt" onclick="cardsRefresh().then(()=>render())">Tabelle neu laden</button>':''}</div>`;
}

function cardsSnapshot(){if(CARDS.src==='builtin')return null;const o={};Object.keys(DB).forEach(id=>{const c=DB[id];if(!c.hidden)o[id]=[c.name,c.pos,c.tier,c.sh,c.dr,c.pd,c.rp,c.sal];});return o;}
function cardsMerge(m,ow){if(!m)return;Object.keys(m).forEach(id=>{const a=m[id];if(!Array.isArray(a))return;if(DB[id]&&!ow)return;DB[id]=Object.assign(DB[id]||{hidden:true},{id:id,name:a[0],pos:a[1],tier:a[2],sh:a[3],dr:a[4],pd:a[5],rp:a[6],sal:a[7],skill:'',skillText:'',bonus:''});});}
function cardImgRematch(){
  if(typeof AUD==='undefined'||!AUD||!AUD.cardFiles)return;const nrm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,''),idx={};
  Object.keys(DB).forEach(k=>{idx[nrm(DB[k].name)]=idx[nrm(DB[k].name)]&&!DB[idx[nrm(DB[k].name)]].hidden?idx[nrm(DB[k].name)]:k;});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ini(n){return n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();}
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

function G_(i){return ST.gms[i];}
function capOf(g){return CFG.CAP+(g.ringHolder?CFG.RING_BONUS:0)+(g.capX||0);}
function lineupCost(ids){return ids.reduce((s,id)=>s+DB[id].sal,0);}
function lvl(g,id){return g&&g.up[id]?g.up[id].n:0;}
function sv(g,id,k){let v=DB[id][k];if(g){v+=lvl(g,id)*CFG.UP_STEP;g.buffs.forEach(b=>{if(b.id===id&&b.k===k)v+=b.v;});}return Math.min(99,v);}
function rating(g,id){const a=[sv(g,id,'sh'),sv(g,id,'dr')].sort((x,y)=>y-x),d=[sv(g,id,'pd'),sv(g,id,'rp')].sort((x,y)=>y-x);return Math.round(a[0]*.35+a[1]*.15+d[0]*.35+d[1]*.15);}
function cnt(ids,p){return ids.filter(id=>DB[id].pos===p).length;}
function missingPos(ids){const m=[];for(const p in CFG.NEED)for(let i=cnt(ids,p);i<CFG.NEED[p];i++)m.push(p);return m;}
function healthy(g){return g.roster.filter(id=>!(g.inj[id]>0));}
function isInj(g,id){return g.inj[id]>0;}
function sortRoster(g){const o={G:0,F:1,C:2};return g.roster.slice().sort((a,b)=>o[DB[a].pos]-o[DB[b].pos]||rating(g,b)-rating(g,a));}
function combos(arr,k){const out=[],c=[];(function rec(s){if(c.length===k){out.push(c.slice());return;}for(let i=s;i<arr.length;i++){c.push(arr[i]);rec(i+1);c.pop();}})(0);return out;}

const SAVE_KEY='toppick_save_v2';let saveT=null;
// Veröffentlichte Seite: localStorage. Chat-Vorschau: window.storage als Ersatz.
const LS=(function(){try{const k='__tp';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}catch(e){return null;}})();
function hasWS(){return !!(window.storage&&typeof window.storage.set==='function');}
function hasStore(){return !!LS||hasWS();}
async function kvGet(k){if(LS){try{return LS.getItem(k);}catch(e){return null;}}if(!hasWS())return null;try{const r=await window.storage.get(k,false);return r&&r.value!=null?r.value:null;}catch(e){return null;}}
function kvSet(k,v){if(LS){try{LS.setItem(k,v);}catch(e){}return;}if(!hasWS())return;try{const p=window.storage.set(k,v,false);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function kvDel(k){if(LS){try{LS.removeItem(k);}catch(e){}return;}if(!hasWS())return;try{const p=window.storage.delete(k,false);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function save(){if(ST&&ST.mode==='up'){if(ST.phase!=='match')upSave();return;}if(!ST||NET.on||ST.phase==='match'||!hasStore())return;if(!UI.slot){if(SLOTS.length>=SLOT_MAX)return;UI.slot=newSlotId();SLOTS.unshift(slotMeta(UI.slot,ST));slotsSave();}const id=UI.slot,snap=JSON.stringify(ST);clearTimeout(saveT);saveT=setTimeout(()=>{kvSet(slotKey(id),snap);slotTouch(id,JSON.parse(snap));},700);}
async function loadSave(){const v=await kvGet(SAVE_KEY);if(!v)return null;try{return JSON.parse(v);}catch(e){return null;}}
function wipeSave(){kvDel(SAVE_KEY);}
function resume(){const s=UI.saved;if(!s)return;ST=s;UI.saved=null;go(ST.phase==='match'?'hub':ST.phase);}
function dropSave(){wipeSave();UI.saved=null;render();}
function resetGame(){clearTimeout(botT);clearTimeout(saveT);if(UI.slot)slotDel(UI.slot);UI.slot=null;ST=null;UI.saved=null;UI.m=null;UI.tr=null;UI.lu=null;UI.shLock=false;UI.screen='menu';closeSheet();render();window.scrollTo(0,0);}

let enterT=null;
function go(ph){
  if(NET.on){ST.phase=ph;return;} // online: Host veröffentlicht, refresh() übernimmt Darstellung
  const prev=ST.phase;ST.phase=ph;clearTimeout(botT);window.scrollTo(0,0);render();if(ph!=='match')save();
  if(RM)return;
  const a=$('app');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter');clearTimeout(enterT);enterT=setTimeout(()=>a.classList.remove('enter'),650);
  const it=introFor(prev,ph);if(it)showIntro(it);
  if(ph==='events')evReveal();
  if((ph==='season'||ph==='champion')&&ST.res&&ST.res.champ===0)setTimeout(()=>{confetti(ph==='champion'?220:140);sfx('win');},450);
}

function applyTheme(){
  let t=null;
  if(ST&&ST.gms&&ST.gms.length&&!(NET.on&&ST.phase==='lobby')){const k=ME();if(k>=0&&G_(k))t=TEAMS[G_(k).team];}
  const key=t?t.sh:'';if(UI.themeKey===key)return;UI.themeKey=key;const b=document.body;
  if(!t){b.classList.remove('tm');['--tm','--tc','--tl','--tt'].forEach(v=>b.style.removeProperty(v));return;}
  b.style.setProperty('--tm',t.tm);b.style.setProperty('--tc',t.rgb);b.style.setProperty('--tl',t.tl);b.style.setProperty('--tt',t.tx);b.classList.add('tm');
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content','#0a0f1e');
}
function fitCourt(){
  const b=document.body;if(!b.classList.contains('mm')){b.style.removeProperty('--cwm');return;}
  const court=document.querySelector('.court.full'),cs=court&&court.querySelector('.cs');if(!court||!cs)return;
  const hint=document.querySelector('.hint'),hH=hint?hint.getBoundingClientRect().height:60,w0=cs.getBoundingClientRect().width,rC=court.getBoundingClientRect();
  if(!w0||!rC.height)return;
  const other=rC.height-4*w0*1.4,avail=window.innerHeight-hH-10-rC.top;
  const w=Math.max(60,Math.min((avail-other)/5.6,(rC.width-26)/3,150));
  if(Math.abs(w-w0)>1){b.style.setProperty('--cwm',w.toFixed(1)+'px');requestAnimationFrame(fitCourt);}

function roundRobin(list){
  const a=list.slice();if(a.length%2)a.push(-1);
  const n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const g=[];
    for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x<0||y<0)continue;g.push((r+i)%2?[y,x]:[x,y]);}
    rounds.push(g);a.splice(1,0,a.pop());
  }
  return rounds;
}
function startSeason(){
  ST.gms.forEach(g=>{g.w=0;g.l=0;g.pf=0;g.pa=0;g.inj={};g.buffs=[];});
  const rr=roundRobin(ST.order);ST.sched=[];
  rr.forEach((gs,k)=>ST.sched.push({stage:'H',label:`Hinrunde · Spieltag ${k+1}/${rr.length}`,games:gs.map(p=>({h:p[0],a:p[1],hs:null,as:null}))}));
  rr.forEach((gs,k)=>ST.sched.push({stage:'R',label:`Rückrunde · Spieltag ${k+1}/${rr.length}`,games:gs.map(p=>({h:p[1],a:p[0],hs:null,as:null}))}));

}

/* ═════════════ AUFSTELLUNG (Gehaltsgrenze gilt für die Starting 5) ═════════════ */
function lineupReq(g){const h=healthy(g),base=h.length>=5?h:g.roster,r={};for(const p in CFG.NEED)r[p]=Math.min(CFG.NEED[p],cnt(base,p));return r;}
function autoLineup(g){
  const h=healthy(g),pool=h.length>=5?h:g.roster.slice(),req=lineupReq(g),cap=capOf(g);
  let best=null,bs=-1,cheap=null,cs=1e9;
  combos(pool,5).forEach(c=>{
    if(!Object.keys(req).every(p=>cnt(c,p)>=req[p]))return;
    const cost=lineupCost(c);if(cost<cs){cs=cost;cheap=c;}
    if(cost>cap)return;
    const s=c.reduce((a,id)=>a+rating(g,id),0);if(s>bs){bs=s;best=c;}
  });
  return best||cheap||pool.slice(0,5);
}
function arrange(ids){
  const slots=['G','G','F','F','C'],out=[null,null,null,null,null],rest=ids.slice();
  slots.forEach((p,i)=>{const k=rest.findIndex(id=>DB[id].pos===p);if(k>-1)out[i]=rest.splice(k,1)[0];});
  for(let i=0;i<5;i++)if(out[i]===null&&rest.length)out[i]=rest.shift();
  return out;
}
function lineupValid(g,ids){
  if(!ids||ids.length!==5)return false;
  const h=healthy(g);if(h.length>=5&&ids.some(id=>h.indexOf(id)<0))return false;
  const r=lineupReq(g);for(const p in r)if(cnt(ids,p)<r[p])return false;
  return lineupCost(ids)<=capOf(g);
}
function upLastLineup(){
  const g=G_(0),last=(ST.up&&ST.up.lastLu)||[],keep=last.filter(id=>g.roster.indexOf(id)>-1);
  if(keep.length===5&&lineupValid(g,keep))return keep.slice();
  let best=null,bs=-1;combos(g.roster,5).forEach(c=>{if(!keep.every(id=>c.indexOf(id)>-1)||!lineupValid(g,c))return;const sc=c.reduce((a,id)=>a+rating(g,id),0);if(sc>bs){bs=sc;best=c;}});
  return best||autoLineup(g);
}

/* ═════════════ SPIELTAG & EREIGNISSE ═════════════ */
function simGame(gm){let h=0,a=0;while(h<3&&a<3){if(Math.random()<.5)h++;else a++;}gm.hs=h;gm.as=a;gm.sim=true;}
function completeMatchday(){
  const md=ST.sched[ST.md];if(md.done){go('events');return;}
  const myG=md.games.find(x=>(x.h===0||x.a===0)&&x.hs===null);
  if(myG){coinSim(myG);return;}
  md.games.forEach(gm=>{if(!gm.lh)gm.lh=autoLineup(G_(gm.h));if(!gm.la)gm.la=autoLineup(G_(gm.a));});
  md.games.forEach(gm=>{
    if(gm.hs===null)simGame(gm);
    if(md.stage==='H'||md.stage==='R'){const H=G_(gm.h),A=G_(gm.a);H.pf+=gm.hs;H.pa+=gm.as;A.pf+=gm.as;A.pa+=gm.hs;if(gm.hs>gm.as){H.w++;A.l++;}else{A.w++;H.l++;}}
  });
  ST.ev={list:[]};
  md.games.forEach(gm=>{postGame(gm.h,gm.lh);postGame(gm.a,gm.la);});
  md.done=true;UI.lu=null;go('events');
}
function drawEvent(){const tot=EVENTS.reduce((s,e)=>s+e.w,0);let r=Math.random()*tot;for(const e of EVENTS){r-=e.w;if(r<0)return e.id;}return 'quiet';}
function doUp(g,id){if(!g.up[id])g.up[id]={n:0};if(g.up[id].n<CFG.UP_MAX)g.up[id].n++;}
function applyEvent(gi,ev,played){
  const g=G_(gi),hl=healthy(g);
  switch(ev){
    case 'inj':case 'sev':{if(!hl.length)return{text:'Niemand betroffen.'};const p=pick(hl);g.inj[p]=ev==='inj'?1:3;return{text:`${DB[p].name} fällt ${ev==='inj'?'das nächste Spiel':'3 Spiele'} aus.`};}
    case 'upg':{const rk=(played||[]).filter(x=>g.roster.indexOf(x)>-1&&DB[x].tier==='Rookie'&&lvl(g,x)<CFG.UP_MAX);
      if(!rk.length)return{text:'Kein Rookie, der gespielt hat, kann aufsteigen – das Upgrade verfällt.'};
      const p=rk[0];doUp(g,p);return{text:`${DB[p].name} steigt auf ${lvl(g,p)}★ – alle Werte +${CFG.UP_STEP}.`};}
    case 'trade':g.trade++;return{text:'+1 Trade-Karte'};
    case 'pick':g.picks++;return{text:'+1 Pick-Karte'};
    case 'hot':case 'lock':{if(!hl.length)return{text:'Kein Effekt.'};const p=pick(hl),ks=ev==='hot'?['sh','dr']:['pd','rp'];ks.forEach(k=>g.buffs.push({id:p,k:k,v:5,g:1}));return{text:`${DB[p].name}: ${ks.map(k=>'+5 '+STAT[k]).join(', ')} im nächsten Spiel.`};}
    case 'med':{const n=Object.keys(g.inj).length;g.inj={};return{text:n?`${n} Verletzung${n>1?'en':''} geheilt.`:'Alle fit – keine Wirkung.'};}
    default:return{text:'Kein Effekt.'};
  }
}
function postGame(gi,lineup){
  const g=G_(gi);
  Object.keys(g.inj).forEach(id=>{g.inj[id]--;if(g.inj[id]<=0)delete g.inj[id];});
  g.buffs=g.buffs.map(b=>({id:b.id,k:b.k,v:b.v,g:b.g-1})).filter(b=>b.g>0);
  const ev=drawEvent(),r=applyEvent(gi,ev,lineup);
  ST.ev.list.push({gi:gi,ev:ev,text:r.text});
}

function advance(){
  if(ST.phase!=='events'&&ST.phase!=='hub')return;
  const cur=ST.sched[ST.md];ST.md++;const next=ST.sched[ST.md];
  if(cur&&cur.stage==='H'&&next&&next.stage!=='H'&&!ST.midTrade){enterTrade('mid');return;}
  if(!next){
    if(cur.stage==='H'||cur.stage==='R')createPlayoffs();
    else if(cur.stage==='SF')createFinal();
    else{endSeason();return;}
  }
  go('hub');

function winnerOf(g){return g.hs>g.as?g.h:g.a;}

/* ═════════════ TRADETIME ═════════════ */
function newTr(p){return{p:p||1,give:[],get:[],gT:0,gP:0,rT:0,rP:0,msg:null};}
function enterTrade(stage){ST.tr={stage:stage};UI.tr=newTr(1);go('trade');}
function tradeEval(){
  const t=UI.tr,me=G_(0),P=G_(t.p);
  const outV=lineupCost(t.give)+(t.gT+t.gP)*CFG.CARD_VALUE,inV=lineupCost(t.get)+(t.rT+t.rP)*CFG.CARD_VALUE,diff=inV-outV;
  const myR=me.roster.filter(id=>t.give.indexOf(id)<0).concat(t.get),pR=P.roster.filter(id=>t.get.indexOf(id)<0).concat(t.give);
  const any=t.give.length+t.get.length+t.gT+t.gP+t.rT+t.rP>0;
  const checks=[
    {ok:any,txt:'Angebot enthält Spieler oder Karten'},
    {ok:Math.abs(diff)<=CFG.TRADE_TOL,txt:`Wertausgleich ±${CFG.TRADE_TOL} Mio. (Δ ${diff>0?'+':''}${diff})`},
    {ok:myR.length>=CFG.ROSTER_MIN&&myR.length<=CFG.ROSTER_MAX,txt:`Dein Kader: ${myR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},
    {ok:pR.length>=CFG.ROSTER_MIN&&pR.length<=CFG.ROSTER_MAX,txt:`Kader ${esc(P.name)}: ${pR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},
    {ok:!missingPos(myR).length,txt:'Deine Positionen bleiben besetzt'},
    {ok:!missingPos(pR).length,txt:`Positionen ${esc(P.name)} bleiben besetzt`}
  ];
  return{outV:outV,inV:inV,checks:checks,valid:checks.every(c=>c.ok)};
}
function cardSteps(side,g){
  const t=UI.tr,kT=side+'T',kP=side+'P';
  return `<div class="row between mt"><span class="s b">🎟 Trade-Karten <span class="mut">(${g.trade})</span></span><div class="step"><button onclick="trCard('${kT}',-1)">−</button><b>${t[kT]}</b><button onclick="trCard('${kT}',1)">+</button></div></div>
<div class="row between mt"><span class="s b">🎱 Pick-Karten <span class="mut">(${g.picks})</span></span><div class="step"><button onclick="trCard('${kP}',-1)">−</button><b>${t[kP]}</b><button onclick="trCard('${kP}',1)">+</button></div></div>`;
}
function vTrade(){
  if(!UI.tr)UI.tr=newTr(1);

  app(`${phaseHead(mid?'Phase 6 · Saisonmitte':'Offseason','Tradetime',`Tausche Spieler, Trade- und Pick-Karten. Der Gesamtwert muss innerhalb ±${CFG.TRADE_TOL} Mio. ausgeglichen sein (1 Karte = ${CFG.CARD_VALUE} Mio.).`)}
<div class="lbl mt">Handelspartner</div>
<div class="row wrap">${ST.gms.map((g,i)=>i===0?'':`<button class="chip ${t.p===i?'acc':''}" onclick="trPartner(${i})">${esc(g.name)} · ${TEAMS[g.team].sh}</button>`).join('')}</div>
<div class="panel"><div class="lbl">Du gibst <span>${e.outV} Mio</span></div><div class="col">${sortRoster(me).map(id=>pRow(0,id,{cls:t.give.indexOf(id)>-1?'on':'',click:`trTog('give','${id}')`})).join('')}</div>${cardSteps('g',me)}</div>
<div class="panel"><div class="lbl">Du bekommst von ${esc(P.name)} <span>${e.inV} Mio</span></div><div class="col">${sortRoster(P).map(id=>pRow(t.p,id,{cls:t.get.indexOf(id)>-1?'on':'',click:`trTog('get','${id}')`})).join('')}</div>${cardSteps('r',P)}</div>
<div class="panel"><div class="lbl">Prüfung</div><div class="col">${e.checks.map(c=>`<div class="row s"><b style="color:${c.ok?'var(--ok)':'var(--bad)'}">${c.ok?'✓':'✗'}</b><span>${c.txt}</span></div>`).join('')}</div>
${t.msg?`<div class="res" style="background:${t.msg.ok?'rgba(52,211,153,.12)':'rgba(251,113,133,.12)'};color:${t.msg.ok?'var(--ok)':'var(--bad)'}">${t.msg.txt}</div>`:''}</div>
<div class="cta"><div class="in"><button class="btn sec" onclick="endTrade()">Tradetime beenden</button><button class="btn" ${e.valid?'':'disabled'} onclick="sendOffer()">Angebot senden</button></div></div>`);
}
function trCard(k,d){const t=UI.tr,g=k[0]==='g'?G_(0):G_(t.p),max=k[1]==='T'?g.trade:g.picks;t[k]=Math.max(0,Math.min(max,t[k]+d));t.msg=null;render();}
function trTog(side,id){const a=UI.tr[side],i=a.indexOf(id);if(i>-1)a.splice(i,1);else a.push(id);UI.tr.msg=null;render();}
function trPartner(i){UI.tr=newTr(i);render();}
function moveCard(from,to,id){
  from.roster=from.roster.filter(x=>x!==id);to.roster.push(id);
  if(from.up[id]){to.up[id]=from.up[id];delete from.up[id];}
  if(from.inj[id]){to.inj[id]=from.inj[id];delete from.inj[id];}
  to.buffs=to.buffs.concat(from.buffs.filter(b=>b.id===id));from.buffs=from.buffs.filter(b=>b.id!==id);
}
function sendOffer(){
  const t=UI.tr,e=tradeEval();if(!e.valid)return;
  const me=G_(0),P=G_(t.p),val=(g,id)=>Math.pow(Math.max(0,rating(g,id)-55),1.6)/10;
  const gain=t.give.reduce((s,id)=>s+val(me,id),0)+(t.gT+t.gP)*2-t.get.reduce((s,id)=>s+val(P,id),0)-(t.rT+t.rP)*2;
  if(!(gain>=0||(gain>-1.5&&Math.random()<.35))){t.msg={ok:false,txt:`${esc(P.name)} lehnt ab – zu wenig Gegenwert.`};render();return;}
  t.give.forEach(id=>moveCard(me,P,id));t.get.forEach(id=>moveCard(P,me,id));
  me.trade+=t.rT-t.gT;P.trade+=t.gT-t.rT;me.picks+=t.rP-t.gP;P.picks+=t.gP-t.rP;
  const p=t.p;UI.tr=newTr(p);UI.tr.msg={ok:true,txt:`Trade mit ${esc(P.name)} abgeschlossen! ✅`};
  render();save();
}
function endTrade(){const st=ST.tr?ST.tr.stage:'mid';UI.tr=null;if(st==='mid'){ST.midTrade=true;go('hub');}else enterRelease();}

/* ═════════════ ONLINE · SCHRITT 1 (Lobby & Preseason) ═════════════
   Transport: gemeinsame Datenbank des veröffentlichten Artifacts (claude.use('db')).
   Der Host ist die einzige Instanz, die den Spielzustand schreibt (Dokument tp/<CODE>).
   Gäste schreiben ihre Aktionen in ihr eigenes Postfach (tp/<CODE>/in/<pid>).
   Der Host liest alle Postfächer live, wendet die Aktionen an und veröffentlicht den neuen Zustand. */
const NET={on:false,host:false,code:'',db:null,uid:null,canWrite:null,status:'wait',pid:'',unsub:[],out:[],seq:0,ver:-1,uids:{},
  pubBusy:false,pubAgain:false,inBusy:false,inAgain:false,botT:null,claimVer:null};
NET.pid=(function(){try{let p=sessionStorage.getItem('tp_pid');if(!p){p='p'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('tp_pid',p);}return p;}catch(e){return 'p'+Math.random().toString(36).slice(2,10);}})();
UI.net={name:'',team:0,code:''};UI.fxSeen=0;UI.fxQ=[];UI.fxBusy=false;UI.lastPhase=null;UI.pending=false;UI.pendT=null;UI.diceAnim=false;UI.busy=false;UI.hosting=null;UI.joined=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ── Firebase-Anbindung (GitHub Pages / eigene Webseite) ── */
const FB_VER='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Laden fehlgeschlagen: '+src));document.head.appendChild(s);});}
function fbConfigured(){return !!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL);}
function fbErr(e){const c=String(e&&(e.code||e.message)||'');return{code:/permission/i.test(c)?'not_granted':'unavailable',message:c};}
function fbAdapter(rdb){
  const clean=v=>JSON.parse(JSON.stringify(v)),mk=(id,s)=>({id:id,exists:s.exists(),data:()=>s.val(),metadata:{fromCache:false}});
  function doc(p){const id=p.split('/').pop(),r=rdb.ref(p+'/_d');return{id:id,path:p,
    get:()=>r.once('value').then(s=>mk(id,s),e=>{throw fbErr(e);}),
    set:d=>r.set(clean(d)).catch(e=>{throw fbErr(e);}),
    onSnapshot:(next,err)=>{const h=r.on('value',s=>next(mk(id,s)),e=>{if(err)err(fbErr(e));});return()=>r.off('value',h);}};}
  function collection(p){const r=rdb.ref(p);return{path:p,doc:id=>doc(p+'/'+id),
    onSnapshot:(next,err)=>{const h=r.on('value',s=>{const docs=[];s.forEach(c=>{const cs=c.child('_d');if(cs.exists())docs.push({id:c.key,exists:true,data:()=>cs.val()});});next({docs:docs,size:docs.length,empty:!docs.length,metadata:{}});},e=>{if(err)err(fbErr(e));});return()=>r.off('value',h);}};}
  return{doc:doc,collection:collection};
}
async function fbInit(){
  if(!window.firebase){const b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-database-compat.js');}
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();if(!auth.currentUser)await auth.signInAnonymously();
  NET.uid=auth.currentUser.uid;NET.db=fbAdapter(firebase.database());NET.canWrite=true;NET.mode='firebase';NET.status='ok';
}
async function netInit(){
  if(!(window.claude&&typeof window.claude.use==='function')){
    if(!fbConfigured()){NET.status='none';NET.why='nocfg';if(!ST||NET.on)render();return;}
    try{await fbInit();}catch(e){console.error(e);NET.status='none';NET.why='fb';NET.fbMsg=String(e&&(e.code||e.message)||'');}
    if(!ST||NET.on)render();return;
  }
  NET.mode='claude';
  try{
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    NET.db=res[0];const user=res[1];
    if(user){try{NET.uid=await user.id();}catch(e){}try{NET.canWrite=await user.can('data.write');}catch(e){}}
    NET.status=NET.db?'ok':'none';
  }catch(e){NET.status='none';}
  if(!ST||NET.on)render();
}
function roomRef(){return NET.db.doc('tp/'+NET.code);}
function inboxCol(){return NET.db.collection('tp/'+NET.code+'/in');}
function ME(){if(!ST||!ST.gms)return -1;if(!NET.on)return ST.gms.length?0:-1;return ST.gms.findIndex(g=>g.pid===NET.pid);}
function isBot(gi){return gi>=0&&!!ST.gms[gi]&&!!ST.gms[gi].bot;}
function humans(){const r=[];ST.gms.forEach((g,i)=>{if(!g.bot)r.push(i);});return r;}
function othersOf(gi){return humans().filter(i=>i!==gi);}
function isHostP(pid){return !!(ST&&ST.net&&pid===ST.net.host);}
function hostName(){if(!ST||!ST.net)return '';const g=(ST.gms||[]).find(x=>x.pid===ST.net.host);if(g)return g.name;const p=ST.net.lobby.players.find(x=>x.pid===ST.net.host);return p?p.name:'';}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[rint(0,A.length-1)];return s;}
function netStop(){NET.unsub.forEach(u=>{try{u();}catch(e){}});NET.unsub=[];clearTimeout(NET.botT);clearTimeout(NET.tmT);Object.values(NET.bk||{}).forEach(clearTimeout);NET.bk={};}
function dbFatal(e){const c=e&&e.code;return ['invalid_argument','not_granted','quota_exceeded','revoked','capability_disabled','capability_removed','transform_error'].indexOf(c)>-1;}
function dbErrText(e){const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted')return 'Keine Schreibrechte: Der Besitzer des Artifacts muss dich als Editor einladen.';
  if(c==='quota_exceeded')return 'Der gemeinsame Speicher ist voll.';
  if(c==='revoked')return 'Der Zugriff auf das Artifact wurde entzogen.';
  if(c==='resource_exhausted')return 'Zu viele Anfragen – kurz warten.';
  return 'Verbindung gestört – wird erneut versucht.';}

/* ── Host: Zustand veröffentlichen (immer nur ein Schreibvorgang gleichzeitig) ── */
async function publish(){

  NET.pubBusy=true;let tries=0;
  try{
    do{

      catch(e){toast(dbErrText(e));if(dbFatal(e)){leaveOnline();return;}if(++tries>5)return;await sleep(1200+Math.random()*800);NET.pubAgain=true;}
    }while(NET.pubAgain&&NET.on&&NET.host&&ST);
  }finally{NET.pubBusy=false;}
}

  try{
    do{
      NET.inAgain=false;

      catch(e){toast(dbErrText(e));if(dbFatal(e)){NET.out=[];UI.pending=false;render();return;}if(++tries>5)return;await sleep(1200+Math.random()*800);NET.inAgain=true;}
    }while(NET.inAgain&&NET.on);
  }finally{NET.inBusy=false;}
}
function hostListen(){
  NET.unsub.push(inboxCol().onSnapshot(snap=>{
    if(!NET.on||!NET.host||!ST)return;let changed=false;
    snap.docs.forEach(d=>{
      const pid=d.id;if(pid===NET.pid)return;const b=d.data()||{};NET.uids[pid]=String(b.uid||'');NET.names=NET.names||{};NET.names[pid]=String(b.name||'Gast');
      if(ST.phase==='lobby'&&lobbyJoin(pid,b))changed=true;
      const ack=ST.net.ack[pid]||0;
      (Array.isArray(b.acts)?b.acts:[]).filter(a=>a&&a.id>ack).sort((x,y)=>x.id-y.id).forEach(a=>{
        apply(ST.gms.findIndex(g=>g.pid===pid),a.t,a.d||{},pid);ST.net.ack[pid]=a.id;changed=true;});
    });
    if(changed)commitNet();
  },e=>toast(dbErrText(e))));
}
function guestListen(){
  NET.unsub.push(roomRef().onSnapshot(d=>{
    if(!NET.on||NET.host||!d.exists)return;
    const v=d.data();if(!v||typeof v.s!=='string'||v.ver===NET.ver)return;
    let s;try{s=JSON.parse(v.s);}catch(e){return;}
    if(s.cards)cardsMerge(s.cards,true);

  },e=>toast(dbErrText(e))));
}
function pruneOut(){const ack=(ST&&ST.net&&ST.net.ack[NET.pid])||0;NET.out=NET.out.filter(a=>a.id>ack);if(!NET.out.length&&UI.pending){UI.pending=false;clearTimeout(UI.pendT);}}
function autoClaim(){

function setTimer(key,dur){ST.tmSeq=(ST.tmSeq||0)+1;ST.tm={id:ST.tmSeq,key:key,dur:dur,until:Date.now()+dur*1000};}

  let need=null;

  else if(ST.phase==='captain'&&ST.cap.turn>=ST.gms.length)need=['captain',15];
  else if(ST.phase==='fa'&&ST.fa&&faCur()<0)need=['fa',30];
  else if(ST.phase==='draft'&&draftDone())need=['draft',30];
  else if(ST.phase==='events')need=['events',30];
  else if(ST.phase==='season')need=['season',30];
  else if(ST.phase==='trade')need=['trade',0];
  else if(ST.phase==='release')need=['release',0];
  else if(ST.phase==='draft'&&ST.dr&&ST.dr.setup)need=['bets',0];

  if(need){if(!ST.rdy||ST.rdy.ph!==need[0]){ST.rdy={ph:need[0],done:[]};if(need[1])setTimer('rdy',need[1]);else ST.tm=null;}}

/* ── Spiel-Handler (laufen nur beim Host) ── */
function newGM(name,team,pid,uid,bot){return{name:name,team:team,pid:pid,uid:uid||'',bot:bot,roster:[],trade:0,picks:0,rings:0,ringHolder:false,inj:{},buffs:[],up:{},roll:0,w:0,l:0,pf:0,pa:0};}
function lobbyJoin(pid,b){
  const L=ST.net.lobby;
  if(b.left){const k=L.players.findIndex(x=>x.pid===pid&&pid!==ST.net.host);if(k<0)return false;L.players.splice(k,1);return true;}
  if(L.players.some(x=>x.pid===pid)||L.players.length>=6)return false;
  if(b.name==null)return false;
  const used=L.players.map(x=>x.team);let t=b.team|0;if(t<0||t>5||used.indexOf(t)>-1)t=[0,1,2,3,4,5].find(x=>used.indexOf(x)<0);
  L.players.push({pid:pid,uid:String(b.uid||''),name:String(b.name||'Gast').slice(0,14),team:t});L.n=Math.max(L.n,L.players.length);return true;
}
const H={};
H.lobby_n=(gi,d,pid)=>{if(ST.phase!=='lobby'||!isHostP(pid))return;const L=ST.net.lobby;L.n=Math.max(2,L.players.length,Math.min(6,d.n|0));};
H.lobby_team=(gi,d,pid)=>{if(ST.phase!=='lobby')return;const L=ST.net.lobby,p=L.players.find(x=>x.pid===pid),t=d.team|0;if(!p||t<0||t>5||L.players.some(x=>x!==p&&x.team===t))return;p.team=t;};
H.lobby_leave=(gi,d,pid)=>{if(ST.phase!=='lobby'||isHostP(pid))return;const L=ST.net.lobby;L.players=L.players.filter(x=>x.pid!==pid);};
H.start=(gi,d,pid)=>{
  if(ST.phase!=='lobby'||!isHostP(pid))return;const L=ST.net.lobby,n=Math.max(L.n,L.players.length);
  const used=L.players.map(p=>p.team),free=shuffle([0,1,2,3,4,5].filter(t=>used.indexOf(t)<0));
  ST.gms=L.players.map(p=>newGM(p.name,p.team,p.pid,p.uid,false));
  let b=0;while(ST.gms.length<n){ST.gms.push(newGM('🤖 '+BOT_NAMES[b],free.shift(),null,'',true));b++;}
  ST.goal=goalOf(L.goalMode||'two',L.goalN||3);ST.cards=cardsSnapshot();ST.phase='dice';
};
H.claim=(gi,d,pid)=>{if(ST.phase==='lobby'||ST.closed||ST.gms.some(g=>g.pid===pid))return;const k=d.gi|0,g=ST.gms[k];if(!g)return;
  if(g.bot){g.bot=false;g.name=String((NET.names&&NET.names[pid])||'Gast').slice(0,14);g.pid=pid;g.uid=NET.uids[pid]||'';fx('msg',g.name+' übernimmt '+TEAMS[g.team].name,othersOf(k));return;}
  g.pid=pid;if(NET.uids[pid])g.uid=NET.uids[pid];fx('msg',g.name+' ist wieder dabei',othersOf(k));};
H.quit=(gi,d,pid)=>{
  if(ST.phase==='lobby'){if(!isHostP(pid)){const L=ST.net.lobby;L.players=L.players.filter(x=>x.pid!==pid);}return;}
  if(gi<0||isBot(gi))return;const g=G_(gi);fx('msg',g.name+' hat das Spiel verlassen – ein KI-Manager übernimmt',othersOf(gi));g.bot=true;g.pid=null;g.uid='';g.name='🤖 '+g.name;};
H.roll=(gi,d,pid)=>{
  if(ST.phase!=='dice'||ST.order.length||!isHostP(pid))return;
  let r;do{r=ST.gms.map(()=>rint(1,6));}while(new Set(r).size!==r.length);
  ST.gms.forEach((g,i)=>{g.roll=r[i];});ST.order=ST.gms.map((g,i)=>i).sort((a,b)=>ST.gms[b].roll-ST.gms[a].roll);fx('dice',{});
};
H.ready=(gi)=>{const r=ST.rdy;if(!r||gi<0||isBot(gi)||r.done.indexOf(gi)>-1)return;r.done.push(gi);if(humans().every(i=>r.done.indexOf(i)>-1))nextPhase();};
H.roll_me=(gi)=>{
  if(ST.phase!=='dice'||ST.order.length||gi<0)return;const g=G_(gi);if(!g||g.roll)return;
  g.roll=rint(1,6);fx('die',{gi:gi,r:g.roll});
  if(ST.gms.every(x=>x.roll)){
    const tb=ST.gms.map(()=>Math.random());
    ST.gms.forEach((x,i)=>{x.tie=ST.gms.some((y,j)=>j!==i&&y.roll===x.roll);});
    ST.order=ST.gms.map((x,i)=>i).sort((a,b)=>ST.gms[b].roll-ST.gms[a].roll||tb[b]-tb[a]);
  }
};
H.next=(gi,d,pid)=>{if(isHostP(pid))nextPhase();};
function nextPhase(){
  const ph=ST.phase;ST.rdy=null;ST.tm=null;

  else if(ph==='season'){ST.tr={stage:'post'};ST.offers=[];ST.phase='trade';}
  else if(ph==='trade'){ST.offers=[];if(ST.tr&&ST.tr.stage==='mid'){ST.midTrade=true;initMd();ST.phase='hub';}else ST.phase='release';}
  else if(ph==='release'){botReleases();enterFA('season');}

H.cap=(gi,d)=>{

  const g2=pick(rem);r.order.push(g2);r.cur=g2;fx('lottery',{gi:g2,n:r.order.length,rem:rem});
};
H.dr_take=(gi,d)=>{const r=ST.dr;if(ST.phase!=='draft'||!r||r.cur!==gi||gi<0)return;const i=r.pool.indexOf(d.id);if(i<0||draftCheck(gi))return;r.pool.splice(i,1);G_(gi).roster.push(d.id);r.picks.push({gi:gi,id:d.id});r.cur=-1;fx('msg',G_(gi).name+' draftet '+DB[d.id].name,othersOf(gi));};
H.dr_skip=(gi)=>{const r=ST.dr;if(ST.phase!=='draft'||!r||r.cur!==gi||gi<0)return;r.picks.push({gi:gi,id:null});r.cur=-1;};
function draftDone(){const r=ST.dr;return !!r&&!r.setup&&r.cur<0&&!r.balls.filter(x=>r.order.indexOf(x)<0).length;}

/* ── KI-Manager (laufen beim Host) ── */
function botTick(){
  clearTimeout(NET.botT);if(!ST||!NET.on||!NET.host)return;
  const ph=ST.phase,run=(gi,t,d,ms)=>{NET.botT=setTimeout(()=>{if(!ST||!NET.on||!NET.host)return;apply(gi,t,d,NET.pid);commitNet();},ms);};
  if(ph==='dice'){if(!ST.order.length){const gi=ST.gms.findIndex(g=>g.bot&&!g.roll);if(gi>=0)run(gi,'roll_me',{},900+rint(0,700));}}
  else if(ph==='captain'){const c=ST.cap;if(c.turn<ST.gms.length){const gi=ST.order[c.turn];if(isBot(gi))run(gi,'cap',{i:rint(0,c.pool.length-1)},1100);}}
  else if(ph==='fa'){const gi=faCur();if(gi>=0&&isBot(gi)){const id=botFAChoice(gi);run(gi,id?'fa_sign':'fa_skip',id?{id:id}:{},900);}}
  else if(ph==='hub')botHub();
  else if(ph==='draft'){const r=ST.dr;if(r&&!r.setup){
    if(r.cur>=0&&isBot(r.cur)){const id=botDraftChoice(r.cur);run(r.cur,id?'dr_take':'dr_skip',id?{id:id}:{},2800);}
    else if(r.cur<0){const rem=r.balls.filter(x=>r.order.indexOf(x)<0);if(rem.length&&rem.every(isBot))run(-1,'draw',{},1800);}}}
}
function botFAChoice(gi){
  const f=ST.fa,g=G_(gi),opts=f.pool.filter(id=>!faCheck(gi,id)).map(id=>({id:id}));if(!opts.length)return null;
  if(f.mode==='start'){const miss=missingPos(g.roster);opts.forEach(o=>{const c=DB[o.id];o.s=rating(null,o.id)+(miss.indexOf(c.pos)>-1?6:0)-c.sal*0.08+Math.random()*3;});}
  else opts.forEach(o=>{const c=DB[o.id],same=g.roster.filter(x=>DB[x].pos===c.pos).map(x=>rating(g,x)),worst=same.length?Math.min.apply(null,same):0;o.s=rating(null,o.id)-worst+(g.roster.length<9?6:0)+Math.random()*2;});
  opts.sort((a,b)=>b.s-a.s);if(f.mode==='season'&&opts[0].s<2)return null;return opts[0].id;
}
function botDraftChoice(gi){const r=ST.dr,g=G_(gi),miss=missingPos(g.roster);if(draftCheck(gi)||!r.pool.length)return null;return r.pool.map(id=>({id:id,s:rating(null,id)+(miss.indexOf(DB[id].pos)>-1?5:0)+Math.random()*2})).sort((a,b)=>b.s-a.s)[0].id;}

function curMd(){return ST.sched[ST.md];}
function initMd(){const md=curMd();if(md)md.games.forEach(G=>{G.st=(isBot(G.h)&&isBot(G.a))?'auto':'open';G.rd={};});}
function sideOf(G,gi){return gi===G.h?'h':(gi===G.a?'a':null);}
function myGame(){if(!ST||ST.phase!=='hub')return -1;const md=curMd(),me=ME();return md?md.games.findIndex(g=>g.h===me||g.a===me):-1;}
function newMatch(G){const mk=ids=>ids.map(id=>({id:id,used:0,won:0,rev:0}));return{turn:'h',first:1,c:{h:mk(G.lh),a:mk(G.la)},sH:0,sA:0,log:[]};}
function canAtkSlot(m,s,i){const e=m.c[s][i];if(!e||m.turn!==s||e.used)return false;if(m.first&&DB[e.id].pos!=='G'&&m.c[s].some(x=>!x.used&&DB[x.id].pos==='G'))return false;return true;}
function netLineupCheck(G){
  ['h','a'].forEach(s=>{const gi=s==='h'?G.h:G.a,o=s==='h'?'a':'h';if(isBot(gi)&&!G.rd[s]&&G.rd[o]){G['l'+s]=arrange(autoLineup(G_(gi))).filter(Boolean);G.rd[s]=1;}});
  if(G.rd.h&&G.rd.a&&G.st==='open'){G.m=newMatch(G);G.st='live';fx('msg','🏀 Anpfiff: '+G_(G.h).name+' gegen '+G_(G.a).name,[G.h,G.a].filter(x=>!isBot(x)));}
}
H.lineup=(gi,d)=>{
  if(ST.phase!=='hub')return;const G=curMd().games[d.g|0];if(!G||G.st!=='open')return;const s=sideOf(G,gi);
  if(!s||!lineupValid(G_(gi),d.ids||[]))return;G['l'+s]=arrange(d.ids).filter(Boolean);G.rd[s]=1;netLineupCheck(G);
};
H.sim=(gi,d)=>{
  if(ST.phase!=='hub')return;const G=curMd().games[d.g|0];if(!G||G.st!=='open')return;const s=sideOf(G,gi);if(!s)return;
  const o=s==='h'?'a':'h',og=o==='h'?G.h:G.a;if(!isBot(og))return;
  G['l'+s]=arrange(lineupValid(G_(gi),d.ids||[])?d.ids:autoLineup(G_(gi))).filter(Boolean);G['l'+o]=arrange(autoLineup(G_(og))).filter(Boolean);
  const fl=[];let a=0,b=0;while(a<3&&b<3){const k=Math.random()<.5;fl.push(k);if(k)a++;else b++;}
  if(s==='h'){G.hs=a;G.as=b;}else{G.hs=b;G.as=a;}G.st='done';G.sim=1;
  fx('coin',{gi:gi,opp:og,lu:G['l'+s],fl:fl,me:a,op:b},[gi]);maybeComplete();
};
H.attack=(gi,d)=>{
  if(ST.phase!=='hub')return;const G=curMd().games[d.g|0];if(!G||G.st!=='live')return;const s=sideOf(G,gi);if(!s)return;
  const m=G.m;if(!canAtkSlot(m,s,d.att))return;const o=s==='h'?'a':'h',D=m.c[o][d.def];if(!D||D.used||(d.mode!=='sh'&&d.mode!=='dr'))return;
  const A=m.c[s][d.att],og=o==='h'?G.h:G.a,av=sv(G_(gi),A.id,d.mode),dv=sv(G_(og),D.id,d.mode==='sh'?'pd':'rp'),win=av>dv,ws=win?s:o;
  A.used=D.used=1;A.rev=D.rev=1;A.won=win?1:0;D.won=win?0:1;if(ws==='h')m.sH++;else m.sA++;m.first=0;
  m.log.push({a:A.id,d:D.id,k:d.mode,av:av,dv:dv,w:ws,s:s});
  const to=[G.h,G.a].filter(x=>!isBot(x));
  fx('duel',{h:G.h,a:G.a,as:s,ai:d.att,di:d.def,aid:A.id,did:D.id,k:d.mode,av:av,dv:dv,w:ws,sH:m.sH,sA:m.sA,n:m.log.length},to);
  if(m.sH>=3||m.sA>=3){G.hs=m.sH;G.as=m.sA;G.st='done';m.c.h.forEach(x=>{x.rev=1;});m.c.a.forEach(x=>{x.rev=1;});fx('mend',{h:G.h,a:G.a,hs:G.hs,as:G.as,log:m.log},to);maybeComplete();}
  else m.turn=o;
};
H.force=(gi,d,pid)=>{if(!isHostP(pid)||ST.phase!=='hub')return;forceGame(d.g|0);};
function forceGame(k){
  const G=curMd().games[k];if(!G||G.st==='done'||G.st==='auto')return;
  if(!G.lh)G.lh=arrange(autoLineup(G_(G.h))).filter(Boolean);if(!G.la)G.la=arrange(autoLineup(G_(G.a))).filter(Boolean);
  if(G.st==='live'){let h=G.m.sH,a=G.m.sA;while(h<3&&a<3){if(Math.random()<.5)h++;else a++;}G.hs=h;G.as=a;}else simGame(G);
  G.sim=1;G.st='done';fx('msg','Spiel '+G_(G.h).name+' – '+G_(G.a).name+' wurde vom Host simuliert ('+G.hs+':'+G.as+')');maybeComplete();
}
function maybeComplete(){const md=curMd();if(md&&!md.done&&md.games.every(g=>g.st==='done'||g.st==='auto'))completeMdNet();}
function completeMdNet(){
  const md=curMd();if(!md||md.done)return;
  md.games.forEach(G=>{
    if(!G.lh)G.lh=arrange(autoLineup(G_(G.h))).filter(Boolean);if(!G.la)G.la=arrange(autoLineup(G_(G.a))).filter(Boolean);
    if(G.hs==null)simGame(G);G.st='done';if(G.m){G.log=G.m.log;G.m=null;}
    if(md.stage==='H'||md.stage==='R'){const A=G_(G.h),B=G_(G.a);A.pf+=G.hs;A.pa+=G.as;B.pf+=G.as;B.pa+=G.hs;if(G.hs>G.as){A.w++;B.l++;}else{B.w++;A.l++;}}
  });
  ST.ev={list:[]};md.games.forEach(G=>{postGame(G.h,G.lh);postGame(G.a,G.la);});
  md.done=1;ST.phase='events';
  ST.ev.list.forEach(e=>{if(!isBot(e.gi))fx('event',{ev:e.ev,text:e.text},[e.gi]);});
}
function netAdvance(){
  const cur=curMd();ST.md++;const next=curMd();ST.ev=null;
  if(cur&&cur.stage==='H'&&next&&next.stage!=='H'&&!ST.midTrade){ST.tr={stage:'mid'};ST.offers=[];ST.phase='trade';return;}
  if(!next){
    if(cur.stage==='H'||cur.stage==='R')createPlayoffs();
    else if(cur.stage==='SF')createFinal();
    else{endSeason();if(ST.res&&!isBot(ST.res.champ))fx('confetti',{},[ST.res.champ]);return;}
  }
  initMd();ST.phase='hub';
}
function botMove(G){
  const m=G.m,s=m.turn,o=s==='h'?'a':'h',g=G_(s==='h'?G.h:G.a);
  const av=m.c[s].map((x,i)=>({x:x,i:i})).filter(q=>canAtkSlot(m,s,q.i));
  av.forEach(q=>{q.k=sv(g,q.x.id,'sh')>=sv(g,q.x.id,'dr')?'sh':'dr';q.s=sv(g,q.x.id,q.k)+Math.random()*6;});av.sort((a,b)=>b.s-a.s);

function normOffer(d){const ids=a=>(Array.isArray(a)?a:[]).filter(x=>typeof x==='string'&&DB[x]).slice(0,11);return{give:ids(d.give),get:ids(d.get),gT:Math.max(0,d.gT|0),gP:Math.max(0,d.gP|0),rT:Math.max(0,d.rT|0),rP:Math.max(0,d.rP|0)};}
function tradeEvalData(f,t,o){
  const A=G_(f),B=G_(t),own=o.give.every(id=>A.roster.indexOf(id)>-1)&&o.get.every(id=>B.roster.indexOf(id)>-1)&&o.gT<=A.trade&&o.gP<=A.picks&&o.rT<=B.trade&&o.rP<=B.picks;
  const outV=lineupCost(o.give)+(o.gT+o.gP)*CFG.CARD_VALUE,inV=lineupCost(o.get)+(o.rT+o.rP)*CFG.CARD_VALUE,diff=inV-outV;
  const aR=A.roster.filter(id=>o.give.indexOf(id)<0).concat(o.get),bR=B.roster.filter(id=>o.get.indexOf(id)<0).concat(o.give),any=o.give.length+o.get.length+o.gT+o.gP+o.rT+o.rP>0;
  const checks=[{ok:any&&own,txt:'Angebot enthält Spieler oder Karten'},{ok:Math.abs(diff)<=CFG.TRADE_TOL,txt:`Wertausgleich ±${CFG.TRADE_TOL} Mio. (Δ ${diff>0?'+':''}${diff})`},
    {ok:aR.length>=CFG.ROSTER_MIN&&aR.length<=CFG.ROSTER_MAX,txt:`Kader ${gname(f)}: ${aR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},{ok:bR.length>=CFG.ROSTER_MIN&&bR.length<=CFG.ROSTER_MAX,txt:`Kader ${gname(t)}: ${bR.length} (${CFG.ROSTER_MIN}–${CFG.ROSTER_MAX})`},
    {ok:!missingPos(aR).length,txt:`Positionen ${gname(f)} bleiben besetzt`},{ok:!missingPos(bR).length,txt:`Positionen ${gname(t)} bleiben besetzt`}];
  return{outV:outV,inV:inV,checks:checks,valid:checks.every(c=>c.ok)};
}
function botAccepts(f,t,o){const A=G_(f),B=G_(t),val=(g,id)=>Math.pow(Math.max(0,rating(g,id)-55),1.6)/10;const gain=o.give.reduce((s,id)=>s+val(A,id),0)+(o.gT+o.gP)*2-o.get.reduce((s,id)=>s+val(B,id),0)-(o.rT+o.rP)*2;return gain>=0||(gain>-1.5&&Math.random()<.35);}
function execTrade(f,t,o){const A=G_(f),B=G_(t);o.give.forEach(id=>moveCard(A,B,id));o.get.forEach(id=>moveCard(B,A,id));A.trade+=o.rT-o.gT;B.trade+=o.gT-o.rT;A.picks+=o.rP-o.gP;B.picks+=o.gP-o.rP;ST.offers=(ST.offers||[]).filter(x=>tradeEvalData(x.from,x.to,x).valid);}
H.trade_offer=(gi,d)=>{
  if(ST.phase!=='trade'||gi<0)return;const to=d.to|0;if(to===gi||!ST.gms[to])return;const o=normOffer(d);ST.offers=ST.offers||[];
  if(!tradeEvalData(gi,to,o).valid){fx('msg','Angebot ungültig',[gi]);return;}
  if(isBot(to)){if(botAccepts(gi,to,o)){execTrade(gi,to,o);fx('msg','✅ '+G_(to).name+' nimmt dein Angebot an',[gi]);fx('msg','🔁 Trade: '+G_(gi).name+' ↔ '+G_(to).name,othersOf(gi));}else fx('msg','❌ '+G_(to).name+' lehnt ab – zu wenig Gegenwert',[gi]);return;}
  ST.offerSeq=(ST.offerSeq||0)+1;ST.offers.push(Object.assign({id:ST.offerSeq,from:gi,to:to},o));
  fx('msg','📨 Neues Trade-Angebot von '+G_(gi).name,[to]);fx('msg','📨 Angebot an '+G_(to).name+' gesendet',[gi]);
};
H.trade_reply=(gi,d)=>{
  if(ST.phase!=='trade')return;ST.offers=ST.offers||[];const i=ST.offers.findIndex(x=>x.id===d.id&&x.to===gi);if(i<0)return;const o=ST.offers.splice(i,1)[0];
  if(d.ok){if(tradeEvalData(o.from,o.to,o).valid){execTrade(o.from,o.to,o);fx('msg','✅ Trade zwischen '+G_(o.from).name+' und '+G_(o.to).name+' abgeschlossen');}else fx('msg','Trade ist nicht mehr gültig',[o.from,o.to]);}
  else fx('msg','❌ '+G_(o.to).name+' hat dein Angebot abgelehnt',[o.from]);
};
H.trade_cancel=(gi,d)=>{ST.offers=ST.offers||[];const i=ST.offers.findIndex(x=>x.id===d.id&&x.from===gi);if(i>-1){const o=ST.offers.splice(i,1)[0];fx('msg',G_(gi).name+' hat sein Angebot zurückgezogen',[o.to]);}};
H.release=(gi,d)=>{
  const r=ST.rdy;if(ST.phase!=='release'||!r||gi<0||isBot(gi)||r.done.indexOf(gi)>-1)return;const g=G_(gi);
  if(d.id&&g.roster.indexOf(d.id)>-1&&!releaseCheck(g,d.id)){fx('msg',g.name+' entlässt '+DB[d.id].name,othersOf(gi));doRelease(gi,d.id);}
  r.done.push(gi);if(humans().every(i=>r.done.indexOf(i)>-1))nextPhase();
};
H.bet=(gi,d)=>{
  const r=ST.dr,rd=ST.rdy;if(ST.phase!=='draft'||!r||!r.setup||!rd||gi<0||isBot(gi)||rd.done.indexOf(gi)>-1)return;
  const g=G_(gi);r.bets=r.bets||{};r.bets[gi]=g.roster.length<CFG.ROSTER_MAX?Math.max(0,Math.min(g.picks,d.n|0)):0;
  rd.done.push(gi);if(humans().every(i=>rd.done.indexOf(i)>-1))nextPhase();
};

function netBuildBalls(){
  const r=ST.dr;r.bets=r.bets||{};r.balls=[];
  ST.gms.forEach((g,i)=>{let b=0;if(g.roster.length<CFG.ROSTER_MAX&&g.picks>0)b=g.bot?Math.min(g.picks,rint(1,2)):(r.bets[i]||0);b=Math.max(0,Math.min(b,g.picks));g.picks-=b;for(let k=0;k<b;k++)r.balls.push(i);});
  r.balls=shuffle(r.balls);r.setup=false;

function trackInfo(path){

function audAddFiles(paths){
  (paths||[]).forEach(p=>{
    if(typeof p!=='string')return;

    if(tp){const t=TEAMS.find(x=>x.sh===tp[1].toUpperCase());if(t){t.logo=p.split('/').map(encodeURIComponent).join('/');AUD.teamPh=true;}return;}
    const fn=p.split('/').pop();
    if(/^karten\.csv$/i.test(fn)){AUD.cardsCsv=p.split('/').map(encodeURIComponent).join('/');return;}
    if(/\.(png|jpe?g|webp)$/i.test(fn)&&(/^(karten|cards?)\//i.test(p)||/^karte_/i.test(fn))){
      const nrm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,''),key=nrm(fn.replace(/\.[a-z]+$/i,'').replace(/^karte_/i,'')),src=p.split('/').map(encodeURIComponent).join('/');
      const tier={legend:'Legend',allstar:'All-Star',basic:'Basic',rookie:'Rookie'}[key];
      if(tier){TIER_IMG[tier]=src;AUD.cardPh=true;return;}
      AUD.cardFiles=AUD.cardFiles||[];if(!AUD.cardFiles.some(f=>f[1]===src))AUD.cardFiles.push([key,src]);cardImgRematch();AUD.cardPh=true;return;
    }

const EMO={'🎟':'ticket','💍':'ring','🏀':'ball','🎱':'lball','⏳':'clock','👥':'users','💰':'coins','🏠':'home','🩹':'aid','👑':'crown','🌐':'globe','📋':'list','📖':'book','🎵':'music','🎲':'dice','⚠':'alert','🎯':'target','🛡':'shield','🏃':'zap','✅':'checkc','🤖':'bot','⏩':'forward','📨':'mail','🔒':'lock','💾':'save','✋':'pausec','🚫':'ban','👀':'eye','✈':'plane','⚔':'swords','🏆':'trophy','❌':'xc','🗑':'trash','🧱':'wall','🚑':'siren','⭐':'star','🔥':'flame','⚕':'pulse','☕':'coffee','⚡':'zap','📊':'chart','☰':'menu','📚':'cards','⚙':'sliders','🔁':'swap','🛑':'stop','🚪':'door','🔊':'volume','⏭':'skip','✏':'pencil','▶':'play','😤':'xc','📱':'phone'};
const EMO_RE=new RegExp('('+Object.keys(EMO).sort((a,b)=>b.length-a.length).join('|')+')\\uFE0F?','gu');
function icSVG(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}
const ICO_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,TITLE:1,CANVAS:1,SVG:1};
function iconize(root){
  if(!root)return;
  if(root.nodeType===3){iconText(root);return;}
  if(root.nodeType!==1||ICO_SKIP[root.nodeName.toUpperCase()])return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[];let n;
  while((n=w.nextNode())){if(EMO_RE.test(n.nodeValue))list.push(n);EMO_RE.lastIndex=0;}
  list.forEach(iconText);
}
function iconText(t){
  const p=t.parentNode;if(!p||ICO_SKIP[p.nodeName.toUpperCase()]||(p.closest&&p.closest('svg,textarea')))return;
  const s=t.nodeValue;EMO_RE.lastIndex=0;if(!EMO_RE.test(s))return;EMO_RE.lastIndex=0;
  const f=document.createDocumentFragment();let last=0,m;
  while((m=EMO_RE.exec(s))){if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));const sp=document.createElement('span');sp.className='icw';sp.innerHTML=icSVG(EMO[m[1]]);f.appendChild(sp);last=m.index+m[0].length;}
  if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
  p.replaceChild(f,t);
}
if(window.MutationObserver){new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==='characterData')iconText(m.target);else m.addedNodes.forEach(iconize);});}).observe(document.body,{childList:true,subtree:true,characterData:true});}

  if(tab==='me')list=UP_HIST.length?UP_HIST.map((e,k)=>lbRow(e,k,false)).join(''):'<div class="s mut">Noch keine Runs gespielt.</div>';
  else if(!on)list='<div class="s mut">Für die Rangliste brauchst du eine Online-Verbindung.</div>';
  else if(!lb||UI.upLBBusy&&!lb)list='<div class="row"><div class="dots"><i></i><i></i><i></i></div><div class="s mut">Rangliste wird geladen …</div></div>';
  else{const L=tab==='grp'?lb.grp:lb.g;list=L===null?'<div class="s mut">Die Rangliste konnte nicht geladen werden.</div>':(L.length?L.map((e,k)=>lbRow(e,k,e.u===me)).join(''):'<div class="s mut">Noch keine Einträge – sei der Erste!</div>');}
  app(`<button class="btn sec sm" onclick="screen('up')">← Ultimate Pick</button><div class="mt">${phaseHead('Ultimate Pick','Rangliste','Dein bester Run zählt. Bei Gleichstand entscheiden mehr Siege.')}</div>
<div class="tabs"><button class="tab ${tab==='g'?'on':''}" onclick="UI.upTab='g';render()">Global</button>${grp?`<button class="tab ${tab==='grp'?'on':''}" onclick="UI.upTab='grp';render()">Gruppe ${esc(grp)}</button>`:''}<button class="tab ${tab==='me'?'on':''}" onclick="UI.upTab='me';render()">Meine Runs</button></div>
<div class="col mt">${list}</div>
${grp?'':'<div class="s mut mt" style="text-align:center">Mit einem Gruppencode bekommt dein Freundeskreis eine eigene Rangliste. Du trägst ihn beim Start eines Runs ein.</div>'}`);
}
function upRulesSheet(){openSheet(`<div class="h2">Ultimate Pick – so funktioniert's</div><div class="col mt s" style="line-height:1.6;color:var(--sub)">
<div><b style="color:var(--fg)">Start:</b> Ein Kapitän (Legend) wird zufällig gezogen. Danach draftest du 8 Spieler, jeweils 1 aus 3.</div>
<div><b style="color:var(--fg)">Spiele:</b> Best of 5 gegen KI-Teams, die mit jeder Stufe stärker werden. Jede 5. Stufe ist ein Boss-Spiel. Kein Simulieren, keine Ereigniskarten, keine Verletzungen.</div>
<div><b style="color:var(--fg)">Belohnung:</b> Nach jedem Sieg ein Rookie (1 aus 3) oder +1 Stern für einen Rookie, der gespielt hat.</div>
<div><b style="color:var(--fg)">Kaderumbau:</b> Nach jeder Runde bis zu 3 Spieler gegen Trade-Karten abgeben (Basic 1, All-Star 2, Legend 3, Rookie 1 + 1 je Stern) und im Shop neue kaufen. Kader 8–11 Spieler.</div>
<div><b style="color:var(--fg)">Punkte:</b> Sieg 100 · +20 pro Stufe · 3:0 +50 · 3:1 +25 · Comeback nach 0:2 +40 · Underdog +30 · Rookie entscheidet +15 · Boss +50. Ab dem 5. Sieg ×1,2, ab dem 10. ×1,5.</div>
<div><b style="color:var(--fg)">Ende:</b> Die erste Niederlage beendet den Run (10 Trostpunkte pro gewonnenem Duell).</div></div><button class="btn sec mt" data-act="x">Schließen</button>`,{x:closeSheet});}
function upTeam(i){UI.up.team=i;render();}
function vUp(){
  const r=UI.upRun,best=UP_HIST.length?UP_HIST[0]:null,longest=UP_HIST.reduce((a,e)=>Math.max(a,e.wins),0),u=UI.up;
  app(`<button class="btn sec sm" onclick="screen('menu')">← Menü</button><div class="mt">${phaseHead('Rogue-Modus','Ultimate Pick','Kapitän ziehen, 8 Spieler draften, dann Spiel um Spiel gegen immer stärkere Teams. Die erste Niederlage beendet den Run.')}</div>
${r?`<div class="panel mine"><div class="lbl">Laufender Run</div><div class="row">${badgeT(r.gms[0].team)}<div class="grow"><div class="b">Stufe ${r.up.stage} · ${fmtPts(r.up.score)} Punkte</div><div class="s mut">${r.up.wins} Siege${r.gms[0].roster[0]?' · Kapitän '+esc(DB[r.gms[0].roster[0]].name):''}</div></div></div><div class="col mt"><button class="btn" onclick="upResume()">Run fortsetzen</button><button class="btn sec" onclick="upAbandonAsk()">Run aufgeben</button></div></div>`:''}
<div class="row wrap mt"><span class="chip">🏆 Rekord ${best?fmtPts(best.score):'–'}</span><span class="chip">✅ Längste Serie ${longest}</span><span class="chip">${UP_HIST.length} Runs</span></div>
${r?'':`<div class="panel"><div class="lbl">Dein Name</div><input class="inp" maxlength="14" value="${esc(u.name)}" oninput="UI.up.name=this.value" placeholder="Name für die Rangliste"></div>
<div class="panel"><div class="lbl">Dein Team</div>${teamPicker(u.team|0,'upTeam')}</div>
<div class="panel"><div class="lbl">Gruppencode <span>optional</span></div><input class="inp" maxlength="12" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em" value="${esc(u.group||'')}" oninput="UI.up.group=this.value" placeholder="z. B. JUNGS24"><div class="s mut" style="margin-top:8px">Alle mit demselben Code landen zusätzlich in einer eigenen Gruppen-Rangliste.</div></div>`}
<div class="row mt" style="gap:8px"><button class="btn sec" onclick="screen('upboard')">🏆 Rangliste</button><button class="btn sec" onclick="upRulesSheet()">📖 So geht's</button></div>
${r?'':'<div class="cta"><div class="in"><button class="btn" onclick="upStart()">Run starten</button></div></div>'}`);
}
function careerSheet(){
  const b=(icon,t1,t2,fn)=>`<button class="mbtn" data-act="${fn}"><div class="mi">${icon}</div><div class="grow"><div class="mt1">${t1}</div><div class="mt2">${t2}</div></div><div class="mut b" style="font-size:20px">›</div></button>`;
  openSheet(`<div class="h2">GM Career</div><div class="sub">Mehrere Saisons bis zum TOP PICK Champion.</div>${b('🤖','Offline','Gegen KI-Manager · 2–6 Teams','off')}${b('👥','Online','Mit Freunden · jeder auf seinem Gerät','on')}<button class="btn sec mt" data-act="x">Schließen</button>`,
    {off:()=>{closeSheet();screen('start');},on:()=>{closeSheet();screen('online');},x:closeSheet});
}

function hlPh(t){return t&&t.logo?`<img class="hlph" src="${t.logo}" alt="">`:'';}
function champPh(gi){const t=TEAMS[G_(gi).team];return t.logo?`<div class="champ-ph"><img src="${t.logo}" alt="${esc(t.name)}"></div>`:badge(gi,1);}
function setupTeamPick(i){UI.setup.team=i;render();}
function teamPicker(sel,fn,taken){
  const photos=TEAMS.some(t=>t.logo);
  if(!photos)return `<div class="teams">${TEAMS.map((t,i)=>{const tk=!!taken&&taken.indexOf(i)>-1&&sel!==i;return `<button class="teamb" ${tk?'disabled':''} style="${sel===i?`border-color:${t.col};background:${t.col}1f;`:''}${tk?'opacity:.35;':''}" onclick="${fn}(${i})">${badgeT(i)}<span>${t.name}</span></button>`;}).join('')}</div>`;
  return `<div class="teams ph">${TEAMS.map((t,i)=>{const tk=!!taken&&taken.indexOf(i)>-1&&sel!==i;return `<button class="teamt${sel===i?' on':''}" ${tk?'disabled':''} aria-label="${t.name}" style="--tcol:${t.col}" onclick="${fn}(${i})"><span class="tt-img">${t.logo?`<img src="${t.logo}" alt="">`:`<span class="tt-sh" style="background:${t.col};color:${t.tx}">${t.sh}</span>`}</span>${t.logo?'':`<span class="tt-name">${t.name}</span>`}${sel===i?'<span class="tt-ok">✓</span>':''}</button>`;}).join('')}</div>`;
}


/* ── Karte groß anzeigen ── */
function cardZoom(id,gi,withDetails){
  const g=(gi===null||gi===undefined)?null:G_(gi);let z=document.getElementById('czoom');
  if(!z){z=document.createElement('div');z.id='czoom';z.className='czoom';document.body.appendChild(z);}
  z.innerHTML=`<div class="cz-card">${cardHTML(id,g)}</div><div class="cz-bar">${withDetails?`<button class="btn sec sm" id="cz-det">Werte & Details</button>`:''}<span class="s mut">Tippen zum Schließen</span></div>`;
  z.classList.remove('out');z.classList.add('on');
  z.onclick=e=>{if(e.target.closest('#cz-det')){cardZoomClose();cardSheet(id,gi);return;}cardZoomClose();};
}
function cardZoomClose(){const z=document.getElementById('czoom');if(!z)return;z.classList.add('out');setTimeout(()=>{z.classList.remove('on','out');z.innerHTML='';},180);}

/* ═════════════ VIEWS & START ═════════════ */
const VIEWS={up_draft:vUpDraft,up_hub:vUpHub,up_reward:vUpReward,up_shop:vUpShop,up_over:vUpOver,start:vStart,dice:vDice,captain:vCaptain,fa:vFA,draft:vDraft,hub:vHub,lineup:vLineup,match:vMatch,events:vEvents,season:vSeason,champion:vChampion,trade:vTrade,release:vRelease};
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){if(b.disabled)return;const f=UI.sh[b.dataset.act];if(f)f();return;}
  if(e.target.id==='sheet'&&!UI.shLock)closeSheet();
});
render();
if(LOGO_IMG){['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=LOGO_IMG;document.head.appendChild(l);});}
NET.initP=netInit();
slotsLoad().then(()=>{if(!ST&&!NET.on)render();});
upLoadMeta().then(()=>{if(!ST&&!NET.on)render();});
</script>
