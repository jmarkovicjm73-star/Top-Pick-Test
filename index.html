/* ═════════════ JUMP BALL (schnelles Online-Match) ═════════════
   Zwei Spieler: Gegner per Code oder zufällig über eine Warteschlange (Dokument tp/JBQUEUE).
   Schlangen-Draft aus 30 offenen Karten (3 Legends), jeder wählt 10 Spieler, dann Aufstellung und ein Best-of-5.
   Timer nur hier: 20 s pro Pick, 60 s Aufstellung, 30 s pro Angriff. Rematch, wenn beide zustimmen. */
const JB={L:3,S:9,B:12,R:6,PICKS:10,T_PICK:20,T_LU:60,T_ATK:30,Q_FRESH:22000,Q_BEAT:7000};
const JBQ='tp/JBQUEUE';
function jbCardsMiss(){const m=[];if(IDS('L').length<JB.L)m.push(JB.L+' Legends');if(IDS('S').length+IDS('B').length<JB.S+JB.B)m.push((JB.S+JB.B)+' All-Stars oder Basics');if(IDS('R').length<JB.R)m.push(JB.R+' Rookies');return m;}
function jbPool(){
  const take=(a,n)=>shuffle(a).slice(0,n),ord={Legend:0,'All-Star':1,Basic:2,Rookie:3};let best=null;
  for(let t=0;t<60;t++){
    const L=take(IDS('L'),JB.L),S=take(IDS('S'),JB.S),B=take(IDS('B'),JB.B),R=take(IDS('R'),JB.R);
    let p=L.concat(S,B,R);const fill=shuffle(IDS('S').concat(IDS('B')).filter(id=>p.indexOf(id)<0));while(p.length<JB.L+JB.S+JB.B+JB.R&&fill.length)p.push(fill.shift());
    best=p;if(cnt(p,'G')>=7&&cnt(p,'F')>=7&&cnt(p,'C')>=4)break;
  }
  return best.sort((a,b)=>ord[DB[a].tier]-ord[DB[b].tier]||rating(null,b)-rating(null,a));
}
function jbCur(){const j=ST&&ST.jb;return j&&ST.phase==='jb_draft'&&j.picks.length<j.order.length?j.order[j.picks.length]:-1;}
function jbStart(){
  const L=ST.net.lobby;ST.gms=L.players.slice(0,2).map(p=>newGM(p.name,p.team,p.pid,p.uid,false));
  ST.cards=cardsSnapshot();ST.jb.score=[0,0];ST.jb.round=0;if(ST.jb.q)jbQueueClear();jbNewRound();
}
function jbNewRound(){
  const j=ST.jb;j.round++;j.re={};j.res=null;j.picks=[];
  ST.gms.forEach(g=>{g.roster=[];g.inj={};g.buffs=[];g.up={};g.lastLu=null;g.luCustom=null;g.w=0;g.l=0;});
  j.pool=jbPool();j.first=rint(0,1);const a=j.first,b=1-a;j.order=[];
  for(let r=0;r<JB.PICKS;r++){if(r%2===0)j.order.push(a,b);else j.order.push(b,a);}
  ST.sched=[{label:'Jump Ball',stage:'J',games:[{h:b,a:a,hs:null,as:null}]}];ST.md=0;ST.tm=null;ST.phase='jb_draft';
  fx('msg',G_(a).name+' wählt zuerst – '+G_(b).name+' hat dafür Heimvorteil');
}
H.jb_pick=(gi,d)=>{
  if(ST.mode!=='jb'||ST.phase!=='jb_draft'||jbCur()!==gi)return;const j=ST.jb,i=j.pool.indexOf(d.id);if(i<0)return;
  j.pool.splice(i,1);G_(gi).roster.push(d.id);j.picks.push({gi:gi,id:d.id});
  fx('msg',G_(gi).name+' draftet '+DB[d.id].name,othersOf(gi));
  if(j.picks.length>=j.order.length){ST.tm=null;ST.phase='hub';initMd();}
};
H.jb_re=(gi)=>{
  if(ST.mode!=='jb'||ST.phase!=='jb_over'||gi<0||isBot(gi))return;ST.jb.re[gi]=1;
  const hs=humans();if(hs.length===2&&hs.every(i=>ST.jb.re[i]))jbNewRound();else fx('msg',G_(gi).name+' möchte ein Rematch',othersOf(gi));
};
function jbAutoPick(gi){
  const g=G_(gi),miss=missingPos(g.roster),hasL=g.roster.some(id=>DB[id].tier==='Legend');
  return ST.jb.pool.map(id=>({id:id,s:rating(null,id)+(miss.indexOf(DB[id].pos)>-1?8:0)-(hasL&&DB[id].tier==='Legend'?20:0)+Math.random()*2})).sort((a,b)=>b.s-a.s)[0].id;
}
function jbFinish(){
  const md=curMd(),G=md.games[0];if(md.done)return;md.done=1;
  if(G.hs==null)simGame(G);
  const w=G.hs>G.as?G.h:G.a,log=(G.m&&G.m.log)||G.log||[];ST.jb.score[w]=(ST.jb.score[w]||0)+1;
  ST.jb.res={h:G.h,a:G.a,hs:G.hs,as:G.as,w:w,log:log};G.log=log;G.m=null;G.st='done';ST.tm=null;ST.phase='jb_over';
}
function jbTimer(ref,dur){if(!ST.tm||ST.tm.key!=='jb'||ST.tm.ref!==ref){setTimer('jb',dur);ST.tm.ref=ref;}}
function jbHostAuto(){
  ST.rdy=null;const j=ST.jb;
  if(ST.phase==='jb_draft'){jbTimer('p'+j.round+':'+j.picks.length,JB.T_PICK);return;}
  if(ST.phase==='hub'){const md=curMd(),G=md&&md.games[0];if(!G||md.done){ST.tm=null;return;}
    if(G.st==='open')netLineupCheck(G);
    if(G.st==='open'){jbTimer('l'+j.round,JB.T_LU);return;}
    if(G.st==='live'){jbTimer('a'+j.round+':'+G.m.log.length,JB.T_ATK+(G.m.log.length?4:0));return;}
    maybeComplete();}
  if(ST.tm&&ST.tm.key==='jb')ST.tm=null;
}
function jbTimeout(ref){
  ST.tm=null;const j=ST.jb;if(!j)return;
  if(ST.phase==='jb_draft'&&ref==='p'+j.round+':'+j.picks.length){const gi=jbCur();if(gi>=0){H.jb_pick(gi,{id:jbAutoPick(gi)});if(!isBot(gi))fx('msg','Zeit abgelaufen – es wurde automatisch gewählt',[gi]);}return;}
  if(ST.phase!=='hub')return;const G=curMd().games[0];if(!G)return;
  if(G.st==='open'&&ref==='l'+j.round){
    ['h','a'].forEach(sd=>{if(G.rd[sd])return;const gi=sd==='h'?G.h:G.a,g=G_(gi);G['l'+sd]=arrange(luRestore(g,g.lastLu,'bal')).filter(Boolean);G.rd[sd]=1;if(!isBot(gi))fx('msg','Zeit abgelaufen – deine Aufstellung wurde automatisch gesetzt',[gi]);});
    netLineupCheck(G);return;}
  if(G.st==='live'&&ref==='a'+j.round+':'+G.m.log.length){const gi=G.m.turn==='h'?G.h:G.a;if(!isBot(gi))fx('msg','Zeit abgelaufen – automatischer Angriff',[gi]);H.attack(gi,Object.assign({g:0},botMove(G)));}
}

/* Herzschlag des Wartenden: Steht schon jemand anderes in der Schlange, tritt der mit dem größeren Code dem kleineren bei. */
async function jbQueueBeat(){
  if(!NET.on||!NET.host||!ST||ST.mode!=='jb'||ST.phase!=='lobby'||!ST.jb.q)return;
  let v=null;try{const d=await NET.db.doc(JBQ).get();v=d.exists?d.data():null;}catch(e){return;}

}
async function jbQueueClear(){try{const d=await NET.db.doc(JBQ).get();const v=d.exists?d.data():null;if(v&&v.code===NET.code)await NET.db.doc(JBQ).set({code:null,pid:'',at:0});}catch(e){}}
async function jbJoin(code,fromQ){

function tutTeams(){
  const vis=Object.keys(DB).filter(id=>!DB[id].hidden),R=id=>rating(null,id),byR=a=>a.slice().sort((x,y)=>R(y)-R(x));
  const T=(t,p)=>vis.filter(id=>DB[id].tier===t&&DB[id].pos===p);
  const star=T('Legend','G').concat(T('All-Star','G')).sort((a,b)=>DB[b].sh-DB[a].sh)[0];if(!star)return null;
  const B=p=>byR(T('Basic',p).filter(id=>id!==star)),gB=B('G'),fBs=B('F'),cB=B('C');
  if(gB.length<3||fBs.length<3||cB.length<3)return null;
  const g2=gB[0],f1=fBs[0],c1=cB[0],c2=cB[1],base=[star,g2,f1,c1].reduce((a,id)=>a+DB[id].sal,0);
  const fB=byR(T('All-Star','F').filter(id=>DB[id].sal<=CFG.CAP-base))[0]||fBs[1];
  const mine=[star,g2,f1,c1,fB];
  const pool=vis.filter(id=>mine.indexOf(id)<0&&id!==c2&&(DB[id].tier==='Basic'||DB[id].tier==='Rookie')&&DB[id].pd<DB[star].sh);
  let atk=null,def=null;
  for(const d of [f1,g2,fB,c1]){const c=byR(pool).find(id=>DB[id].dr===DB[d].rp);if(c){atk=c;def=d;break;}}
  if(!atk){atk=byR(pool)[0];def=f1;}
  if(!atk)return null;
  const coach=[atk];
  for(const p in CFG.NEED){const need=CFG.NEED[p]-cnt(coach,p);if(need>0)coach.push.apply(coach,byR(pool.filter(id=>DB[id].pos===p&&coach.indexOf(id)<0)).slice(0,need));}
  if(coach.length<5)return null;
  return{star:star,g2:g2,f1:f1,c1:c1,c2:c2,fB:fB,mine:mine,coach:coach,atk:atk,def:def};
}
function tutStart(next){

function tutTick(){
  cancelAnimationFrame(TUT.raf);if(!TUT.on)return;
  if(!ST||ST.mode!=='tut'){TUT.on=false;const L0=$('tut');if(L0)L0.classList.add('hidden');return;}

function tipOnce(k){
  if(!TIPS[k]||(SET.tips&&SET.tips[k])||UI.tipT||TUT.on||!ST)return;
  const ph=ST.phase;
  UI.tipT=setTimeout(function chk(){
    UI.tipT=null;if(!ST||ST.phase!==ph||(SET.tips&&SET.tips[k])||TUT.on)return;
    const busy=!$('sheet').classList.contains('hidden')||!$('arena').classList.contains('hidden')||!$('intro').classList.contains('hidden');

/* ── Soundeffekte (eingebaut, per sfx_*.mp3 ersetzbar) ── */
function sTone(f,d,type,vol,when,f2){const c=AUD.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AUD.sfxOut);o.start(t);o.stop(t+d+0.05);}
function sNoise(d,vol,when,hp,lp){const c=AUD.ctx,t=c.currentTime+(when||0),n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;let node=s;if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;node.connect(f);node=f;}if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;node.connect(f);node=f;}const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);node.connect(g);g.connect(AUD.sfxOut);s.start(t);s.stop(t+d+0.02);}
const SFX_SYN={
  click:()=>sTone(1500,0.04,'triangle',0.22),
  dice:()=>{for(let i=0;i<6;i++){sNoise(0.045,0.45,i*0.075,1800);sTone(260+Math.random()*240,0.035,'square',0.06,i*0.075);}},
  flip:()=>{sNoise(0.2,0.3,0,2200,9000);sTone(500,0.14,'sine',0.08,0,1300);},
  point:()=>{sTone(660,0.12,'triangle',0.32);sTone(990,0.24,'triangle',0.32,0.1);},
  miss:()=>sTone(320,0.32,'sawtooth',0.1,0,140),
  coin:()=>{sTone(2600,0.45,'sine',0.2);sTone(3400,0.3,'sine',0.12,0.02);},
  ball:()=>{sTone(150,0.26,'sine',0.55,0,60);sTone(150,0.16,'sine',0.3,0.3,70);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>sTone(f,i===3?0.5:0.16,'triangle',0.3,i*0.11));},
  lose:()=>{[392,330,262].forEach((f,i)=>sTone(f,i===2?0.55:0.24,'triangle',0.28,i*0.2));},
  buzzer:()=>{sTone(150,0.75,'sawtooth',0.16);sTone(153,0.75,'square',0.07);}
};
async function sfxFile(k){
  if(AUD.buf[k]===undefined){AUD.buf[k]=null;try{const r=await fetch(AUD.sfxFiles[k]);const ab=await r.arrayBuffer();AUD.buf[k]=await AUD.ctx.decodeAudioData(ab);}catch(e){AUD.buf[k]=false;}}
  return AUD.buf[k];
}
function sfx(k){
  if(!AUD||!AUD.ctx||!(+SET.sfx>0))return;
  try{if(AUD.ctx.state==='suspended')AUD.ctx.resume();}catch(e){}
  if(AUD.sfxFiles[k]){sfxFile(k).then(b=>{if(b){const s=AUD.ctx.createBufferSource();s.buffer=b;s.connect(AUD.sfxOut);s.start();}else if(b===false&&SFX_SYN[k])SFX_SYN[k]();});return;}
  if(SFX_SYN[k]){try{SFX_SYN[k]();}catch(e){}}
}
document.addEventListener('pointerdown',()=>audUnlock(),true);
function sfxLoop(k){
  if(!AUD||!AUD.ctx||!(+SET.sfx>0))return()=>{};
  let src=null,g=null,stopped=false;const tm=[];
  if(AUD.sfxFiles[k]){sfxFile(k).then(b=>{if(stopped||!b)return;src=AUD.ctx.createBufferSource();src.buffer=b;src.loop=true;g=AUD.ctx.createGain();g.gain.value=1;src.connect(g);g.connect(AUD.sfxOut);src.start();});}
  else if(k==='lottery'){const tick=()=>{if(stopped)return;try{for(let i=0;i<3;i++)sNoise(0.018,0.12+Math.random()*0.12,Math.random()*0.1,2800);}catch(e){}tm.push(setTimeout(tick,110));};tick();}
  return()=>{if(stopped)return;stopped=true;tm.forEach(clearTimeout);if(src){try{const t=AUD.ctx.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0.0001,t+0.25);src.stop(t+0.3);}catch(e){try{src.stop();}catch(e2){}}}};
}
function duelSfx(myAtt,attWin){haptic(myAtt===attWin?'good':'bad');const k=myAtt?(attWin?'atk_win':'atk_lose'):(attWin?'def_lose':'def_win');sfx(AUD&&AUD.sfxFiles[k]?k:(myAtt===attWin?'point':'miss'));}

/* ═════════════ SPIELSTÄNDE (offline Slots & Online-Räume) ═════════════ */
const SLOT_MAX=8;
let SLOTS=[],ROOMS=[];
const PH_NAME={lobby:'Warteraum',dice:'Preseason',captain:'Preseason',fa:'Free Agency',draft:'Draft',pre_done:'Preseason',hub:'Saison',lineup:'Saison',match:'Saison',events:'Saison',trade:'Tradetime',trade_mid:'Tradetime',release:'Offseason',season:'Saisonende',season_end:'Saisonende',champion:'Beendet'};
function slotKey(id){return 'tp_slot_'+id;}
function newSlotId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function slotMeta(id,s,name){const g=s.gms[0];return{id:id,name:name||TEAMS[g.team].name,team:g.team,season:s.season,rings:g.rings,n:s.gms.length,phase:s.phase,top:mTop(g),md:s.md|0,mds:(s.sched||[]).length,at:Date.now()};}
function slotsSave(){kvSet('tp_slots',JSON.stringify(SLOTS));}
function slotTouch(id,s){const m=SLOTS.find(x=>x.id===id);if(!m||!s||!s.gms||!s.gms.length)return;const g=s.gms[0];Object.assign(m,{team:g.team,season:s.season,rings:g.rings,n:s.gms.length,phase:s.phase,top:mTop(g),md:s.md|0,mds:(s.sched||[]).length,at:Date.now()});SLOTS.sort((a,b)=>b.at-a.at);slotsSave();}
function slotDel(id){SLOTS=SLOTS.filter(x=>x.id!==id);kvDel(slotKey(id));slotsSave();}
function fmtAt(t){try{return new Date(t).toLocaleString(isEN()?'en-US':'de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
async function slotsLoad(){
  try{const v=await kvGet('tp_slots');SLOTS=v?JSON.parse(v):[];}catch(e){SLOTS=[];}
  if(!Array.isArray(SLOTS))SLOTS=[];
  const old=await loadSave();
  if(old&&old.v===2&&Array.isArray(old.gms)&&old.gms.length&&old.phase){const id=newSlotId();kvSet(slotKey(id),JSON.stringify(old));SLOTS.push(slotMeta(id,old));slotsSave();wipeSave();}
  SLOTS.sort((a,b)=>b.at-a.at);
  try{const v=await kvGet('tp_rooms');ROOMS=v?JSON.parse(v):[];}catch(e){ROOMS=[];}
  if(!Array.isArray(ROOMS))ROOMS=[];
  const h=await kvGet('tp_hosting');if(h&&!ROOMS.some(x=>x.code===h))ROOMS.push({code:h,role:'host',name:'',team:0,at:Date.now()-1});
  try{const j=JSON.parse(await kvGet('tp_joined')||'null');if(j&&j.code&&!ROOMS.some(x=>x.code===j.code))ROOMS.push({code:j.code,role:'guest',name:j.name||'',team:j.team|0,at:Date.now()-2});}catch(e){}
  kvDel('tp_hosting');kvDel('tp_joined');ROOMS.sort((a,b)=>b.at-a.at);roomsSave();
  if(ROOMS[0]&&ROOMS[0].name&&!UI.net.name){UI.net.name=ROOMS[0].name;UI.net.team=ROOMS[0].team|0;}
}
async function loadSlot(id){
  const v=await kvGet(slotKey(id));let s=null;try{s=v?JSON.parse(v):null;}catch(e){}
  if(!s||!Array.isArray(s.gms)||!s.gms.length){toast('Dieser Spielstand ist leer oder beschädigt');slotDel(id);render();return;}
  netStop();NET.on=false;ST=s;if(ST.cards)cardsMerge(ST.cards,false);UI.slot=id;UI.saved=null;closeSheet();go(ST.phase==='match'?'hub':ST.phase);
}
function resume(){if(SLOTS[0])loadSlot(SLOTS[0].id);}
function roomsSave(){kvSet('tp_rooms',JSON.stringify(ROOMS));}
function roomAdd(r){const old=ROOMS.find(x=>x.code===r.code);ROOMS=ROOMS.filter(x=>x.code!==r.code);ROOMS.unshift(Object.assign({},old||{},r,{at:Date.now()}));ROOMS=ROOMS.slice(0,20);roomsSave();}
function roomTouch(code,patch){const r=ROOMS.find(x=>x.code===code);if(!r)return;Object.assign(r,patch||{},{at:Date.now()});ROOMS.sort((a,b)=>b.at-a.at);roomsSave();}
function roomDel(code){ROOMS=ROOMS.filter(x=>x.code!==code);roomsSave();if(UI.roomInfo)delete UI.roomInfo[code];}
function roomGo(code){
  const r=ROOMS.find(x=>x.code===code);if(!r)return;closeSheet();
  if(r.role==='host'){UI.hosting=code;resumeHost();}
  else{UI.net.name=r.name||UI.net.name;UI.net.team=r.team|0;UI.net.code=code;joinRoom(code);}
}
async function roomsInfo(){
  if(NET.status!=='ok'||!NET.db||UI.roomInfoBusy)return;UI.roomInfoBusy=true;UI.roomInfo=UI.roomInfo||{};
  for(const r of ROOMS){
    try{const d=await NET.db.doc('tp/'+r.code).get();
      if(!d.exists){UI.roomInfo[r.code]={gone:1};continue;}
      const v=d.data()||{};let st=null;try{st=JSON.parse(v.s);}catch(e){}
      UI.roomInfo[r.code]=st?{phase:st.phase,season:st.season,closed:!!st.closed,humans:(st.gms&&st.gms.length?st.gms.filter(g=>!g.bot).length:(st.net&&st.net.lobby?st.net.lobby.players.length:1)),teams:st.gms&&st.gms.length?st.gms.length:(st.net&&st.net.lobby?st.net.lobby.n:0)}:{};
    }catch(e){}
  }
  UI.roomInfoBusy=false;UI.roomInfoAt=Date.now();if(!ST&&UI.screen==='saves')render();
}
function slotRow(m){return `<div class="item tap" onclick="slotSheet('${m.id}')">${badgeT(m.team)}<div class="grow"><div class="b">${esc(m.name)}</div><div class="s mut">${PH_NAME[m.phase]||'Spiel'} · Saison ${m.season} · 💍 ${m.rings} · ${m.n} Teams</div><div class="s mut">Zuletzt gespielt ${fmtAt(m.at)}</div></div><div class="mut b" style="font-size:20px">›</div></div>`;}
function roomRow(r){
  const i=(UI.roomInfo||{})[r.code],st=!i?'':(i.gone?'<span style="color:var(--bad)">Raum existiert nicht mehr</span>':(i.closed?'<span style="color:var(--bad)">Spiel beendet</span>':`${PH_NAME[i.phase]||'Spiel'}${i.season&&i.phase!=='lobby'?' · Saison '+i.season:''}${i.teams?' · '+i.teams+' Teams':''}`));
  return `<div class="item tap" onclick="roomSheet('${r.code}')">${badgeT(r.team|0)}<div class="grow"><div class="b">Raum ${esc(r.code)} <span class="chip ${r.role==='host'?'acc':''}" style="padding:1px 7px">${r.role==='host'?'Host':'Mitspieler'}</span></div><div class="s mut">${st||'…'}</div><div class="s mut">${r.name?'Als '+esc(r.name)+' · ':''}zuletzt ${fmtAt(r.at)}</div></div><div class="mut b" style="font-size:20px">›</div></div>`;
}
function slotSheet(id){
  const m=SLOTS.find(x=>x.id===id);if(!m)return;
  openSheet(`<div class="row">${badgeT(m.team,1)}<div class="grow"><div class="h2">${esc(m.name)}</div><div class="s mut">${PH_NAME[m.phase]||'Spiel'} · Saison ${m.season} · 💍 ${m.rings} · ${m.n} Teams</div></div></div>
<div class="col mt"><button class="btn ok" data-act="go">▶️ Fortsetzen</button><button class="btn sec" data-act="rn">✏️ Umbenennen</button><button class="btn bad" data-act="del">🗑 Löschen</button><button class="btn sec" data-act="x">Schließen</button></div>`,
  {go:()=>loadSlot(id),x:closeSheet,
   rn:()=>openSheet(`<div class="h2">Spielstand umbenennen</div><input class="inp mt" id="slot-name" maxlength="28" value="${esc(m.name)}"><div class="col mt"><button class="btn ok" data-act="y">Speichern</button><button class="btn sec" data-act="x">Abbrechen</button></div>`,{y:()=>{const v=($('slot-name').value||'').trim().slice(0,28);if(v){m.name=v;slotsSave();}closeSheet();render();},x:()=>slotSheet(id)}),
   del:()=>openSheet(`<div style="font-size:44px;text-align:center">🗑</div><div class="h2" style="text-align:center">„${esc(m.name)}“ löschen?</div><div class="sub mt" style="text-align:center">Der Spielstand wird endgültig gelöscht.</div><div class="col mt"><button class="btn bad" data-act="y">Ja, löschen</button><button class="btn sec" data-act="x">Abbrechen</button></div>`,{y:()=>{slotDel(id);closeSheet();render();},x:()=>slotSheet(id)})});
}
function roomSheet(code){
  const r=ROOMS.find(x=>x.code===code);if(!r)return;const i=(UI.roomInfo||{})[code]||{},dead=i.gone||i.closed,can=NET.status==='ok';
  openSheet(`<div class="row">${badgeT(r.team|0,1)}<div class="grow"><div class="h2">Raum ${esc(code)}</div><div class="s mut">${r.role==='host'?'Du bist Host':'Du bist Mitspieler'}${r.name?' · '+esc(r.name):''}</div></div></div>
${dead?`<div class="res" style="background:rgba(251,113,133,.12);color:var(--bad);font-size:13px">${i.gone?'Diesen Raum gibt es nicht mehr.':'Dieses Spiel wurde beendet.'}</div>`:''}
${can?'':'<div class="s mut mt">Online ist hier nicht verfügbar.</div>'}
<div class="col mt">${dead?'':`<button class="btn ok" data-act="go" ${can?'':'disabled'}>${r.role==='host'?'▶️ Als Host fortsetzen':'▶️ Wieder beitreten'}</button>`}<button class="btn sec" data-act="cp">📋 Code kopieren</button><button class="btn bad" data-act="del">Aus der Liste entfernen</button><button class="btn sec" data-act="x">Schließen</button></div>
<div class="s mut mt" style="text-align:center">Entfernen löscht nur den Eintrag auf diesem Gerät, nicht das Spiel deiner Mitspieler.</div>`,
  {go:()=>roomGo(code),x:closeSheet,cp:()=>{try{navigator.clipboard.writeText(code).then(()=>toast('Code '+code+' kopiert'),()=>toast('Raumcode: '+code));}catch(e){toast('Raumcode: '+code);}},del:()=>{roomDel(code);closeSheet();render();}});
}
function vSaves(){
  if(!UI.roomInfoAt||Date.now()-UI.roomInfoAt>30000)roomsInfo();
  app(`<button class="btn sec sm" onclick="screen('menu')">← Menü</button><div class="mt">${phaseHead('Menü','Spielstände',`Offline speicherst du bis zu ${SLOT_MAX} Spiele auf diesem Gerät. Online-Spiele liegen im Raum und bleiben dort, bis der Host sie beendet.`)}</div>
<div class="panel"><div class="lbl">Offline <span>${SLOTS.length}/${SLOT_MAX}</span></div><div class="col">${SLOTS.map(slotRow).join('')||'<div class="s mut">Noch keine Offline-Spielstände.</div>'}</div>${SLOTS.length<SLOT_MAX?`<button class="btn sec mt" onclick="screen('start')">＋ Neues Offline-Spiel</button>`:'<div class="s mut mt">Alle Plätze belegt – lösche einen Spielstand für ein neues Spiel.</div>'}</div>
<div class="panel"><div class="lbl">Online-Räume <span>${ROOMS.length}</span></div><div class="col">${ROOMS.map(roomRow).join('')||'<div class="s mut">Noch keine Online-Räume.</div>'}</div><button class="btn sec mt" onclick="screen('online')">＋ Raum erstellen oder beitreten</button></div>`);
}

const ICO_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,TITLE:1,CANVAS:1,SVG:1};
function iconize(root){
  if(!root)return;
  if(root.nodeType===3){iconText(root);return;}
  if(root.nodeType!==1||ICO_SKIP[root.nodeName.toUpperCase()])return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[];let n;
  while((n=w.nextNode())){if(EMO_RE.test(n.nodeValue))list.push(n);EMO_RE.lastIndex=0;}
  list.forEach(iconText);
}
function iconText(t){
  const p=t.parentNode;if(!p||ICO_SKIP[p.nodeName.toUpperCase()]||(p.closest&&p.closest('svg,textarea')))return;
  const s=t.nodeValue;EMO_RE.lastIndex=0;if(!EMO_RE.test(s))return;EMO_RE.lastIndex=0;
  const f=document.createDocumentFragment();let last=0,m;
  while((m=EMO_RE.exec(s))){if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));const sp=document.createElement('span');sp.className='icw';sp.innerHTML=icSVG(EMO[m[1]]);f.appendChild(sp);last=m.index+m[0].length;}
  if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
  p.replaceChild(f,t);
}

llung und Duelle funktionieren. Dauert etwa 2 Minuten.":"Learn how cards, lineups and duels work in a short training game. Takes about 2 minutes.","Tutorial spielen":"Play tutorial","Überspringen":"Skip","Du findest das Tutorial jederzeit unter Spielregeln.":"You can find the tutorial any time under Rules.","Zu wenige Karten für das Tutorial":"Not enough cards for the tutorial","Tutorial überspringen":"Skip tutorial","Los geht's":"Let's go","Die Spielerkarte":"The player card","Das ist eine Spielerkarte. Links stehen die Angriffswerte: Shooting (SHO) und Driving (DRV).":"This is a player card. On the left are the attack stats: Shooting (SHO) and Driving (DRV).","Rechts stehen die Abwehrwerte: Perimeter Def (PER) und Zone Def (ZONE).":"On the right are the defense stats: Perimeter Def (PER) and Zone Def (ZONE).","Oben rechts steht die Gesamtwertung, links das Gehalt in Millionen.":"Top right is the overall rating, on the left the salary in millions.","In deiner Starting 5 fehlt ein Forward. Tippe ihn auf der Bank an, um ihn einzuwechseln.":"Your Starting 5 is missing a Forward. Tap him on the bench to sub him in.","Die Starting 5 darf zusammen höchstens 200 Mio kosten. Hier siehst du, wie viel du schon verbrauchst.":"The Starting 5 may cost at most 200M combined. Here you see how much you're already using.","Alles bereit – starte das Spiel!":"All set – start the game!","Du hast Heimvorteil und greifst zuerst an – immer mit einem Guard. Tippe deinen Guard an.":"You have home court and attack first – always with a Guard. Tap your Guard.","Wähle Shooting. Es trifft auf die Perimeter Def des Gegners.":"Choose Shooting. It goes against the opponent's Perimeter Def.","Jetzt ein Ziel: Tippe einen gegnerischen Spieler. Seine Karte siehst du erst im Duell.":"Now a target: tap an opposing player. You'll only see his card in the duel.","Shooting trifft auf Perimeter Def. Der höhere Wert gewinnt den Punkt.":"Shooting meets Perimeter Def. The higher value wins the point.","Jetzt greift der Coach an. Pass auf: Bei Gleichstand gewinnt immer der Verteidiger.":"Now the Coach attacks. Watch out: on a tie, the defender always wins.","Gleichstand – der Verteidiger gewinnt. Punkt für dich!":"Tie – the defender wins. Point for you!","Den Rest spielst du selbst. Viel Erfolg!":"You play the rest yourself. Good luck!","Weiter zu GM Career":"Continue to GM Career","Weiter zu Jump Ball":"Continue to Jump Ball","Weiter zu Ultimate Pick":"Continue to Ultimate Pick","Zurück zu den Spielregeln":"Back to the rules","Training gewonnen!":"Training won!","Gut gekämpft!":"Well fought!","gegen den Coach":"vs the Coach","Das Wichtigste":"The essentials","• Shooting trifft auf Perimeter Def, Driving auf Zone Def.":"• Shooting meets Perimeter Def, Driving meets Zone Def.","• Der höhere Wert gewinnt, bei Gleichstand der Verteidiger.":"• The higher value wins; ties go to the defender.","• Das Heimteam greift zuerst an, immer mit einem Guard.":"• The home team attacks first, always with a Guard.","• Jede Karte spielt nur ein Duell. Wer zuerst 3 Punkte hat, gewinnt.":"• Each card plays only one duel. First to 3 points wins.","• Die Starting 5 darf höchstens":"• The Starting 5 may cost at most","Mio kosten. Auf fremder Position verliert ein Spieler":"M. Out of position, a player loses","Die Modi":"The modes","Mehrere Saisons bis zum TOP PICK Champion":"Several seasons until the TOP PICK Champion","Schnelles Online-Match zu zweit":"Quick online match for two","Rogue-Modus mit Rangliste":"Rogue mode with leaderboard","Tipp":"Tip","Verstanden":"Got it","Jeder zieht verdeckt eine Legend. Sie ist der Star deines Teams und kostet 100 Mio – denk beim Gehalt der übrigen Starting 5 daran.":"Everyone draws a face-down Legend. He's your team's star and costs 100M – keep that in mind for the rest of your Starting 5's salary.","Verpflichte reihum Spieler, bis du 8 hast. Besetze dabei jede Position: Du brauchst mindestens 2 Guards, 2 Forwards und 1 Center. Wer auf fremder Position spielt, verliert 10 Punkte auf alle Werte.":"Sign players in turn until you have 8. Fill every position: you need at least 2 Guards, 2 Forwards and 1 Center. Anyone playing out of position loses 10 points on all stats.","Die Lotterie entscheidet, wer zuerst einen Rookie wählt. Rookies starten mit 0 Sternen. Setzt du deinen Rookie in der Starting 5 ein, kann er über Ereigniskarten aufsteigen: bis zu 3 Sterne, jeder Stern bringt +3 auf alle Werte.":"The lottery decides who picks a rookie first. Rookies start with 0 stars. If you play your rookie in the Starting 5, he can level up through event cards: up to 3 stars, each star adds +3 to all stats.","Ereigniskarten":"Event cards","Nach jedem Spiel zieht jedes Team eine Ereigniskarte: Verletzungen, Boni fürs nächste Spiel, Trade- oder Pick-Karten. Trade-Karten brauchst du in der Offseason für neue Spieler, Pick-Karten für den Draft.":"After every game each team draws an event card: injuries, bonuses for the next game, trade or pick cards. You need trade cards in the offseason for new players, pick cards for the draft.","Tausche Spieler, Trade- und Pick-Karten mit anderen GMs. Der Wert beider Seiten muss ausgeglichen sein, und jede Position muss danach noch besetzt sein.":"Trade players, trade cards and pick cards with other GMs. Both sides must be balanced in value, and every position must still be filled afterwards.","Jump-Ball-Draft":"Jump Ball draft","Ihr wählt abwechselnd aus 30 Karten. Achte auf alle Positionen und aufs Gehalt: Zwei Legends (je 100 Mio) passen nicht zusammen in die Starting 5.":"You take turns picking from 30 cards. Watch all positions and the salary: two Legends (100M each) don't fit into the Starting 5 together.","Wähle in jeder Runde 1 von 3 Spielern. Am Ende brauchst du mindestens 2 Guards, 2 Forwards und 1 Center.":"Pick 1 of 3 players each round. In the end you need at least 2 Guards, 2 Forwards and 1 Center.","Gib bis zu 3 Spieler gegen Trade-Karten ab und kauf im Shop neue. Ein Rookie bringt mehr, je mehr Sterne er hat.":"Release up to 3 players for trade cards and buy new ones in the shop. A rookie is worth more the more stars he has.","Leicht":"Light","Mittel":"Medium","Stark":"Strong","Vibriert bei jedem Punkt im Duell – zweimal kurz bei deinem Punkt, einmal lang beim Gegenpunkt.":"Vibrates on every duel point – two short pulses for your point, one long pulse for the opponent's.","Dein Gerät kann im Browser nicht vibrieren (z. B. iPhone). In der App-Version kommt das dazu.":"Your device can't vibrate in the browser (e.g. iPhone). This will come with the app version.","Regelwerk für jeden Modus · Tutorial":"Rules for every mode · Tutorial","Das Regelwerk für jeden Modus.":"The rules for every mode.","🎓 Tutorial spielen":"🎓 Play tutorial","Grundlagen":"Basics","Karten:":"Cards:","Gehalt:":"Salary:","Duell:":"Duel:","Ablauf:":"Flow:","Sieg:":"Winning:","Spielen oder simulieren:":"Play or simulate:","Ereigniskarten:":"Event cards:","Verletzungen:":"Injuries:","Es gibt vier Stufen: Legends, All-Stars, Basics und Rookies. Jede Karte hat zwei Angriffswerte (Shooting, Driving) und zwei Abwehrwerte (Perimeter Def, Zone Def). Die Gesamtwertung (OVR) berechnet das Spiel aus diesen Werten.":"There are four tiers: Legends, All-Stars, Basics and Rookies. Each card has two attack stats (Shooting, Driving) and two defense stats (Perimeter Def, Zone Def). The game calculates the overall rating (OVR) from these.","Legends kosten immer 100 Mio, Rookies 10 Mio, All-Stars 20–38 Mio und Basics 5–15 Mio – je stärker, desto teurer.":"Legends always cost 100M, rookies 10M, All-Stars 20–38M and Basics 5–15M – the stronger, the pricier.","Deine Starting 5 besteht aus 2 Guards, 2 Forwards und 1 Center und darf zusammen höchstens":"Your Starting 5 consists of 2 Guards, 2 Forwards and 1 Center and may cost at most","Mio kosten. Ein Spieler auf fremder Position verliert":"M combined. A player out of position loses","Der Angreifer wählt Shooting oder Driving und ein beliebiges Ziel. Shooting trifft auf Perimeter Def, Driving auf Zone Def. Der höhere Wert gewinnt den Punkt, bei Gleichstand der Verteidiger. Die Karten des Gegners sind verdeckt, bis sie im Duell aufgedeckt werden.":"The attacker picks Shooting or Driving and any target. Shooting meets Perimeter Def, Driving meets Zone Def. The higher value wins the point; ties go to the defender. The opponent's cards stay face down until revealed in a duel.","Das Heimteam greift zuerst an, immer mit einem Guard. Danach wechseln sich die Teams ab. Jede Karte spielt nur ein Duell, Angreifer und Verteidiger sind danach verbraucht.":"The home team attacks first, always with a Guard. Then the teams alternate. Each card plays only one duel; attacker and defender are used up afterwards.","Best of 5: Wer zuerst 3 Punkte hat, gewinnt das Spiel.":"Best of 5: first to 3 points wins the game.","Vor dem Start legt ihr fest, wie viele Ringe zum Sieg nötig sind: 2 Ringe, eine eigene Zahl (1–10) oder frei ohne Ende. Wer das Ziel zuerst erreicht, ist TOP PICK Champion.":"Before the start you set how many rings it takes to win: 2 rings, your own number (1–10) or free play without an end. Whoever reaches the goal first is TOP PICK Champion.","Würfeln für die GM-Reihenfolge → jeder zieht verdeckt eine Legend als Kapitän → Free Agency: 8 Karten liegen offen, reihum verpflichtet jeder einen Spieler, bis jeder 8 Spieler hat → Draft-Lotterie: jeder bekommt einen Rookie.":"Roll for GM order → everyone draws a face-down Legend as captain → free agency: 8 cards lie face up, everyone signs one player in turn until each has 8 → draft lottery: everyone gets a rookie.","Hinrunde, Tradetime zur Saisonmitte, Rückrunde – jeder spielt gegen jeden. Die besten vier spielen die Playoffs (Halbfinale, Finale). Der Sieger des Finales bekommt einen Ring.":"First half, trade window at midseason, second half – everyone plays everyone. The top four play the playoffs (semifinal, final). The winner of the final gets a ring.","Dein eigenes Spiel t has to keep the app open during the game.","Die erste Niederlage beendet den Run (10 Trostpunkte pro gewonnenem Duell). Dein bester Run kommt in die Rangliste.":"The first loss ends the run (10 consolation points per duel won). Your best run goes on the leaderboard.","Neue Karten!":"New cards!","Noch eine Meisterschaft – diese Karten sind jetzt Obsidian.":"One more championship – these cards are now obsidian.","Meisterschaft gewonnen – diese Karten standen in der Starting 5 des Finales.":"Championship won – these cards were in the Starting 5 of the final.","Mit diesen Karten hast du zum ersten Mal gewonnen. Sie sind jetzt im Album sichtbar.":"You won with these cards for the first time. They are now visible in the album.","Im Album kannst du für jede Karte den Skin wählen.":"In the album you can choose the skin for every card.","Sammle alle Karten – von gesperrt bis Obsidian.":"Collect every card – from locked to obsidian.","ℹ️ Stufen":"ℹ️ Levels","Alle Karten dieser Kategorie sind Obsidian 🟣":"All cards in this category are obsidian 🟣","Alle Karten sind Gold. Jede Karte wird Obsidian, sobald sie noch eine Meisterschaft gewinnt (Starting 5 des Finales).":"All cards are gold. Each card turns obsidian as soon as it wins one more championship (Starting 5 of the final).","Kategorie komplett in Gold 🥇 · Obsidian gibt es, sobald alle Karten aller Kategorien Gold sind.":"Category complete in gold 🥇 · Obsidian unlocks once every card in every category is gold.","Gesperrte Karte":"Locked card","Gewinne ein Spiel mit dieser Karte in deiner Starting 5, um sie freizuschalten. Das gilt in jedem Modus, online und offline. Simulierte Spiele und das Tutorial zählen nicht.":"Win a game with this card in your Starting 5 to unlock it. This works in every mode, online and offline. Simulated games and the tutorial don't count.","🥈 Silber: Gewinne eine Meisterschaft im GM-Karriere-Modus mit dieser Karte in der Starting 5 des Finales.":"🥈 Silver: Win a championship in GM Career with thi function isEN(){return SET.lang!=='de';}
const TR={trie:null,pre:null,post:null,cache:new Map(),out:new Set()};
const TR_W=/[A-Za-z0-9ÄÖÜäöüß]/,TR_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
function trBuild(){
  const root=Object.create(null);
  Object.keys(I18N.sub).forEach(k=>{let n=root;for(const ch of k.split('')){n=n[ch]||(n[ch]=Object.create(null));}n['\u0000']=I18N.sub[k];});
  TR.trie=root;TR.pre=I18N.pre.map(x=>[new RegExp(x[0]),x[1]]);TR.post=I18N.post.map(x=>[new RegExp(x[0],'g'),x[1]]);
}
function trTrie(s){
  let out='',i=0;const n=s.length;
  while(i<n){
    let node=TR.trie,j=i,best=-1,bv=null;const st=!(TR_W.test(s[i])&&i>0&&TR_W.test(s[i-1]));
    if(st)while(j<n){node=node[s[j]];if(!node)break;j++;const v=node['\u0000'];if(v!==undefined&&(!TR_W.test(s[j-1])||j>=n||!TR_W.test(s[j]))){best=j;bv=v;}}
    if(best>0){out+=bv;i=best;}else{out+=s[i];i++;}
  }
  return out;
}
function trStr(s){
  if(!s||!isEN()||!/[A-Za-zÄÖÜäöüß]{2}/.test(s)||TR.out.has(s))return s;
  const c=TR.cache.get(s);if(c!==undefined)return c;
  if(!TR.trie)trBuild();
  const lead=s.match(/^\s*/)[0],core=s.trim(),trail=core?s.slice(lead.length+core.length):'';
  let r=I18N.exact[core];if(r===undefined)r=I18N.sub[core];
  if(r===undefined){r=core;TR.pre.forEach(x=>{r=r.replace(x[0],x[1]);});r=trTrie(r);TR.post.forEach(x=>{r=r.replace(x[0],x[1]);});}
  r=lead+r+trail;
  if(TR.cache.size>8000){TR.cache.clear();TR.out.clear();}
  TR.cache.set(s,r);TR.out.add(r);return r;
}
function trNode(t){if(!isEN())return;const p=t.parentNode;if(!p||TR_SKIP[p.nodeName])return;const v=t.nodeValue,r=trStr(v);if(r!==v)t.nodeValue=r;}
function trTree(root){
  if(!root||!isEN())return;
  if(root.nodeType===3){trNode(root);return;}
  if(root.nodeType!==1||TR_SKIP[root.nodeName])return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[];let n;
  while((n=w.nextNode()))list.push(n);list.forEach(trNode);
  const els=[root].concat(Array.prototype.slice.call(root.querySelectorAll('[placeholder],[aria-label],[title]')));
  els.forEach(el=>{['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const r=trStr(v);if(r!==v)el.setAttribute(a,r);}});});
}
function setLang(l){
  if(l!=='de')l='en';if((SET.lang||'en')===l)return;
  SET.lang=l;saveSettings();TR.cache.clear();TR.out.clear();document.documentElement.lang=l;closeSheet();render();trTree(document.body);
}

/* ── Gegner & Stufen ── */
function upMakeOpp(st){
  const me=G_(0),mine=new Set(me.roster),boss=st%5===0;
  let nL=st>=10?2:(st>=7?1:0),nS=st>=10?4:(st>=7?3:(st>=4?2:0));if(boss)nL=Math.max(nL,1);
  const pools={L:shuffle(IDS('L').filter(x=>!mine.has(x))),S:shuffle(IDS('S').filter(x=>!mine.has(x))),B:shuffle(IDS('B').filter(x=>!mine.has(x)))};
  if(st<=2)pools.B.sort((a,b)=>rating(null,a)-rating(null,b));
  const want={G:3,F:3,C:2},tiers=[];for(let i=0;i<nL;i++)tiers.push('L');for(let i=0;i<nS;i++)tiers.push('S');while(tiers.length<8)tiers.push('B');
  const roster=[];
  tiers.forEach(t=>{const take=p=>p.find(x=>want[DB[x].pos]>0&&roster.indexOf(x)<0);const id=take(pools[t])||take(pools.S)||take(pools.B);if(id){roster.push(id);want[DB[id].pos]--;}});
  const others=[0,1,2,3,4,5].filter(t=>t!==me.team),o=upGM(pick(BOT_NAMES),pick(others),true);
  o.roster=roster;const n=(st>=10?Math.floor((st-8)/2):0)+(boss?1:0);if(n>0)roster.forEach(id=>{o.up[id]={n:n};});
  o.capX=nL*60+(boss?40:0)+(st>=10?40:0);
  ST.gms[1]=o;ST.up.boss=boss;ST.up.scout=shuffle(roster.slice()).slice(0,2);
  const home=st%2===1;
  ST.sched=[{stage:'UP',label:`Stufe ${st}${boss?' · Boss':''}`,games:[{h:home?0:1,a:home?1:0,hs:null,as:null}]}];ST.md=0;
}
function upNextStage(){const u=ST.up;upMakeOpp(u.stage);u.relLeft=3;u.shop=[];u.reward=null;ST.phase='up_hub';upSave();go('up_hub');}

/* ── Punkte nach dem Spiel ── */
function upAfterGame(m){
  const u=ST.up,s=u.stage,g=G_(0),o=G_(1),myIds=m.me.map(x=>x.id),opIds=m.op.map(x=>x.id),win=m.sMe>m.sOp;u.lastLu=myIds;u.lastLu2=myIds.slice();
  if(win){
    let a=0,b=0,cb=false;m.log.forEach(l=>{if(l.me)a++;else b++;if(b===2&&a===0)cb=true;});
    const avg=(gg,ids)=>ids.reduce((x,id)=>x+rating(gg,id),0)/Math.max(1,ids.length),und=avg(o,opIds)>avg(g,myIds);
    const last=m.log[m.log.length-1],myCard=last?(myIds.indexOf(last.a)>-1?last.a:last.d):null,rk=!!myCard&&DB[myCard].tier==='Rookie';
    const parts=[['Sieg',100],[`Stufe ${s}`,20*s]];
    if(m.sOp===0)parts.push(['Sweep 3:0',50]);else if(m.sOp===1)parts.push(['Sieg 3:1',25]);
    if(cb)parts.push(['Comeback nach 0:2',40]);if(und)parts.push(['Underdog',30]);if(rk)parts.push(['Rookie entscheidet',15]);if(u.boss)parts.push(['Boss besiegt',50]);
    u.wins++;const mult=u.wins>=10?1.5:(u.wins>=5?1.2:1),tot=Math.round(parts.reduce((x,p)=>x+p[1],0)*mult);
    u.score+=tot;u.games.push({s:s,me:m.sMe,op:m.sOp,pts:tot,opp:o.name,team:o.team});u.last={parts:parts,mult:mult,tot:tot,win:true};
    u.stage++;upPrepReward();ST.phase='up_reward';upSave();go('up_reward');
  }else{
    const tot=10*m.sMe;u.score+=tot;u.games.push({s:s,me:m.sMe,op:m.sOp,pts:tot,opp:o.name,team:o.team});
    u.last={parts:[['Trostpunkte · '+m.sMe+' gewonnene Duelle',tot]],mult:1,tot:tot,win:false};upFinish();
  }
}

(function(){
  let T=null,on=false,x0=0,y0=0,eatClick=0;
  const el=()=>{let z=document.getElementById('cpeek');if(!z){z=document.createElement('div');z.id='cpeek';z.className='cpeek';document.body.appendChild(z);}return z;};
  const owner=id=>{if(!ST||!ST.gms)return null;const g=ST.gms.find(x=>x.roster&&x.roster.indexOf(id)>-1);return g||null;};
  const show=t=>{const id=t.dataset.cid;if(!DB[id])return;const z=el();
    const sk=t.dataset.sk;z.innerHTML=`<div class="cz-card">${sk?cardHTML(id,null,{skin:sk,full:1,gl:4}):cardHTML(id,owner(id),{oop:t.dataset.oop==='1'})}</div>`;z.classList.add('on');on=true;eatClick=Date.now();
    try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}};
  const hide=()=>{clearTimeout(T);T=null;if(on){const z=el();z.classList.remove('on');z.innerHTML='';on=false;eatClick=Date.now();}};
  document.addEventListener('pointerdown',e=>{
    if(e.button>0)return;const t=e.target.closest('[data-cid]');if(!t||t.closest('#cpeek,#czoom,.alb-l'))return;
    x0=e.clientX;y0=e.clientY;clearTimeout(T);T=setTimeout(()=>{T=null;show(t);},420);
  },true);
  document.addEventListener('pointermove',e=>{if(T&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10)){clearTimeout(T);T=null;}},true);
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,hide,true));
  window.addEventListener('blur',hide);
  document.addEventListener('touchmove',e=>{if(on)e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',e=>{if(on||e.target.closest('[data-cid]'))e.preventDefault();},true);
  document.addEventListener('click',e=>{if(Date.now()-eatClick<350&&e.target.closest('[data-cid]')){e.stopPropagation();e.preventDefault();}},true);
})();

}
function cardZoomClose(){const z=document.getElementById('czoom');if(!z)return;z.classList.add('out');setTimeout(()=>{z.classList.remove('on','out');z.innerHTML='';navSoon();},180);}

/* ═════════════ ZURÜCK-TASTE (Handy) ═════════════
   Zurück wischen/drücken geht eine Ebene zurück. Im Hauptmenü schließt die App. */
function navZoomOn(){const z=document.getElementById('czoom');return !!(z&&z.classList.contains('on'));}
function navRoot(){return !ST&&!NET.on&&(!UI.screen||UI.screen==='title'||UI.screen==='menu')&&$('sheet').classList.contains('hidden')&&!navZoomOn();}
function navSync(){
  try{
    const want=!navRoot();
    if(want&&!NAV.armed){history.pushState({tp:1},'');NAV.armed=true;}
    else if(!want&&NAV.armed){NAV.armed=false;NAV.skip++;history.back();}
  }catch(e){}
}
function navSoon(){clearTimeout(NAV.t);NAV.t=setTimeout(navSync,30);}
function navTwice(k,msg){const now=Date.now();if(NAV.warnK===k&&now-NAV.warnAt<2600){NAV.warnK='';return true;}NAV.warnK=k;NAV.warnAt=now;toast(msg);return false;}
function navBack(){
  if(navZoomOn()){cardZoomClose();return;}
  const ar=$('arena');if(ar&&!ar.classList.contains('hidden'))return;   // Duell-Animation läuft
  if(!$('sheet').classList.contains('hidden')){if(!UI.shLock)closeSheet();return;}
  if(UI.spin)return;                                                      // Lotterie dreht
  if(ST&&ST.mode==='tut'){tutEnd();return;}
  if(UI.luSel){UI.luSel=null;UI.luSwap=false;render();return;}
  if(!ST){const sc=UI.screen||'title';if(sc==='upboard'){screen('up');return;}if(sc==='rules'){screen('settings');return;}if(sc==='account'&&(UI.acc.v==='forgot'||UI.acc.v==='reg')&&!accOn()){UI.acc.v='login';UI.acc.msg=null;render();return;}if(sc!=='title'&&sc!=='menu')screen('menu');return;}
  if(NET.on&&ST&&ST.mode==='jb'){
    if(UI.sel){UI.sel=null;render();return;}
    if(ST.phase==='lobby'){jbCancel();return;}
    if(!navTwice('jb','Nochmal zurück: Du verlässt das Match'))return;
    quitOnline();return;
  }
  if(NET.on){
    if(UI.sel){UI.sel=null;render();return;}
    if(UI.view){UI.view=null;render();return;}
    if(UI.tab&&UI.tab!=='md'){UI.tab='md';render();return;}
    if(NET.host&&ST.phase!=='lobby'&&!navTwice('host','Nochmal zurück: Das Spiel pausiert für alle, bis du zurückkommst'))return;
    leaveOnline();return;
  }
  if(ST.phase==='match'&&UI.m){
    if(UI.m.phase==='def'&&UI.m.myTurn){cancelAtk();return;}
    if(!navTwice('match','Nochmal zurück: Das laufende Spiel wird abgebrochen'))return;
    toMenuOffline();return;
  }
  if(ST.phase==='lineup'){UI.lu=null;UI.luSel=null;UI.luSwap=false;ST.phase=ST.mode==='up'?'up_hub':'hub';window.scrollTo(0,0);render();return;}
  if(ST.phase==='hub'&&UI.tab!=='md'){UI.tab='md';render();return;}
  toMenuOffline();
}
window.addEventListener('popstate',()=>{
  if(NAV.skip>0){NAV.skip--;return;}
  NAV.armed=false;
  try{navBack();}catch(e){console.warn(e);}
  navSoon();
});

/* ═════════════ VIEWS & START ═════════════ */
const VIEWS={tut_card:vTutCard,tut_done:vTutDone,up_draft:vUpDraft,up_hub:vUpHub,up_reward:vUpReward,up_shop:vUpShop,up_over:vUpOver,start:vStart,dice:vDice,captain:vCaptain,fa:vFA,draft:vDraft,hub:vHub,lineup:vLineup,match:vMatch,events:vEvents,season:vSeason,champion:vChampion,trade:vTrade,release:vRelease};
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){if(b.disabled)return;const f=UI.sh[b.dataset.act];if(f)f();return;}
  if(e.target.id==='sheet'&&!UI.shLock)closeSheet();
});
render();
if(LOGO_IMG){['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=LOGO_IMG;document.head.appendChild(l);});}
NET.initP=netInit();
slotsLoad().then(()=>{if(!ST&&!NET.on)render();});
upLoadMeta().then(()=>{if(!ST&&!NET.on)render();});
</script>
